; Sequoia OBD box (2026-10-17) - ESP32 (classic, WROOM-32 DevKit: needs Bluetooth Classic,
; so NOT an ESP32-C3/S3) in the 2016 Sequoia. Talks to the ELM327 mini over Bluetooth like
; Torque does and POSTs readings to Home Assistant through a Home Assistant Cloud webhook.
; Build:  pio run   (first run python3 make_secrets.py: it writes src/secrets.h from the ESPHome secrets.yaml
;         and .sequoia_cloudhook_url in SECRETS_DIR, default ../esphome next to this repo folder)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
  powerbroker2/ELMduino
