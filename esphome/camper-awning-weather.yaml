# Awning controller for a Lippert Solera-style 12 V power awning. One box
# on the outer arm next to the roller tube (where the motor is): ESP32,
# BTS7960 motor driver, ACS712 current sensor, MPU-6050 and a 12->5 V buck.
# The factory motor pair down the arm becomes the 12 V feed; a thin 4-core
# cable alongside it carries the wall rocker (manual override) and the
# "closed" reed switch from the bottom of the rail. See the build guide.
substitutions:
  device_name: camper-awning-weather
  friendly_name: "Camper Awning"

  # ---- MOTOR DRIVER ----
  # BTS7960 (IBT-2) 43 A H-bridge board. GPIO25 -> RPWM (extend),
  # GPIO26 -> LPWM (retract), R_EN + L_EN tied to 3.3 V, board VCC on
  # 3.3 V. Inputs are active-high; 10k pull-downs keep it off at boot.
  # The wall rocker drives the same inputs through 33k resistors, so it
  # works even with the ESP32 dead.

  # ---- MOTOR CURRENT (ACS712 or similar) ----
  # The zero point is learned automatically whenever the motor is off, so
  # there's nothing to measure for it. amps_per_volt depends on the module
  # and on the resistor divider in front of the ESP32 pin:
  #   ACS712-20A = 100 mV/A on a 5 V supply; its output swings up to 5 V,
  #   which is too much for the ESP32, so put a 10k/10k divider in front of
  #   GPIO39. That halves it to 50 mV/A -> 20 A per volt.
  motor_amps_per_volt: "20.0"
  # The stall limit ("Stall Current") is a setting in Home Assistant: check
  # the "Motor Current" reading during a normal run and set it a few amps
  # above that. The motor does NOT stall at full open: it keeps turning and
  # rolls the fabric back up upside down, so full open is stopped by the
  # tilt (see POSITION).
  # Ignore the start-up surge for this long after the motor turns on.
  inrush_ignore_ms: "750"
  # Current above this with the firmware's motor off = someone is running it
  # from the wall rocker. The wind check waits while that happens.
  manual_run_amps: "1.0"

  # ---- TRAVEL CHECKS ----
  # Backstop: "Max Run Time" in Home Assistant. Never runs longer than that
  # in one go. After a full open and close, look at Last Open Time / Last
  # Close Time and set it about 3 s above the slower one. Keep it tight:
  # past full open the motor keeps rolling the fabric back up upside down.
  # If the position doesn't change by 2% within this time while the motor
  # is on, stop and report a problem.
  no_progress_ms: "3000"

  # ---- POSITION ----
  # Calibrated from Home Assistant, no reflash: close the awning, press
  # "Save Closed Position"; open it fully, press "Save Open Position".
  # The firmware saves the direction of gravity at both ends and works out
  # 0-100 % from how far the arm has turned between them, so it doesn't
  # matter which way the GY-521 is mounted. Until both are saved it doesn't
  # stop at a position or at 100% (only the past-full-open check below,
  # the reed switch, stall current and the travel timer).
  # Past-full-open check (works before calibration too): while opening,
  # the arm tilt keeps falling. Once the fabric starts rolling back up
  # upside down the arms rise again, so if the tilt climbs this many
  # degrees above the lowest it reached, stop at once.
  overrun_tilt_deg: "4.0"

  # ---- WIND (Z axis of the MPU-6050) ----
  # "Wind Shake" is how far the Z reading jumps away from its smoothed
  # value, in m/s² (biggest jump in each 100 ms). Watch it in HA on a
  # breezy day and set "Wind Shake Limit" in HA above normal flapping.
  # Retract when this many of the last 10 x 100 ms windows (1 second) are
  # over the threshold (only while "Wind Auto-Retract" is on).
  wind_hits: "3"

  # Anemometer (optional): pulses per second -> mph.
  wind_mph_per_hz: "1.492"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - script.execute: show_calibration

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

api:
  encryption:
    key: !secret camper_awning_api_key

ota:
  platform: esphome
  password: !secret camper_awning_ota_password

logger:

# MPU-6050 (GY-521) in the same box, a few cm from the ESP32, so I2C runs at
# full speed. It sits on the bottom-row pins next to the other wiring; its
# VCC is on 5 V (the GY-521 has its own 3.3 V regulator and pull-ups).
i2c:
  sda: GPIO33
  scl: GPIO13
  scan: true
  frequency: 400kHz

globals:
  # Smoothed (gravity-only) accelerometer reading
  - id: g_x
    type: float
    initial_value: 'NAN'
  - id: g_y
    type: float
    initial_value: 'NAN'
  - id: g_z
    type: float
    initial_value: 'NAN'
  - id: z_peak                # biggest Z jump in the current 100 ms
    type: float
    initial_value: '0'
  - id: shake_1s              # biggest Z jump in the last second (for HA)
    type: float
    initial_value: '0'
  - id: win_bits              # last 10 x 100 ms windows, 1 = over threshold
    type: uint16_t
    initial_value: '0'
  - id: awning_pos            # 0.0 closed .. 1.0 open (NAN until known)
    type: float
    initial_value: 'NAN'
  # Motor run bookkeeping
  - id: run_dir               # 1 = extending, -1 = retracting, 0 = stopped
    type: int
    initial_value: '0'
  - id: run_start_ms
    type: uint32_t
    initial_value: '0'
  - id: run_start_pos
    type: float
    initial_value: 'NAN'
  - id: last_progress_ms
    type: uint32_t
    initial_value: '0'
  - id: last_progress_pos
    type: float
    initial_value: 'NAN'
  - id: target_pos            # set by a position command, -1 = none
    type: float
    initial_value: '-1'
  - id: motor_zero_v
    type: float
    initial_value: 'NAN'
  - id: motor_amps
    type: float
    initial_value: '0'
  - id: stop_reason
    type: std::string
    initial_value: '""'
  - id: min_tilt              # lowest Arm Tilt in this open run
    type: float
    initial_value: 'NAN'
  - id: left_closed           # this open run has left the reed switch
    type: bool
    initial_value: 'false'
  # Saved gravity direction at closed and at full open (the calibration).
  # Kept through reboots and power loss.
  - id: cal_closed_x
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: cal_closed_y
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: cal_closed_z
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: cal_open_x
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: cal_open_y
    type: float
    restore_value: true
    initial_value: 'NAN'
  - id: cal_open_z
    type: float
    restore_value: true
    initial_value: 'NAN'

binary_sensor:
  # Closed sensor: sealed reed switch at the bottom of the wall rail, magnet
  # on the knee end of the inner arm. Two wires of the 4-core cable bring it
  # up to GPIO32 and GND (closes when the magnet is near).
  - platform: gpio
    pin:
      number: GPIO32
      mode: INPUT_PULLUP
      inverted: true
    name: "${friendly_name} Closed"
    id: limit_closed
    filters:
      - delayed_on_off: 50ms
    on_press:
      - if:
          condition:
            lambda: 'return id(run_dir) == -1;'
          then:
            - lambda: 'id(stop_reason) = "Closed";'
            - script.execute: stop_motor
      # Reed closing while OPENING = it went past full open and rolled the
      # fabric all the way back up upside down. Backup to the tilt check.
      - if:
          condition:
            lambda: 'return id(run_dir) == 1 && id(left_closed);'
          then:
            - lambda: 'id(stop_reason) = "Problem: went past full open";'
            - script.execute: stop_motor

  # Optional rain sensor (not connected yet: reads dry).
  - platform: gpio
    pin:
      number: GPIO14
      mode: INPUT_PULLUP
      inverted: true
    name: "${friendly_name} Rain Detected"
    device_class: moisture

  - platform: template
    name: "${friendly_name} Wind Detected"
    device_class: safety
    lambda: 'return __builtin_popcount(id(win_bits)) >= ${wind_hits};'
    filters:
      - delayed_off: 10s

sensor:
  - platform: mpu6050
    address: 0x68
    update_interval: 20ms
    accel_x:
      id: accel_x
      internal: true
    accel_y:
      id: accel_y
      internal: true
    accel_z:
      id: accel_z
      internal: true

  # Tilt of the board away from flat, from the smoothed gravity direction:
  # about 90° when the awning is closed (box standing up) down to near 0°
  # when it's fully open (box lying flat).
  - platform: template
    name: "${friendly_name} Arm Tilt"
    id: arm_tilt
    unit_of_measurement: "°"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 200ms
    lambda: |-
      float m = sqrtf(id(g_x) * id(g_x) + id(g_y) * id(g_y) + id(g_z) * id(g_z));
      if (isnan(m) || m < 1.0f) return {};
      return acosf(clamp(fabsf(id(g_z)) / m, 0.0f, 1.0f)) * 57.2958f;
    filters:
      - or:
          - throttle: 300s
          - delta: 0.5

  - platform: template
    name: "${friendly_name} Position"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 1s
    lambda: |-
      if (isnan(id(awning_pos))) return {};
      return id(awning_pos) * 100.0f;
    filters:
      - or:
          - throttle: 60s
          - delta: 1.0

  - platform: template
    name: "${friendly_name} Wind Shake"
    unit_of_measurement: "m/s²"
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 1s
    lambda: 'return id(shake_1s);'
    filters:
      - or:
          - throttle: 300s
          - delta: 0.3

  # Motor current. Raw ADC is internal; the published value is throttled.
  - platform: adc
    pin: GPIO39
    id: motor_raw_v
    internal: true
    update_interval: 50ms
    attenuation: 12db
    filters:
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1
    on_value:
      then:
        - lambda: |-
            if (isnan(id(motor_zero_v))) id(motor_zero_v) = x;
            float amps = fabsf((x - id(motor_zero_v)) * ${motor_amps_per_volt});
            id(motor_amps) = amps;
            if (id(run_dir) == 0) {
              // Motor off: slowly learn the zero-current voltage, but only
              // from readings close to it. A run from the wall rocker must
              // not be learned as "zero".
              if (fabsf(x - id(motor_zero_v)) < 0.05f)
                id(motor_zero_v) += 0.02f * (x - id(motor_zero_v));
              return;
            }
            if (millis() - id(run_start_ms) < ${inrush_ignore_ms}) return;
            if (amps > id(stall_amps).state) {
              // Only closing can stall at an end (closed tight). Opening has
              // no end stop, so a stall while opening is always a problem.
              bool known = !isnan(id(awning_pos));
              if (id(run_dir) == -1 && (id(limit_closed).state || !known || id(awning_pos) < 0.1f)) {
                id(stop_reason) = "Closed";
              } else if (!known) {
                id(stop_reason) = "Problem: stalled while opening";
              } else {
                char buf[48];
                snprintf(buf, sizeof(buf), "Problem: stalled at %d%%", (int) (id(awning_pos) * 100));
                id(stop_reason) = buf;
              }
              id(stop_motor).execute();
            }

  - platform: template
    name: "${friendly_name} Motor Current"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: 1s
    lambda: 'return id(motor_amps);'
    filters:
      - or:
          - throttle: 300s
          - delta: 0.3

  # Seconds the last full open / full close took (closed <-> open).
  # A run that's much slower than usual means trouble.
  - platform: template
    name: "${friendly_name} Last Open Time"
    id: last_open_time
    unit_of_measurement: "s"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never
  - platform: template
    name: "${friendly_name} Last Close Time"
    id: last_close_time
    unit_of_measurement: "s"
    accuracy_decimals: 1
    entity_category: diagnostic
    update_interval: never

  # Optional cup anemometer (not connected yet: reads 0).
  - platform: pulse_counter
    pin:
      number: GPIO27
      mode: INPUT_PULLUP
    name: "${friendly_name} Wind Speed"
    unit_of_measurement: "mph"
    update_interval: 5s
    filters:
      # pulse_counter reports pulses/min -> Hz -> mph
      - lambda: return (x / 60.0) * ${wind_mph_per_hz};

text_sensor:
  # "Open", "Closed", "Opening", "Closing", "Stopped at 40%", or
  # "Problem: ..." / "Wind: ..." - HA can alert on those last two.
  - platform: template
    name: "${friendly_name} Status"
    id: awning_status
    update_interval: never
  - platform: template
    name: "${friendly_name} Calibration"
    id: cal_status
    icon: mdi:tune-variant
    entity_category: diagnostic
    update_interval: never

# Calibration and test buttons
button:
  - platform: template
    name: "${friendly_name} Save Closed Position"
    icon: mdi:content-save
    entity_category: config
    on_press:
      - lambda: |-
          if (isnan(id(g_z))) return;
          id(cal_closed_x) = id(g_x); id(cal_closed_y) = id(g_y); id(cal_closed_z) = id(g_z);
          global_preferences->sync();
      - script.execute: show_calibration
  - platform: template
    name: "${friendly_name} Save Open Position"
    icon: mdi:content-save
    entity_category: config
    on_press:
      - lambda: |-
          if (isnan(id(g_z))) return;
          id(cal_open_x) = id(g_x); id(cal_open_y) = id(g_y); id(cal_open_z) = id(g_z);
          global_preferences->sync();
      - script.execute: show_calibration
  - platform: template
    name: "${friendly_name} Clear Calibration"
    icon: mdi:delete-outline
    entity_category: config
    on_press:
      - lambda: |-
          id(cal_closed_x) = id(cal_closed_y) = id(cal_closed_z) = NAN;
          id(cal_open_x) = id(cal_open_y) = id(cal_open_z) = NAN;
          global_preferences->sync();
      - script.execute: show_calibration
  - platform: template
    name: "${friendly_name} Nudge Open"
    icon: mdi:chevron-up
    on_press:
      - script.execute:
          id: nudge_motor
          dir: 1
  - platform: template
    name: "${friendly_name} Nudge Close"
    icon: mdi:chevron-down
    on_press:
      - script.execute:
          id: nudge_motor
          dir: -1

# Motor and wind settings, changed from Home Assistant and kept on reboot
number:
  - platform: template
    name: "${friendly_name} Max Run Time"
    id: max_run_s
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: "s"
    min_value: 5
    max_value: 90
    step: 1
    initial_value: 45
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    name: "${friendly_name} Stall Current"
    id: stall_amps
    icon: mdi:current-dc
    entity_category: config
    unit_of_measurement: "A"
    min_value: 1
    max_value: 30
    step: 0.5
    initial_value: 5
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    name: "${friendly_name} Wind Shake Limit"
    id: wind_limit
    icon: mdi:weather-windy
    entity_category: config
    unit_of_measurement: "m/s²"
    min_value: 0.5
    max_value: 10
    step: 0.1
    initial_value: 2.0
    optimistic: true
    restore_value: true
    mode: box

# ============================================
# Motor driver inputs (BTS7960). Extend and retract can never be on
# together, and wait 500 ms before reversing. Always off after a reboot
# or power loss. Both off = both motor leads at ground (braked).
# ============================================
switch:
  - platform: gpio
    pin:
      number: GPIO25
      inverted: false
    id: motor_extend
    name: "${friendly_name} Motor Extend"
    internal: true
    restore_mode: ALWAYS_OFF
    interlock: [motor_retract]
    interlock_wait_time: 500ms
  - platform: gpio
    pin:
      number: GPIO26
      inverted: false
    id: motor_retract
    name: "${friendly_name} Motor Retract"
    internal: true
    restore_mode: ALWAYS_OFF
    interlock: [motor_extend]
    interlock_wait_time: 500ms

  # For the bench rig, where the GY-521 isn't on a moving arm: turns off
  # the tilt-based stops (past full open, stuck). The reed switch, stall
  # current and Max Run Time still stop the motor. Off after every reboot.
  - platform: template
    name: "${friendly_name} Bench Test Mode"
    id: bench_mode
    icon: mdi:test-tube
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF

  - platform: template
    name: "${friendly_name} Reverse Motor Direction"
    id: motor_reversed
    icon: mdi:swap-horizontal
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    name: "${friendly_name} Wind Auto-Retract"
    id: wind_auto_retract
    icon: mdi:weather-windy
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

script:
  - id: run_motor
    mode: restart
    parameters:
      dir: int
    then:
      - switch.turn_off: motor_extend
      - switch.turn_off: motor_retract
      # Forget the old direction right away, so a reversing position command
      # isn't cancelled by the old run's target check during the 300 ms wait.
      - lambda: 'id(run_dir) = 0;'
      - delay: 300ms
      - lambda: |-
          id(run_dir) = dir;
          id(run_start_ms) = millis();
          id(last_progress_ms) = millis();
          id(run_start_pos) = id(awning_pos);
          id(last_progress_pos) = id(awning_pos);
          id(min_tilt) = NAN;
          id(left_closed) = false;
          id(stop_reason) = "";
          id(awning_status).publish_state(dir == 1 ? "Opening" : "Closing");
          id(awning_cover).current_operation = dir == 1 ? COVER_OPERATION_OPENING : COVER_OPERATION_CLOSING;
          id(awning_cover).publish_state();
          ESP_LOGI("awning", "Motor ON: %s (%s pin)", dir == 1 ? "open" : "close",
                   ((dir == 1) != id(motor_reversed).state) ? "GPIO25 RPWM" : "GPIO26 LPWM");
      # "Reverse Motor Direction" swaps the two driver inputs, for a motor
      # that's wired the other way round.
      - if:
          condition:
            lambda: 'return (dir == 1) != id(motor_reversed).state;'
          then:
            - switch.turn_on: motor_extend
          else:
            - switch.turn_on: motor_retract

  # Short push for calibrating and testing. No position limits; the reed
  # switch, stall and past-full-open checks still apply.
  - id: nudge_motor
    mode: restart
    parameters:
      dir: int
    then:
      - script.execute:
          id: run_motor
          dir: !lambda 'return dir;'
      - delay: 1300ms
      - if:
          condition:
            lambda: 'return id(run_dir) == dir;'
          then:
            - lambda: 'id(stop_reason) = "";'
            - script.execute: stop_motor

  - id: show_calibration
    then:
      - lambda: |-
          bool c = !isnan(id(cal_closed_x)), o = !isnan(id(cal_open_x));
          if (c && o) id(cal_status).publish_state("Calibrated");
          else if (c) id(cal_status).publish_state("Closed saved - now open it and save Open");
          else if (o) id(cal_status).publish_state("Open saved - now close it and save Closed");
          else id(cal_status).publish_state("Not calibrated");

  - id: stop_motor
    mode: single
    then:
      # A Stop during run_motor's 300 ms wait must cancel the start too.
      - script.stop: run_motor
      - script.stop: nudge_motor
      - switch.turn_off: motor_extend
      - switch.turn_off: motor_retract
      - lambda: |-
          if (id(run_dir) != 0) {
            float secs = (millis() - id(run_start_ms)) / 1000.0f;
            // Timing only counts for a full run from one end to the other
            if (id(run_dir) == 1 && id(stop_reason) == "Open" &&
                !isnan(id(run_start_pos)) && id(run_start_pos) < 0.05f)
              id(last_open_time).publish_state(secs);
            if (id(run_dir) == -1 && id(stop_reason) == "Closed" &&
                !isnan(id(run_start_pos)) && id(run_start_pos) > 0.95f)
              id(last_close_time).publish_state(secs);
          }
          id(run_dir) = 0;
          id(target_pos) = -1;
          std::string s = id(stop_reason);
          if (s.empty()) {
            if (isnan(id(awning_pos))) s = "Stopped";
            else {
              char buf[32];
              snprintf(buf, sizeof(buf), "Stopped at %d%%", (int) (id(awning_pos) * 100));
              s = buf;
            }
          }
          id(awning_status).publish_state(s);
          ESP_LOGI("awning", "Motor OFF: %s", s.c_str());
          id(awning_cover).current_operation = COVER_OPERATION_IDLE;
          id(awning_cover).publish_state();

interval:
  # Every 20 ms: smooth out gravity and catch the fast Z jumps (wind shake)
  - interval: 20ms
    then:
      - lambda: |-
          float x = id(accel_x).state, y = id(accel_y).state, z = id(accel_z).state;
          if (isnan(x) || isnan(y) || isnan(z)) return;
          if (isnan(id(g_z))) { id(g_x) = x; id(g_y) = y; id(g_z) = z; }
          float dz = fabsf(z - id(g_z));
          if (dz > id(z_peak)) id(z_peak) = dz;
          // ~0.4 s smoothing: follows the arm moving, ignores the shake
          id(g_x) += 0.05f * (x - id(g_x));
          id(g_y) += 0.05f * (y - id(g_y));
          id(g_z) += 0.05f * (z - id(g_z));

  # Every 100 ms: position, travel checks, target stops and the wind window
  - interval: 100ms
    then:
      - lambda: |-
          // --- position ---
          // Angle the arm has turned from the saved closed direction, as a
          // share of the closed->open angle.
          auto angle = [](float ax, float ay, float az, float bx, float by, float bz) {
            float m = sqrtf((ax * ax + ay * ay + az * az) * (bx * bx + by * by + bz * bz));
            if (isnan(m) || m < 1.0f) return NAN;
            return acosf(clamp((ax * bx + ay * by + az * bz) / m, -1.0f, 1.0f)) * 57.2958f;
          };
          float span = angle(id(cal_closed_x), id(cal_closed_y), id(cal_closed_z),
                             id(cal_open_x), id(cal_open_y), id(cal_open_z));
          float from_closed = angle(id(g_x), id(g_y), id(g_z),
                                    id(cal_closed_x), id(cal_closed_y), id(cal_closed_z));
          if (id(limit_closed).state) id(awning_pos) = 0.0f;
          else if (!isnan(span) && span >= 10.0f && !isnan(from_closed))
            id(awning_pos) = clamp(from_closed / span, 0.0f, 1.0f);
          else id(awning_pos) = NAN;

          // --- wind: slide the 1-second window ---
          static uint8_t n = 0;
          static float peak_s = 0;
          bool over = id(z_peak) > id(wind_limit).state;
          id(win_bits) = ((id(win_bits) << 1) | (over ? 1 : 0)) & 0x3FF;
          if (id(z_peak) > peak_s) peak_s = id(z_peak);
          id(z_peak) = 0;
          if (++n >= 10) { id(shake_1s) = peak_s; peak_s = 0; n = 0; }
          // The motor shakes the arm too: no wind check while it runs,
          // whether from the firmware or the wall rocker.
          // run_motor waits 300 ms before it sets run_dir: count that as running,
          // or steady shake would keep restarting it and the motor never starts.
          bool motor_on = id(run_dir) != 0 || id(run_motor).is_running() || id(motor_amps) > ${manual_run_amps};
          if (motor_on) id(win_bits) = 0;
          else if (__builtin_popcount(id(win_bits)) >= ${wind_hits} && id(wind_auto_retract).state &&
                   !id(limit_closed).state && !(!isnan(id(awning_pos)) && id(awning_pos) < 0.03f)) {
            id(win_bits) = 0;
            ESP_LOGW("awning", "Wind shake - retracting");
            id(run_motor).execute(-1);
            id(awning_status).publish_state("Wind: auto-retracting");
            return;
          }

          // --- travel checks ---
          if (id(run_dir) == 0) return;
          uint32_t now = millis();
          float p = id(awning_pos);
          char buf[48];
          // 1. Backstop timer
          if (now - id(run_start_ms) > (uint32_t) (id(max_run_s).state * 1000.0f)) {
            id(stop_reason) = "Problem: took too long";
            id(stop_motor).execute();
            return;
          }
          // 2. Went past full open. The motor doesn't stall at the end: it
          // keeps turning and rolls the fabric back up upside down, and the
          // arms rise again. Uses the raw tilt, so it works before
          // calibration. Armed only once the arm is below 60°, so a closed
          // arm that sits a little past vertical can't trip it at the start.
          // Ignores the first 2 s (start-up jerk) and needs the rise to hold
          // for 0.5 s, so motor vibration can't trip it.
          static uint8_t overrun_ticks = 0;
          if (id(run_dir) == 1 && !id(bench_mode).state) {
            if (!id(limit_closed).state) id(left_closed) = true;
            float tilt = id(arm_tilt).get_raw_state();
            if (!isnan(tilt)) {
              if (isnan(id(min_tilt)) || tilt < id(min_tilt)) { id(min_tilt) = tilt; overrun_ticks = 0; }
              else if (now - id(run_start_ms) > 2000 && id(min_tilt) < 60.0f &&
                       tilt > id(min_tilt) + ${overrun_tilt_deg}) {
                if (++overrun_ticks >= 5) {
                  overrun_ticks = 0;
                  id(stop_reason) = "Problem: went past full open";
                  id(stop_motor).execute();
                  return;
                }
              } else overrun_ticks = 0;
            }
          }
          id(awning_cover).current_operation = id(run_dir) == 1 ? COVER_OPERATION_OPENING : COVER_OPERATION_CLOSING;
          if (isnan(p)) return;
          // 3. Reached full open (calibrated 100%)
          if (id(run_dir) == 1 && p >= 0.99f) {
            id(stop_reason) = "Open";
            id(stop_motor).execute();
            return;
          }
          // 4. Reached a position command
          if (id(target_pos) >= 0 &&
              ((id(run_dir) == 1 && p >= id(target_pos)) || (id(run_dir) == -1 && p <= id(target_pos)))) {
            id(stop_motor).execute();
            return;
          }
          // 5. Not moving (jammed, binding, motor problem). Not at the closed
          // end: the reed can hold 0% for a moment as it starts out, and the
          // last bit of a close may read 0% - the reed, stall or timer end those.
          bool closed_end = id(limit_closed).state || (id(run_dir) == -1 && p <= 0.02f);
          if (closed_end || isnan(id(last_progress_pos)) || fabsf(p - id(last_progress_pos)) >= 0.02f) {
            id(last_progress_pos) = p;
            id(last_progress_ms) = now;
          } else if (!id(bench_mode).state && now - id(last_progress_ms) > ${no_progress_ms}) {
            snprintf(buf, sizeof(buf), "Problem: stuck at %d%%", (int) (p * 100));
            id(stop_reason) = buf;
            id(stop_motor).execute();
            return;
          }

cover:
  - platform: template
    name: "${friendly_name}"
    id: awning_cover
    device_class: awning
    has_position: true
    # Position isn't always known (before calibration, or with no reed
    # switch), so keep Open, Close and Stop usable whatever it shows.
    assumed_state: true
    lambda: |-
      if (id(limit_closed).state) return COVER_CLOSED;
      if (isnan(id(awning_pos))) return {};
      return id(awning_pos);
    open_action:
      - if:
          condition:
            lambda: 'return !(!isnan(id(awning_pos)) && id(awning_pos) >= 0.99f);'
          then:
            - script.execute:
                id: run_motor
                dir: 1
    close_action:
      - if:
          condition:
            lambda: 'return !id(limit_closed).state;'
          then:
            - script.execute:
                id: run_motor
                dir: -1
    stop_action:
      - lambda: 'id(stop_reason) = "";'
      - script.execute: stop_motor
    position_action:
      - lambda: |-
          if (isnan(id(awning_pos))) return;
          if (pos > id(awning_pos) + 0.02f) {
            id(run_motor).execute(1);
            id(target_pos) = pos;
          } else if (pos < id(awning_pos) - 0.02f) {
            id(run_motor).execute(-1);
            id(target_pos) = pos;
          }
