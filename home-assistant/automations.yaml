- id: camper_gesture_tv_toggle
  alias: 'Gesture: ✌️ then 🤟 Rock Sign -> TV On/Off'
  description: ✌️ then 🤟 (MediaPipe "ILoveYou" - rock sign with the thumb out; a
    plain 🤘 isn't one of its gestures) turns the 50" Roku TV on if it's off, off if
    it's on.
  triggers:
  - trigger: event
    event_type: camper_gesture
    event_data:
      gesture: ILoveYou
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.score | float(0) >= 0.75 }}'
  - condition: state
    # Two-gesture combo: only works within 30 s of a ✌️ (see camper_gesture_arm)
    entity_id: timer.camper_gesture_armed
    state: active
  actions:
  - action: timer.cancel
    target:
      entity_id: timer.camper_gesture_armed
  - action: "media_player.turn_{{ 'on' if states('media_player.bedroom_50_hisense_roku_tv')
      in ['off', 'unavailable', 'unknown'] else 'off' }}"
    target:
      entity_id: media_player.bedroom_50_hisense_roku_tv
  mode: single
- id: camper_gesture_halloween_video
  alias: 'Gesture: ✌️ then 🖕 -> Play Halloween Video On TV'
  description: ✌️ then 🖕 (Middle_Finger - camper_vision works it out from the hand
    landmarks, MediaPipe has no such gesture) plays The Skeleton Dance (1929 Disney
    Silly Symphony, public domain since 2025) on the 50" Roku TV through its YouTube
    app (Laughing Place upload 61t22VGByok). The TV has no Play-on-Roku channel and
    sits on the T-Mobile LAN (192.168.12.x), so it can't stream a file from the Pi.
    YouTube deep link only starts playback with media_type live.
  triggers:
  - trigger: event
    event_type: camper_gesture
    event_data:
      gesture: Middle_Finger
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.score | float(0) >= 0.75 }}'
  - condition: state
    # Two-gesture combo: only works within 30 s of a ✌️ (see camper_gesture_arm)
    entity_id: timer.camper_gesture_armed
    state: active
  actions:
  - action: timer.cancel
    target:
      entity_id: timer.camper_gesture_armed
  - if:
    - condition: template
      value_template: "{{ states('media_player.bedroom_50_hisense_roku_tv') in ['off',
        'unavailable', 'unknown'] }}"
    then:
    - action: media_player.turn_on
      target:
        entity_id: media_player.bedroom_50_hisense_roku_tv
    - delay: 00:00:10
  - action: media_player.play_media
    target:
      entity_id: media_player.bedroom_50_hisense_roku_tv
    data:
      media_content_type: app
      media_content_id: '837'
      extra:
        content_id: 61t22VGByok
        media_type: live
  mode: single
- id: keurig_wake_up_motion
  alias: 'Keurig: Start on Wake-Up Motion'
  description: 'First motion between 11:00 AM and 2:30 PM on a work day turns the
    Keurig on (Morris gets up before his 2 PM alarm: bathroom, then coffee). Weekdays
    only after Nadine has left for child care; Sundays any motion. Once a day.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.lumi_lumi_sensor_motion_aq2
    to: 'on'
  conditions:
  - condition: time
    after: '11:00:00'
    before: '14:30:00'
  - condition: or
    conditions:
    - condition: time
      weekday:
      - sun
      - mon
      - tue
      - wed
    - condition: and
      conditions:
      - condition: time
        weekday:
        - thu
      - condition: state
        entity_id: input_boolean.camper_overtime_thursday
        state: 'on'
  - condition: or
    conditions:
    - condition: not
      conditions:
      - condition: state
        entity_id: person.nadine
        state: home
    - condition: time
      weekday:
      - sat
      - sun
  - condition: state
    entity_id: switch.smart_switch_1
    state: 'off'
  - condition: template
    value_template: '{% set t = state_attr(this.entity_id, ''last_triggered'') %}{{
      t is none or as_local(t).date() < now().date() }}'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.smart_switch_1
  mode: single
- id: thermostat_mode_select_picked
  alias: 'Thermostat: Mode Dropdown Picked'
  description: Dashboard Mode dropdown -> same as the old Off/Cool/Heat/Auto/Dry/Fan
    only buttons (Auto = Smart Auto). Only reacts to a person picking, not to the
    sync automation.
  mode: restart
  triggers:
  - trigger: state
    entity_id: input_select.camper_thermostat_mode
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.context.user_id is not none and trigger.from_state
      is not none and trigger.from_state.state != trigger.to_state.state }}'
  actions:
  - action: script.camper_thermostat_set_mode
    data:
      mode: "{{ {'Off': 'off', 'Cool': 'cool', 'Heat': 'heat', 'Auto': 'auto', 'Dry':
        'dry', 'Fan only': 'fan_only'}[trigger.to_state.state] }}"
- id: thermostat_mode_select_sync
  alias: 'Thermostat: Mode Dropdown Sync'
  description: Keeps the Mode dropdown showing what the thermostat is doing (wall
    panel, app, voice, Smart Auto). Waits 20 s after a pick so the dropdown does
    not flick back while the Bluetooth command lands.
  mode: restart
  triggers:
  - trigger: state
    entity_id: climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate
  - trigger: state
    entity_id: input_boolean.camper_smart_auto
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /1
  variables:
    m: "{{ states('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate') }}"
    label: "{% if m in ['cool', 'heat'] and is_state('input_boolean.camper_smart_auto',
      'on') %}Auto{% else %}{{ {'off': 'Off', 'cool': 'Cool', 'heat': 'Heat', 'auto':
      'Auto', 'dry': 'Dry', 'fan_only': 'Fan only'}.get(m, '') }}{% endif %}"
  conditions:
  - condition: template
    value_template: "{{ label != '' and label != states('input_select.camper_thermostat_mode')
      and (now() - states.input_select.camper_thermostat_mode.last_changed).total_seconds()
      > 20 }}"
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.camper_thermostat_mode
    data:
      option: '{{ label }}'
- id: thermostat_fan_select_picked
  alias: 'Thermostat: Fan Dropdown Picked'
  description: Dashboard Fan dropdown -> climate.set_fan_mode. Cycled = runs with
    heat/cool, Manual = always on. Only reacts to a person picking.
  mode: restart
  triggers:
  - trigger: state
    entity_id: input_select.camper_thermostat_fan
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.context.user_id is not none and trigger.from_state
      is not none and trigger.from_state.state != trigger.to_state.state }}'
  actions:
  - action: climate.set_fan_mode
    target:
      entity_id: climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate
    data:
      fan_mode: "{{ {'Cycled Low': 'low', 'Cycled High': 'high', 'Manual Low': 'manual_low',
        'Manual High': 'manual_high', 'Auto': 'auto', 'Low': 'low', 'High': 'high',
        'Off': 'off'}[trigger.to_state.state] }}"
- id: thermostat_fan_select_sync
  alias: 'Thermostat: Fan Dropdown Sync'
  description: Keeps the Fan dropdown's choices and value matching the thermostat.
    Fan only offers Low/High/Off (always manual); other modes offer Cycled/Manual
    Low/High and Auto. Waits 20 s after a pick.
  mode: restart
  triggers:
  - trigger: state
    entity_id: climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate
  - trigger: state
    entity_id: climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate
    attribute: fan_mode
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /1
  variables:
    m: "{{ states('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate') }}"
    f: "{{ state_attr('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate', 'fan_mode')
      }}"
    opts: "{% if m == 'fan_only' %}{{ ['Low', 'High', 'Off'] }}{% else %}{{ ['Cycled
      Low', 'Cycled High', 'Manual Low', 'Manual High', 'Auto'] + (['Off'] if f ==
      'off' else []) }}{% endif %}"
    label: "{% if m == 'fan_only' %}{{ {'low': 'Low', 'high': 'High', 'off': 'Off'}.get(f,
      '') }}{% else %}{{ {'low': 'Cycled Low', 'high': 'Cycled High', 'manual_low':
      'Manual Low', 'manual_high': 'Manual High', 'auto': 'Auto', 'off': 'Off'}.get(f,
      '') }}{% endif %}"
  conditions:
  - condition: template
    value_template: "{{ label != '' and (now() - states.input_select.camper_thermostat_fan.last_changed).total_seconds()
      > 20 and (state_attr('input_select.camper_thermostat_fan', 'options') != opts
      or states('input_select.camper_thermostat_fan') != label) }}"
  actions:
  - if:
    - condition: template
      value_template: "{{ state_attr('input_select.camper_thermostat_fan', 'options')
        != opts }}"
    then:
    - action: input_select.set_options
      target:
        entity_id: input_select.camper_thermostat_fan
      data:
        options: '{{ opts }}'
  - action: input_select.select_option
    target:
      entity_id: input_select.camper_thermostat_fan
    data:
      option: '{{ label }}'
- id: thermostat_schedule
  alias: 'Thermostat: Work-Night Schedule'
  description: >-
    Schedule tab. On work nights (Sun-Wed, plus Thu when Overtime Thu is on)
    each of the four times sets its own Heat to / A/C to pair (Night, Warm Up,
    Morning Sleep, Day at Morning Sleep Ends). Uses exactly the numbers
    typed on the Schedule tab; A/C is only held at or above heat (2026-10-15). The night-start run records whether
    tonight is a work night (camper_tsched_work_night); the morning runs check
    that, because Overtime Thu resets itself at 6 AM Friday. Warm-ups end any
    Goodnight sleep temps; cool-downs are skipped while Goodnight is running.
  mode: queued
  triggers:
  - trigger: time
    at: input_datetime.camper_tsched_night_start
    id: night
  - trigger: time
    at: input_datetime.camper_tsched_home
    id: home
  - trigger: time
    at: input_datetime.camper_tsched_sleep_start
    id: sleep
  - trigger: time
    at: input_datetime.camper_tsched_sleep_end
    id: wake
  conditions:
  - condition: state
    entity_id: input_boolean.camper_tsched_enabled
    state: 'on'
  actions:
  - variables:
      w: '{{ now().weekday() }}'
      tonight_work: "{{ w in [6, 0, 1, 2] or (w == 3 and is_state('input_boolean.camper_overtime_thursday',
        'on')) }}"
      period: "{{ {'night': 'night', 'home': 'home', 'sleep': 'sleep', 'wake': 'day'}[trigger.id] }}"
      heat: "{{ states('input_number.camper_tsched_' ~ period ~ '_heat') | int(65) }}"
      cool: "{{ [states('input_number.camper_tsched_' ~ period ~ '_cool') | int(72), heat] | max }}"
  - if:
    - condition: trigger
      id: night
    then:
    - action: "input_boolean.turn_{{ 'on' if tonight_work else 'off' }}"
      target:
        entity_id: input_boolean.camper_tsched_work_night
  - condition: state
    entity_id: input_boolean.camper_tsched_work_night
    state: 'on'
  - choose:
    - conditions:
      - condition: trigger
        id: [night, sleep]
      sequence:
      # Let a Goodnight that ends at this same minute put its values back first
      - delay: 00:00:05
      - condition: template
        value_template: "{{ as_timestamp(states('input_datetime.camper_sleep_until'),
          0) <= as_timestamp(now()) }}"
      - action: script.camper_thermostat_set_pair
        data:
          heat: '{{ heat }}'
          cool: '{{ cool }}'
    - conditions:
      - condition: trigger
        id: [home, wake]
      sequence:
      # Day temps become Goodnight's saved values too, so it can't bring night temps back
      - action: input_number.set_value
        target:
          entity_id: input_number.camper_day_heat_setpoint
        data:
          value: '{{ heat }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.camper_day_cool_setpoint
        data:
          value: '{{ cool }}'
      - if:
        - condition: template
          value_template: "{{ as_timestamp(states('input_datetime.camper_sleep_until'),
            0) > as_timestamp(now()) }}"
        then:
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.camper_sleep_until
          data:
            datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - action: script.camper_thermostat_set_pair
        data:
          heat: '{{ heat }}'
          cool: '{{ cool }}'
- id: nadine_morning_meds_reminder
  alias: 'Nadine: Morning Meds Reminder'
  description: Every day at 5:00 AM, remind Nadine to take her meds. Also speaks it on
    her phone's alarm sound (2026-10-17) so it rings through Do Not Disturb, at her
    alarm-clock volume.
