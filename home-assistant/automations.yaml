- id: camper_storm_alert_pressure_drop
  alias: Camper - Storm Alert (Pressure Drop)
  description: Warns when barometric pressure falls 3+ hPa in 3 hours, a sign bad
    weather is likely within 6-24 hours. Ignores drops over 10 hPa, or a 6h range
    over 12 hPa, since those mean the camper changed altitude rather than weather.
    At most one alert every 6 hours.
  trigger:
  - platform: numeric_state
    entity_id: sensor.pressure_change_3h
    below: -3
    for:
      minutes: 5
  condition:
  - condition: numeric_state
    entity_id: sensor.pressure_change_3h
    above: -10
  - condition: numeric_state
    entity_id: sensor.pressure_range_6h
    below: 12
  - condition: template
    value_template: "{{ this.attributes.last_triggered is none\n   or now() - this.attributes.last_triggered
      > timedelta(hours=6) }}"
  action:
  - variables:
      msg: 'Pressure dropped {{ states(''sensor.pressure_change_3h'') | float | abs
        }} hPa in 3 hours (now {{ states(''sensor.lumi_lumi_weather_pressure'') }}
        hPa). Bad weather is likely within 6-24 hours: bring in the awning, secure
        outside gear, and close vents.'
  - action: notify.mobile_app_morris_sm_s906u
    continue_on_error: true
    data:
      message: TTS
      data:
        priority: high
        tts_text: "Storm Likely. {{ msg }}"
        media_stream: alarm_stream
  - service: notify.mobile_app_morris_sm_s906u
    data:
      title: ⛈️ Storm Likely
      message: '{{ msg }}'
      data:
        priority: high
        actions: "{{ [{'action': 'RETRACT_AWNING', 'title': 'Retract awning'}] if states('cover.awning') in ['open', 'opening'] else [] }}"
  - service: persistent_notification.create
    data:
      title: ⛈️ Storm Likely
      message: '{{ msg }}'
  mode: single
- id: goodnight_sleep_temps_end
  alias: 'Goodnight: Sleep Temperatures End'
  description: Puts the daytime heat/cool setpoints back 8 hours after Goodnight (Goodnight
    saves them in the Daytime Cool/Heat Setpoint helpers).
  mode: single
  triggers:
  - trigger: time
    at: input_datetime.camper_sleep_until
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.camper_smart_heat_to
    data:
      value: '{{ states(''input_number.camper_day_heat_setpoint'') | int }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.camper_smart_cool_to
    data:
      value: '{{ states(''input_number.camper_day_cool_setpoint'') | int }}'
- id: camper_gesture_arm
  alias: 'Gesture: ✌️ Victory -> Arm For 30 s'
  description: First half of every gesture command. ✌️ starts a 30 s window; the
    command gesture (☝️ fan on, ✊ fan off, 👍 Keurig on, 👎 Keurig off, 🤟 TV on/off,
    🖕 Halloween video) must come inside it. Single gestures were misread dozens of times a day (2026-10-10).
  triggers:
  - trigger: event
    event_type: camper_gesture
    event_data:
      gesture: Victory
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.score | float(0) >= 0.75 }}'
  actions:
  - action: timer.start
    target:
      entity_id: timer.camper_gesture_armed
  mode: single
- id: camper_gesture_fan_on_point
  alias: 'Gesture: ✌️ then Pointing Up -> Ceiling Fan On'
  description: Webcam gesture Pointing_Up (camper_vision on the Jetson) -> switch.turn_on
    switch.ceiling_fan
  triggers:
  - trigger: event
    event_type: camper_gesture
    event_data:
      gesture: Pointing_Up
  conditions:
  - condition: state
    entity_id: input_select.camper_ceiling_fan_mode
    state: Auto
  - condition: template
    # Camera must be at least 75% sure (lower scores kept firing by mistake - 2026-10-10)
    value_template: '{{ trigger.event.data.score | float(0) >= 0.75 }}'
  - condition: state
    # Two-gesture combo: only works within 30 s of a ✌️ (see camper_gesture_arm)
    entity_id: timer.camper_gesture_armed
    state: active
  actions:
  - action: timer.cancel
    target:
      entity_id: timer.camper_gesture_armed
  - action: switch.turn_on
    target:
      entity_id: switch.ceiling_fan
  mode: single
- id: camper_gesture_fan_off_fist
  alias: 'Gesture: ✌️ then Closed Fist -> Ceiling Fan Off'
  description: Webcam gesture Closed_Fist (camper_vision on the Jetson) -> switch.turn_off
    switch.ceiling_fan
  triggers:
  - trigger: event
    event_type: camper_gesture
    event_data:
      gesture: Closed_Fist
  conditions:
  - condition: state
    entity_id: input_select.camper_ceiling_fan_mode
    state: Auto
  - condition: template
    # Camera must be at least 75% sure (lower scores kept firing by mistake - 2026-10-10)
