        tts_text: Good morning Nadine. Time to take your morning meds.
        media_stream: alarm_stream
  - action: notify.mobile_app_home
    data:
      title: "\U0001F48A Time for your meds"
      message: Good morning Nadine! Don't forget to take your morning meds.
      data:
        tag: nadine_morning_meds
        priority: high
        ttl: 0
        sticky: 'true'
