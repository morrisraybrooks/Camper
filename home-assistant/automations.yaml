    data:
      message: clear_notification
      data:
        tag: nadine_morning_meds
- id: read_aloud_refresh_files
  alias: "Read Aloud: refresh file list"
  description: "Keeps the Read Aloud dropdown in sync with the .txt files in www/read_aloud."
  mode: queued
  triggers:
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id: sensor.read_aloud
      attribute: file_list
  actions:
    - variables:
        files: "{{ (state_attr('sensor.read_aloud', 'file_list') or []) | map('regex_replace', '^.*/', '') | sort | list }}"
        opts: "{{ files if files else ['(no files yet)'] }}"
        cur: "{{ states('input_select.read_aloud_file') }}"
    - condition: template
      value_template: "{{ opts != state_attr('input_select.read_aloud_file', 'options') }}"
    - action: input_select.set_options
      target: { entity_id: input_select.read_aloud_file }
      data: { options: "{{ opts }}" }
