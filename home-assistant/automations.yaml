- id: smart_auto_to_heat
  alias: 'Smart Auto: Switch to Heat'
  mode: single
  triggers:
  - trigger: template
    value_template: "{% set e = 'climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate'
      %} {{ is_state('input_boolean.camper_smart_auto', 'on') and is_state(e, 'cool')\n
      \  and (state_attr(e, 'current_temperature') | float(99)) <= (states('input_number.camper_smart_heat_to')
      | float(68)) - 2 }}"
    for: 00:10:00
  # Re-check when the 1-hour lockout ends; the trigger above only fires once
  - trigger: template
    value_template: '{{ (now() - states.climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate.last_changed)
      > timedelta(hours=1) }}'
  conditions:
  - condition: template
    value_template: '{{ (now() - states.climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate.last_changed)
      > timedelta(hours=1) }}'
  - condition: template
    value_template: "{% set e = 'climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate'
      %} {{ is_state('input_boolean.camper_smart_auto', 'on') and is_state(e, 'cool')\n
      \  and (state_attr(e, 'current_temperature') | float(99)) <= (states('input_number.camper_smart_heat_to')
      | float(68)) - 2 }}"
  actions:
  - action: script.camper_smart_auto_apply
    data:
      mode: heat
      reason: it dropped to {{ state_attr('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate','current_temperature')
        }}°F
- id: smart_auto_to_cool
  alias: 'Smart Auto: Switch to Cool'
  mode: single
  triggers:
  - trigger: template
    value_template: "{% set e = 'climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate'
      %} {{ is_state('input_boolean.camper_smart_auto', 'on') and is_state(e, 'heat')\n
      \  and (state_attr(e, 'current_temperature') | float(0)) >= (states('input_number.camper_smart_cool_to')
      | float(72)) + 1 }}"
    for: 00:10:00
  # Re-check when the 1-hour lockout ends; the trigger above only fires once
  - trigger: template
    value_template: '{{ (now() - states.climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate.last_changed)
      > timedelta(hours=1) }}'
  conditions:
  - condition: template
    value_template: '{{ (now() - states.climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate.last_changed)
      > timedelta(hours=1) }}'
  - condition: template
    value_template: "{% set e = 'climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate'
      %} {{ is_state('input_boolean.camper_smart_auto', 'on') and is_state(e, 'heat')\n
      \  and (state_attr(e, 'current_temperature') | float(0)) >= (states('input_number.camper_smart_cool_to')
      | float(72)) + 1 }}"
  actions:
  - action: script.camper_smart_auto_apply
    data:
      mode: cool
      reason: it rose to {{ state_attr('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate','current_temperature')
        }}°F
- id: smart_auto_replace_thermostat_auto
  alias: 'Smart Auto: Replace Thermostat Auto Mode'
  triggers:
  - trigger: state
    entity_id: climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate
    to: auto
    for: 00:00:30
  - trigger: state
    entity_id: input_boolean.camper_smart_auto
    to: 'on'
  conditions:
  - condition: state
    entity_id: input_boolean.camper_smart_auto
    state: 'on'
  - condition: template
    value_template: '{{ states(''climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate'')
      in [''auto'', ''cool'', ''heat''] }}'
  actions:
  - variables:
      cur: '{{ state_attr(''climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate'',''current_temperature'')
        | float(72) }}'
      mid: '{{ ((states(''input_number.camper_smart_heat_to'') | float(68)) + (states(''input_number.camper_smart_cool_to'')
        | float(72))) / 2 }}'
  - action: script.camper_smart_auto_apply
    data:
      mode: '{{ ''cool'' if cur >= mid else ''heat'' }}'
      reason: "{{ 'Auto was turned on at the thermostat - Smart Auto runs it in one
        mode so heat and A/C cannot fight'\n   if trigger.entity_id.startswith('climate')
        else 'Smart Auto was turned on' }} ({{ cur | int }}°F inside)"
- id: smart_auto_setpoint_changed
  alias: 'Smart Auto: Setpoint Changed'
  description: Sends the Heat to / Cool to setpoints to the thermostat - the one
    for Cool or Heat, or both in the thermostat's own Auto (2026-10-11). Each one
    stays where it is set; cool may equal heat (72/72), and only if cool would
    go below heat does the other one move to match.
  mode: restart
  triggers:
  - trigger: state
    entity_id:
    - input_number.camper_smart_heat_to
    - input_number.camper_smart_cool_to
  - trigger: state
    entity_id: input_boolean.camper_smart_auto
    to: 'on'
  actions:
  - variables:
      h: '{{ states(''input_number.camper_smart_heat_to'') | int(68) }}'
      c: '{{ states(''input_number.camper_smart_cool_to'') | int(72) }}'
      auto: '{{ is_state(''input_boolean.camper_smart_auto'', ''on'') }}'
      keep_heat: "{{ is_state('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate',
        'heat')\n   if trigger.entity_id == 'input_boolean.camper_smart_auto'\n   else
        trigger.entity_id == 'input_number.camper_smart_heat_to' }}"
      other: '{{ ''input_number.camper_smart_cool_to'' if keep_heat else ''input_number.camper_smart_heat_to''
        }}'
      new: '{{ h if keep_heat else c }}'
  - if:
    - condition: template
      value_template: '{{ c < h }}'
    then:
    - action: input_number.set_value
      target:
        entity_id: '{{ other }}'
      data:
        value: '{{ new }}'
    - stop: gap fixed - the change above re-runs this automation
  - delay: 00:00:03
  - variables:
      m: '{{ states(''climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate'') }}'
      want: '{{ c if m == ''cool'' else (h if m == ''heat'' else none) }}'
  - if:
    - condition: template
      value_template: '{{ m == ''auto'' }}'
    then:
    - condition: template
      value_template: '{{ state_attr(''climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate'',''target_temp_low'')
        != h or state_attr(''climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate'',''target_temp_high'')
        != c }}'
    - action: climate.set_temperature
      target:
        entity_id: climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate
      data:
        target_temp_low: '{{ h }}'
        target_temp_high: '{{ c }}'
    - stop: Auto setpoints sent
  - condition: template
    value_template: '{{ want is not none and want != state_attr(''climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate'',''temperature'')
      }}'
  - action: climate.set_temperature
    target:
      entity_id: climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate
    data:
      temperature: '{{ want }}'
- id: smart_auto_sync_from_thermostat
  alias: 'Thermostat: Sync Setpoint From Wall'
  description: Copies setpoints changed at the wall panel / app into Heat to / Cool
    to - Cool or Heat's one setpoint, or both of the thermostat's own Auto
    setpoints (2026-10-11).
  mode: restart
  triggers:
  - trigger: state
    entity_id: climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate
    attribute: temperature
    for: 00:00:10
  - trigger: state
    entity_id: climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate
    attribute: target_temp_low
    for: 00:00:10
  - trigger: state
    entity_id: climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate
    attribute: target_temp_high
    for: 00:00:10
  conditions:
  - condition: template
    value_template: "{{ (now() - states.input_number.camper_smart_heat_to.last_changed).total_seconds()
      > 30\n   and (now() - states.input_number.camper_smart_cool_to.last_changed).total_seconds()
      > 30\n   and state_attr('automation.smart_auto_setpoint_changed', 'current')
      | int(0) == 0 }}"
  - condition: template
    value_template: "{% set e = 'climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate'
      %} {% set t = state_attr(e, 'temperature') %} {% set m = states(e) %}
      {% set lo = state_attr(e, 'target_temp_low') %} {% set hi = state_attr(e, 'target_temp_high') %}
      {{ (t is number and ((m == 'cool' and t != states('input_number.camper_smart_cool_to')
      | int) or (m == 'heat' and t != states('input_number.camper_smart_heat_to') | int)))
      or (m == 'auto' and lo is number and hi is number and (lo != states('input_number.camper_smart_heat_to')
      | int or hi != states('input_number.camper_smart_cool_to') | int)) }}"
  actions:
  - if:
    - condition: state
      entity_id: climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate
      state: auto
    then:
    - action: script.camper_thermostat_set_pair
      data:
        heat: '{{ state_attr(''climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate'',''target_temp_low'')
          | int }}'
        cool: '{{ state_attr(''climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate'',''target_temp_high'')
          | int }}'
    else:
    - action: input_number.set_value
      target:
        entity_id: '{{ ''input_number.camper_smart_cool_to'' if is_state(''climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate'',''cool'')
          else ''input_number.camper_smart_heat_to'' }}'
      data:
        value: '{{ state_attr(''climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate'',''temperature'')
          }}'
- id: alarmo_triggered_snapshot_notify
