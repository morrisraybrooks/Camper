- id: camper_dehumidifier_tank_full
  alias: 'Camper: Dehumidifier Tank Full'
  description: The Midea dehumidifier stops when its bucket is full (or the drain hose is blocked).
  triggers:
  - trigger: state
    entity_id: binary_sensor.dehumidifier_tank_full
    to: 'on'
    for: '00:02:00'
  actions:
  - action: script.camper_notify_both
    data:
      title: "\U0001FAA3 Dehumidifier tank full"
      message: The dehumidifier stopped because its tank is full. Empty the bucket, or check that the drain hose isn't kinked or blocked.
  mode: single
- id: camper_water_leak
  alias: 'Camper: Water Leak Shutoff'
  description: Wireless Aqara leak probes (2026-10-17). Any wet probe has the wall panel
    shut the pump off and close the water main (and the water heater burner for a
    water heater leak), then alerts both phones. Water stays off until script.camper_leak_reset.
  triggers:
  - trigger: state
    entity_id: binary_sensor.camper_water_leak
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.camper_water_leak
    attribute: wet
  conditions:
  - condition: state
    entity_id: binary_sensor.camper_water_leak
    state: 'on'
  actions:
  - variables:
      where: "{{ state_attr('binary_sensor.camper_water_leak', 'wet') | join(', ') }}"
      heater: "{{ state_attr('binary_sensor.camper_water_leak', 'heater') | bool(false) }}"
      panel_online: "{{ has_value('binary_sensor.camper_wall_panel_camper_wall_panel_leak_lockout') }}"
      shut_off: "{{ panel_online and is_state('input_boolean.camper_wall_panel_connected', 'on') }}"
  - if:
    - condition: template
      value_template: '{{ panel_online }}'
    then:
    - action: esphome.camper_wall_panel_leak_shutoff
      continue_on_error: true
      data:
        where: '{{ where }}'
        heater_off: '{{ heater }}'
  - action: script.camper_notify_both
    data:
      title: "\U0001F4A7 Water leak - {{ where }}"
      message: "{% if shut_off %}The pump is off and the water main is closed{% if heater %},
        and the water heater burner is off{% endif %}. Dry the probe, then press Leak Reset
        on the Water page.{% else %}The wall panel can't shut the water off (not wired in
        or offline) - turn the water off by hand.{% endif %}"
      urgent: true
  mode: queued
- id: shopping_store_arrival
  alias: 'Shopping: List When Arriving at a Store'
  description: When Morris or Nadine has been at any local Walmart or Ingles, or any Dollar General
    in Gaffney, Shelby or Pacolet, for 2 minutes (so driving past doesn't count), send
    that person the shopping list. Items with "Amazon" in the name are listed separately
    as things to order online. Nothing is sent if the list is empty. (2026-10-17)
  mode: queued
  triggers:
  - trigger: state
    entity_id:
    - person.morris
    - person.nadine
    to: ~
    for: 00:02:00
  conditions:
  - condition: template
    value_template: "{{ trigger.to_state.state.startswith(('Walmart', 'Dollar General', 'Ingles')) }}"
  actions:
  - action: todo.get_items
    target:
      entity_id: todo.shopping_list
    data:
      status: needs_action
    response_variable: r
  - variables:
      names: "{{ r['todo.shopping_list']['items'] | map(attribute='summary') | list }}"
      store: "{{ names | reject('search', '(?i)amazon') | list }}"
      online: "{{ names | select('search', '(?i)amazon') | map('regex_replace', '(?i)\\s*\\(?amazon\\)?', '') | list }}"
      phone: "{{ 'notify.mobile_app_morris_sm_s906u' if trigger.entity_id == 'person.morris' else 'notify.mobile_app_home' }}"
  - condition: template
    value_template: '{{ store | count > 0 }}'
  - if:
    - condition: template
      value_template: "{{ phone == 'notify.mobile_app_morris_sm_s906u' }}"
    then:
    - action: notify.mobile_app_morris_sm_s906u
      continue_on_error: true
      data:
        message: TTS
        data:
          priority: high
          tts_text: "{{ ('At ' ~ (trigger.to_state.state.split(' ')[0] if trigger.to_state.state.startswith(('Walmart', 'Ingles')) else 'Dollar General') ~ '. ' ~ store | count ~ ' on the list. ' ~ store | join(', ')) | replace('°', ' degrees') | regex_replace('[^ -~]', '') }}"
          media_stream: alarm_stream
  - if:
    - condition: template
      value_template: "{{ phone == 'notify.mobile_app_home' }}"
    then:
    - action: notify.mobile_app_home
      continue_on_error: true
      data:
        message: TTS
        data:
          tts_text: "{{ ('At ' ~ (trigger.to_state.state.split(' ')[0] if trigger.to_state.state.startswith(('Walmart', 'Ingles')) else 'Dollar General') ~ '. ' ~ store | count ~ ' on the list. ' ~ store | join(', ')) | replace('°', ' degrees') | regex_replace('[^ -~]', '') }}"
          media_stream: alarm_stream
  - action: '{{ phone }}'
    data:
      title: "\U0001F6D2 At {{ trigger.to_state.state.split(' ')[0] if trigger.to_state.state.startswith(('Walmart', 'Ingles')) else 'Dollar General' }} - {{ store | count }} on the list"
      message: "{{ store | join(', ') }}{% if online %} (Order on Amazon: {{ online | join(', ') }}){% endif %}"
      data:
        priority: "{{ 'high' if phone == 'notify.mobile_app_morris_sm_s906u' else 'normal' }}"
        tag: shopping_store_arrival
        clickAction: /lovelace-camper/shopping
        actions:
        - action: URI
          title: Open list
          uri: /lovelace-camper/shopping
- id: shopping_cereal_picked
  alias: 'Shopping: Cereal Picked'
  description: Picking a cereal in the Cereal dropdown (Shopping page) adds "Cereal - <name>"
    to the shopping list if it isn't there yet, then resets the dropdown. (2026-10-17)
