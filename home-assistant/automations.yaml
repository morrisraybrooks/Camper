  - condition: state
    # Two-gesture combo: only works within 30 s of a ✌️ (see camper_gesture_arm)
    entity_id: timer.camper_gesture_armed
    state: active
  actions:
  - action: timer.cancel
    target:
      entity_id: timer.camper_gesture_armed
  - action: switch.turn_off
    target:
      entity_id: switch.ceiling_fan
  mode: single
- id: camper_gesture_keurig_on
