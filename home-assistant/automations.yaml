        - action: NADINE_MEDS_TAKEN
          title: ✓ Took them
- id: nadine_morning_meds_taken
  alias: 'Nadine: Morning Meds Taken (button)'
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: NADINE_MEDS_TAKEN
  actions:
