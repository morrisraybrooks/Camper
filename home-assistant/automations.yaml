      title: "\U0001F6A8 ALARM TRIGGERED!"
      message: Alarmo alarm has been triggered at {{ now().strftime("%I:%M %p") }}!
      data:
        priority: high
        ttl: 0
        channel: Alarm
        tag: alarmo_triggered
