    then:
    - action: script.camper_shopping_toggle
      data:
        item: "{{ item }}"
  - action: input_select.select_option
    target:
      entity_id: input_select.shopping_cereal
    data:
      option: "Pick a cereal..."
- id: sequoia_trans_hot
  alias: 'Sequoia: Transmission Too Hot'
  description: 2016 Sequoia transmission temp (Torque Pro via the ELM327) over 230°F for 30 s -
    mostly when towing the camper. Morris's phone says it out loud on the alarm sound (he's
    driving, so no need to look) and both phones get a notification. 245°F = pull over now.
    Fires again only after it has cooled below the line and climbed back over. (2026-10-17)
  mode: queued
  triggers:
  - trigger: numeric_state
    entity_id: sensor.sequoia_gauge_transmission_temp
    above: 230
    for: 00:00:30
    id: hot
  - trigger: numeric_state
    entity_id: sensor.sequoia_gauge_transmission_temp
    above: 245
    for: 00:00:15
    id: very_hot
  actions:
  - variables:
      temp: "{{ states('sensor.sequoia_gauge_transmission_temp') | int(0) }}"
      very: "{{ trigger.id == 'very_hot' }}"
      say: "{% if very %}Warning. Transmission is {{ temp }} degrees. Pull over safely and let it idle to cool down.{% else %}Transmission is getting hot, {{ temp }} degrees. Slow down or shift to a lower gear.{% endif %}"
  - action: notify.mobile_app_morris_sm_s906u
    continue_on_error: true
    data:
      message: TTS
      data:
        priority: high
        tts_text: "{{ say }}"
        media_stream: alarm_stream
  - action: script.camper_notify_both
    data:
      title: "{{ '\U0001F6D1 Transmission ' ~ temp ~ '°F - pull over' if very else '\U0001F525 Transmission hot: ' ~ temp ~ '°F' }}"
      message: "{% if very %}Pull over safely and let the Sequoia idle in Park so the cooler can bring it down.{% else %}Slow down a little, shift to a lower gear (or turn off overdrive / use Tow-Haul) and watch it come back under 220°F.{% endif %}"
      urgent: true
- id: stereo_forget_station
  alias: 'Stereo: Forget Station Name When Something Else Plays'
  description: The Stereo page shows the preset's name (input_text.stereo_station). When
    anything other than that station is played on the stereo (YouTube, radio search, Test
    voice, Read aloud) clear it so the page doesn't show the wrong name. (2026-10-20)
  mode: queued
  triggers:
  - trigger: event
    event_type: call_service
    event_data:
      domain: media_player
      service: play_media
  - trigger: event
    event_type: call_service
    event_data:
      domain: tts
      service: speak
  conditions:
  - condition: template
    value_template: "{{ 'media_player.camper_stereo' in (trigger.event.data.service_data | string) }}"
  - condition: template
    value_template: "{{ (trigger.event.data.service_data.media_content_id | default('')) != states('input_text.stereo_station_url') }}"
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.stereo_station
    data:
      value: ''
  - action: input_text.set_value
    target:
      entity_id: input_text.stereo_station_url
    data:
      value: ''

# ==== Under-camper heater (freeze protection, added 2026-10-21) ====
# Heater on the old dehumidifier Kasa plug (switch.under_camper_heater), driven by the
# Aqara sensor under the skirting. On below 38°F, off at 45°F; in between, leave it alone.
- id: under_camper_heater_control
  alias: 'Under Camper: Heater On Below 38, Off At 45'
  mode: queued
  triggers:
  - trigger: numeric_state
    entity_id: sensor.under_camper_temperature
    below: 38
  - trigger: numeric_state
    entity_id: sensor.under_camper_temperature
    above: 44.9
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: /15
  conditions:
  - condition: template
    value_template: "{{ states('sensor.under_camper_temperature') | is_number }}"
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.under_camper_temperature
        below: 38
      - condition: state
        entity_id: switch.under_camper_heater
        state: 'off'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.under_camper_heater
    - conditions:
      - condition: numeric_state
        entity_id: sensor.under_camper_temperature
        above: 44.9
      - condition: state
        entity_id: switch.under_camper_heater
        state: 'on'
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.under_camper_heater
- id: under_camper_freeze_alert
  alias: 'Under Camper: Freeze Alert'
  mode: single
  triggers:
  - trigger: numeric_state
    entity_id: sensor.under_camper_temperature
    below: 34
    for: 00:15:00
  actions:
  - action: script.camper_notify_both
    data:
      urgent: true
      title: "🥶 {{ states('sensor.under_camper_temperature') | round(0) }}°F under the camper"
      message: >-
        Pipes could freeze.
        {% if is_state('switch.under_camper_heater', 'on') %}The heater is ON but can't keep up - check that it's running and the skirting is closed.
        {% elif is_state('switch.under_camper_heater', 'off') %}The heater is OFF - turn it on from the Climate page.
        {% else %}The heater plug isn't responding - check that it's plugged in.{% endif %}
- id: under_camper_sensor_offline
  alias: 'Under Camper: Sensor Offline'
  mode: single
  triggers:
  # ZHA marks it unavailable after 3 h with no check-in (consider_unavailable_battery
  # = 10800, counted from the stick's saved last_seen, so restarts don't reset it).
  # The 10 min here only skips rejoin blips; a template (not state+for) re-checks
  # every minute, so a restart can't cancel the wait for good.
  - trigger: template
    value_template: >-
      {{ is_state('sensor.under_camper_temperature', 'unavailable')
         and now() - states.sensor.under_camper_temperature.last_changed
             > timedelta(minutes=10) }}
  actions:
  - action: script.camper_notify_both
    data:
      title: "⚠️ Under-camper sensor offline"
      message: >-
        No reading from the sensor under the camper for 3 hours, so the heater
        can't switch on by itself. Check its battery (it was
        {{ states('sensor.under_camper_battery') }}%).
- id: safety_drive_home_check
  alias: 'Safety: Safe Drive Home Check'
  description: After Morris leaves work at night, if his phone isn't home 75 min
    later (the drive is 30-55 min, store stops included), ask him "Are you OK?".
    No answer in 20 min - tell Nadine, with his last location. Added 2026-10-23.
  mode: single
  triggers:
  - trigger: zone
    entity_id: device_tracker.sm_s906u
    zone: zone.work
    event: leave
  conditions:
  - condition: time
    after: 00:00:00
    before: 09:00:00
  actions:
  - variables:
      left: "{{ now().strftime('%-I:%M') }}"
  - wait_for_trigger:
    - trigger: state
      entity_id: device_tracker.sm_s906u
      to: home
    timeout: 01:15:00
    continue_on_timeout: true
  - condition: template
    value_template: "{{ wait.trigger is none and not is_state('device_tracker.sm_s906u', 'home') }}"
  - action: notify.mobile_app_morris_sm_s906u
    continue_on_error: true
    data:
      message: TTS
      data:
        priority: high
        tts_text: Are you OK? You left work at {{ left }} and you're not home yet. Tap the alert, then tap I'm OK, or I'll tell Nadine in 20 minutes.
        media_stream: alarm_stream
  - action: notify.mobile_app_morris_sm_s906u
    continue_on_error: true
    data:
      title: "\U0001F697 Are you OK?"
      message: You left work at {{ left }} and you're not home yet. Tap here, then tap I'm OK, or I'll tell Nadine in 20 minutes.
      data:
        priority: high
        tag: safe_drive
        clickAction: /lovelace-camper/safe-drive
        actions:
        - action: SAFE_DRIVE_OK
          title: I'm OK
  - wait_for_trigger:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: SAFE_DRIVE_OK
    - trigger: event
      event_type: safe_drive_ok
    - trigger: state
      entity_id: device_tracker.sm_s906u
      to: home
    timeout: 00:20:00
    continue_on_timeout: true
  - if:
    - condition: template
      value_template: "{{ wait.trigger is not none }}"
    then:
    - action: notify.mobile_app_morris_sm_s906u
      continue_on_error: true
      data:
        title: "\u2705 Got it"
        message: Nadine won't be told.
        data:
          tag: safe_drive
    - stop: Morris answered or got home
  - variables:
      lat: "{{ state_attr('device_tracker.sm_s906u', 'latitude') }}"
      lon: "{{ state_attr('device_tracker.sm_s906u', 'longitude') }}"
      seen: "{{ as_local(states.device_tracker.sm_s906u.last_updated).strftime('%-I:%M') }}"
  - action: notify.mobile_app_home
    continue_on_error: true
    data:
      message: TTS
      data:
        priority: high
        tts_text: Morris left work at {{ left }} and is not home yet. He did not answer Are you OK. Please call him.
        media_stream: alarm_stream
  - action: notify.mobile_app_home
    continue_on_error: true
    data:
      title: "\U0001F697 Morris isn't home yet"
      message: He left work at {{ left }} and didn't answer "Are you OK?". Please call him. His phone was last seen at {{ seen }}{{ ' - tap Map' if lat else '' }}.
      data:
        priority: high
        actions: "{{ [{'action': 'URI', 'title': 'Map', 'uri': 'https://maps.google.com/?q=' ~ lat ~ ',' ~ lon}] if lat else [] }}"
- id: voice_find_my_phone
  alias: 'Voice: Find My Phone'
  description: '"Hey Jarvis, find my phone" - Morris''s phone says "Here I am" at
    full alarm volume (works on silent; the volume goes back after). Added 2026-10-23.'
  mode: single
  triggers:
  - trigger: conversation
    command:
    - '[please] (find|ring|call) my (phone|cell phone|cellphone)'
    - where is my (phone|cell phone|cellphone)
    - where's my (phone|cell phone|cellphone)
    - i can't find my (phone|cell phone|cellphone)
    - i cannot find my (phone|cell phone|cellphone)
    - help me find my (phone|cell phone|cellphone)
    - i lost my (phone|cell phone|cellphone)
  actions:
  - set_conversation_response: Ringing your phone now.
  - repeat:
      count: 4
      sequence:
      - action: notify.mobile_app_morris_sm_s906u
        continue_on_error: true
        data:
          message: TTS
          data:
            priority: high
            tts_text: Here I am. Here I am. Morris, your phone is right here.
            media_stream: alarm_stream_max
      - delay: 00:00:07
- id: camper_smoke_alarm_heard
  alias: 'Camper: Smoke Alarm Heard'
  description: The Jetson's webcam mic (sound_watch.py) heard a smoke or CO alarm
    beeping. Only alerts when nobody is home (Daisy is inside). Added 2026-10-23.
  mode: single
  triggers:
  - trigger: webhook
    webhook_id: !secret sound_smoke_webhook_id
    allowed_methods:
    - POST
    local_only: true
  conditions:
  - condition: state
    entity_id: binary_sensor.daisy_home_alone
    state: 'on'
  actions:
  - action: script.camper_notify_both
    data:
      title: "\U0001F525 Smoke alarm going off in the camper"
      message: The camper's microphone hears a smoke or CO alarm beeping. Daisy is inside. Go home or call someone nearby now.
      urgent: true
  - delay: 00:10:00
- id: camper_daisy_barking
  alias: 'Daisy: Barking a Lot'
  description: The Jetson's webcam mic (sound_watch.py) heard barking for a while.
    Only while Daisy is home alone; at most once every 30 min. Added 2026-10-23.
  mode: single
  triggers:
  - trigger: webhook
    webhook_id: !secret sound_bark_webhook_id
    allowed_methods:
    - POST
    local_only: true
  conditions:
  - condition: state
    entity_id: binary_sensor.daisy_home_alone
    state: 'on'
  actions:
  - variables:
      secs: "{{ trigger.json.seconds | default(0) | int(0) if trigger.json is defined else 0 }}"
  - action: notify.mobile_app_morris_sm_s906u
    continue_on_error: true
    data:
      message: TTS
      data:
        priority: high
        tts_text: Daisy is barking a lot. Something may be going on at the camper.
        media_stream: alarm_stream
  - action: notify.mobile_app_morris_sm_s906u
    continue_on_error: true
    data:
      title: "\U0001F415 Daisy is barking a lot"
      message: The camper's microphone heard her bark{{ ' for about ' ~ secs ~ ' seconds' if secs else '' }} in the last few minutes. Something may be going on outside.
      data:
        priority: high
  - delay: 00:30:00
# Freeze-protection safety net for the heater test (2026-10-26): never leave the 38/45
# heater automation switched off for long, and always turn it back on after a restart.
- id: under_camper_heater_test_safety
  alias: 'Under Camper: Heater Test Safety Net'
  mode: single
  triggers:
  - trigger: state
    entity_id: automation.under_camper_heater_on_below_38_off_at_45
    to: 'off'
    for: 00:25:00
  - trigger: homeassistant
    event: start
  conditions:
  - condition: state
    entity_id: automation.under_camper_heater_on_below_38_off_at_45
    state: 'off'
  actions:
  - action: automation.turn_on
    target:
      entity_id: automation.under_camper_heater_on_below_38_off_at_45
  - action: automation.trigger
    target:
      entity_id: automation.under_camper_heater_on_below_38_off_at_45
    data:
      skip_condition: false
