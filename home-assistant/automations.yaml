- id: keurig_auto_off_timer
  alias: 'Keurig: Auto-Off After 30 Minutes'
  description: Automatically turn off Keurig after 30 minutes for safety
  trigger:
  - platform: state
    entity_id: switch.smart_switch_1
    to: 'on'
    for:
      minutes: 30
  action:
  - service: switch.turn_off
    target:
      entity_id: switch.smart_switch_1
  - action: notify.mobile_app_morris_sm_s906u
    continue_on_error: true
    data:
      message: TTS
      data:
        priority: high
        tts_text: "Keurig Auto-Off. Keurig has been automatically turned off after 30 minutes for safety"
        media_stream: alarm_stream
  - action: notify.send_message
    target:
      entity_id: notify.sm_s906u
    data:
      title: ☕ Keurig Auto-Off
      message: Keurig has been automatically turned off after 30 minutes for safety
      data:
        priority: normal
        channel: Keurig Safety
- id: keurig_off_when_leaving
  alias: 'Keurig: Turn Off When Leaving Home'
  description: Turn off Keurig when you leave home for safety
  # Geofence on the phone's GPS (2026-10-24): person.morris stays "home" ~10 min
  # after he drives off because of the Wi-Fi ping tracker.
  trigger:
  - platform: zone
    entity_id: device_tracker.sm_s906u
    zone: zone.home
    event: leave
  condition:
  - condition: state
    entity_id: switch.smart_switch_1
    state: 'on'
  action:
  - service: switch.turn_off
    target:
      entity_id: switch.smart_switch_1
  - action: notify.mobile_app_morris_sm_s906u
    continue_on_error: true
    data:
      message: TTS
      data:
        priority: high
        tts_text: "Keurig Turned Off. Keurig has been turned off because you left home"
        media_stream: alarm_stream
  - action: notify.send_message
    target:
      entity_id: notify.sm_s906u
    data:
      title: ☕ Keurig Turned Off
      message: Keurig has been turned off because you left home
      data:
        priority: normal
        channel: Keurig Safety
- id: aqara_motion_alert_when_away
  alias: 'Aqara: Motion Alert When Away From Home'
  description: Send security alert when Aqara sensor detects motion while you are
    away
  trigger:
  - platform: state
    entity_id: binary_sensor.lumi_lumi_sensor_motion_aq2
    to: 'on'
  condition:
  - condition: template
    value_template: "{{ states('person.morris') not in ['home', 'unknown', 'unavailable']\n
      \  and states('person.nadine') not in ['home', 'unknown', 'unavailable'] }}"
  - condition: state
    entity_id: input_boolean.camper_away_mode
    state: 'on'
  action:
  - action: script.camper_notify_both
    data:
      title: "\U0001F6A8 Motion inside the camper"
      message: The motion sensor saw movement at {{ now().strftime("%-I:%M %p") }}
        while you are both away.
      urgent: true
- id: aqara_battery_low_alert
  alias: 'Aqara: Low Battery Warning'
  description: Alert when Aqara motion sensor battery is low
  trigger:
  - platform: numeric_state
    entity_id: sensor.lumi_lumi_sensor_motion_aq2_battery
    below: 20
  action:
  - action: notify.mobile_app_morris_sm_s906u
    continue_on_error: true
    data:
      message: TTS
      data:
        priority: high
        tts_text: "Aqara Sensor Battery Low. Aqara motion sensor battery is at {{ states(\"sensor.lumi_lumi_sensor_motion_aq2_battery\") }}%. Replace battery soon to maintain security coverage."
        media_stream: alarm_stream
  - action: notify.send_message
    target:
      entity_id: notify.sm_s906u
    data:
      title: "\U0001F50B Aqara Sensor Battery Low"
      message: Aqara motion sensor battery is at {{ states("sensor.lumi_lumi_sensor_motion_aq2_battery")
        }}%. Replace battery soon to maintain security coverage.
      data:
        priority: normal
        channel: Maintenance Alerts
- id: aqara_welcome_home_notification
  alias: 'Aqara: Welcome Home Notification'
  description: Notify when arriving home and motion detected (confirms sensor is working)
  trigger:
  - platform: state
    entity_id: binary_sensor.lumi_lumi_sensor_motion_aq2
    to: 'on'
  condition:
  - condition: state
    entity_id: person.morris
    state: home
  - condition: template
    value_template: '{{ (as_timestamp(now()) - as_timestamp(states.person.morris.last_changed))
      < 300 }}'
  action:
  - action: notify.mobile_app_morris_sm_s906u
    continue_on_error: true
    data:
      message: TTS
      data:
        priority: high
        tts_text: "Welcome Home. Motion detected - welcome back! Aqara sensor is active and monitoring."
        media_stream: alarm_stream
  - action: notify.send_message
    target:
      entity_id: notify.sm_s906u
    data:
      title: "\U0001F3E0 Welcome Home"
      message: Motion detected - welcome back! Aqara sensor is active and monitoring.
      data:
        priority: low
        channel: Home Status
- id: camper_awning_auto_retract
  alias: Camper - Auto-Retract Awning (Rain / Wind)
  description: Retracts the awning on rain, or on measured wind above 10 mph for 20 s
    (only if the optional anemometer is fitted). The firmware's own shake-based
    wind retract (Wind Auto-Retract switch) works without it. Entity IDs follow
    the ESPHome naming for the camper-awning-weather device - check them after
    adoption.
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.camper_awning_camper_awning_rain_detected
    to: 'on'
    id: rain
  - trigger: numeric_state
    entity_id: sensor.camper_awning_camper_awning_wind_speed
    above: 10
    for: 00:00:20
    id: wind
  conditions:
  - condition: template
    value_template: "{{ states('cover.awning') in ['open', 'opening'] }}"
  actions:
  - action: cover.close_cover
    target:
      entity_id: cover.awning
  - action: script.camper_notify_both
    data:
      title: "\U0001F3D5️ Awning auto-retracted"
      message: >-
        {{ 'Rain detected.' if trigger.id == 'rain' else 'Wind at ' ~
        states('sensor.camper_awning_camper_awning_wind_speed') ~ ' mph.' }}
- id: camper_awning_problem_alert
  alias: Camper - Awning Problem / Wind Alert
  description: 'The awning controller reports "Problem: ..." when it stops a stuck,
    stalled or too-long run, and "Wind: auto-retracting" when it pulls the awning
    in on its own.'
  mode: queued
  triggers:
  - trigger: state
    entity_id: sensor.camper_awning_camper_awning_status
  conditions:
  - condition: template
    value_template: >-
      {{ trigger.to_state is not none and
      (trigger.to_state.state.startswith('Problem') or
      trigger.to_state.state.startswith('Wind')) }}
  actions:
  - action: script.camper_notify_both
    data:
      title: "\U0001F3D5️ Awning: {{ trigger.to_state.state }}"
      message: Check the awning. The controller stopped or retracted it on its own.
      urgent: "{{ trigger.to_state.state.startswith('Problem') }}"
- id: camper_awning_retract_from_notification
  alias: Camper - Retract Awning (notification button)
  description: Handles the "Retract awning" button on the storm and weather alerts.
  mode: single
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: RETRACT_AWNING
  conditions:
  - condition: template
    value_template: "{{ states('cover.awning') in ['open', 'opening'] }}"
  actions:
  - action: cover.close_cover
    target:
      entity_id: cover.awning
- id: camper_thermostat_watchdog
  alias: 'Camper: Thermostat Watchdog'
  mode: single
  triggers:
  - trigger: state
    entity_id: binary_sensor.thermostat_problem
    to: 'on'
  actions:
  - action: homeassistant.reload_config_entry
    data:
      entry_id: 01M22Q9RRZ3A7V8WV3GZJTPW02
    continue_on_error: true
  - wait_template: '{{ is_state(''binary_sensor.thermostat_problem'', ''off'') }}'
    timeout: 00:05:00
  - if:
    - condition: state
      entity_id: binary_sensor.thermostat_problem
      state: 'on'
    then:
    - action: script.camper_notify_both
      data:
        title: "\U0001F321️ Thermostat not responding"
        message: HA lost the EasyTouch thermostat and reconnecting didn't fix it.
          If the Micro-Air app is open on a phone, close it (the thermostat only allows
          one connection). If it still won't come back, restart Home Assistant.
        urgent: true
    - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.thermostat_problem
        to: 'off'
      timeout: '12:00:00'
    - if:
      - condition: state
        entity_id: binary_sensor.thermostat_problem
        state: 'off'
      then:
      - action: script.camper_notify_both
        data:
          title: "\U0001F321️ Thermostat back online"
          message: Home Assistant can control the thermostat again.
- id: camper_inside_too_cold
  alias: 'Camper: Inside Too Cold'
  # Template trigger (2026-10-18): also arms when the alert number is changed, so
  # setting the alert past the current temperature works as a test. A numeric_state
  # trigger only fired on the temperature itself crossing the line.
  triggers:
  - trigger: template
    value_template: "{{ state_attr('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate','current_temperature') | float(none) is number
      and state_attr('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate','current_temperature') | float <
      states('number.easytouch_f4_2d_c9_59_e5_52_low_temperature_alert') | float(-999) }}"
    for: 00:10:00
  actions:
  - action: script.camper_notify_both
    data:
      title: "\U0001F976 Camper is {{ state_attr('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate','current_temperature')
        }}°F inside"
      message: Below the thermostat's {{ states('number.easytouch_f4_2d_c9_59_e5_52_low_temperature_alert')
        | int('?') }}°F low alert - pipes and the dog. Check the heat.
      urgent: true
- id: camper_inside_too_hot
  alias: 'Camper: Inside Too Hot'
  # Template trigger (2026-10-18): also arms when the alert number is changed, so
  # setting the alert past the current temperature works as a test. A numeric_state
  # trigger only fired on the temperature itself crossing the line.
  triggers:
  - trigger: template
    value_template: "{{ state_attr('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate','current_temperature') | float(none) is number
      and state_attr('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate','current_temperature') | float >
      states('number.easytouch_f4_2d_c9_59_e5_52_high_temperature_alert') | float(999) }}"
    for: 00:10:00
  actions:
  # Daisy alone (2026-10-23): don't just alert - turn the ceiling fan on and put
  # the A/C in Cool if it isn't already cooling, then say what was done.
  - variables:
      e: climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate
      alone: "{{ is_state('binary_sensor.daisy_home_alone', 'on') }}"
      to_cool: "{{ alone and states(e) not in ['cool', 'auto'] }}"
      cool_to: "{{ states('input_number.camper_smart_cool_to') | int(72) }}"
      fixed: "{% if alone %}Daisy is alone, so I turned on the ceiling fan{{ ' and set the A/C to Cool at ' ~ cool_to ~ '°F' if to_cool else '' }}.{% endif %}"
  - if:
    - condition: template
      value_template: '{{ alone }}'
    then:
    - action: input_select.select_option
      continue_on_error: true
      target:
        entity_id: input_select.camper_ceiling_fan_mode
      data:
        option: Stay On
    - if:
      - condition: template
        value_template: '{{ to_cool }}'
      then:
      - action: climate.set_hvac_mode
        continue_on_error: true
        target:
          entity_id: '{{ e }}'
        data:
          hvac_mode: cool
      - delay: 00:00:08
      - action: climate.set_temperature
        continue_on_error: true
        target:
          entity_id: '{{ e }}'
        data:
          temperature: '{{ cool_to }}'
  - action: script.camper_notify_both
    data:
      title: "\U0001F975 Camper is {{ state_attr('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate','current_temperature')
        }}°F inside"
      message: Above the thermostat's {{ states('number.easytouch_f4_2d_c9_59_e5_52_high_temperature_alert')
        | int('?') }}°F high alert - check on the dog and the A/C.{{ ' ' ~ fixed if fixed else '' }}
      urgent: true
- id: camper_nws_alert
  alias: 'Camper: Severe Weather Alert (NWS)'
  mode: queued
  triggers:
  - trigger: state
    entity_id: sensor.nws_alert_headline
  conditions:
  - condition: template
    value_template: "{{ trigger.to_state.state not in ['None', 'unknown', 'unavailable',
      '']\n   and trigger.from_state is not none\n   and trigger.to_state.state !=
      trigger.from_state.state }}"
  actions:
  - action: script.camper_notify_both
    data:
      title: ⚠️ {{ states('sensor.nws_alerts') }}
      message: '{{ trigger.to_state.state }}'
      urgent: '{{ ''Warning'' in states(''sensor.nws_alerts'') or ''Emergency'' in
        states(''sensor.nws_alerts'') }}'
      actions: "{{ [{'action': 'RETRACT_AWNING', 'title': 'Retract awning'}] if states('cover.awning') in ['open', 'opening'] else [] }}"
- id: camper_everyone_left
  alias: 'Camper: Everyone Left - Power Down'
  # Geofence on both phones' GPS (2026-10-24), no wait: the person entities stay
  # "home" ~10 min after leaving because of the Wi-Fi ping trackers.
  # device_tracker.home is Nadine's phone GPS.
  triggers:
  - trigger: zone
    entity_id:
    - device_tracker.sm_s906u
    - device_tracker.home
    zone: zone.home
    event: leave
  conditions:
  - condition: template
    value_template: "{{ states('device_tracker.sm_s906u') not in ['home', 'unknown', 'unavailable']
      and states('device_tracker.home') not in ['home', 'unknown', 'unavailable'] }}"
  - condition: state
    entity_id: input_boolean.camper_away_mode
    state: 'off'
  actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.camper_away_mode
  - action: switch.turn_off
    target:
      entity_id: switch.smart_switch_1
    continue_on_error: true
  # Nobody home: no running water pump (a split fitting floods the floor) and
  # no gas water heater burning unwatched. Climate stays on for Daisy.
  - action: switch.turn_off
    target:
      entity_id:
      - switch.camper_wall_panel_camper_wall_panel_water_pump
      - switch.camper_wall_panel_camper_wall_panel_water_heater_gas
    continue_on_error: true
  - action: script.camper_dog_tv
  - action: script.camper_notify_both
    data:
      title: "\U0001F690 Camper set to Away"
      message: You're both out. Coffee pot, water pump and water heater are off. Heat/A/C, ceiling fan and TV stay
        on for the dog{% if is_state('media_player.bedroom_50_hisense_roku_tv','playing')
        %} (TV is playing){% endif %}.
- id: camper_someone_back
  alias: 'Camper: Someone Back - Clear Away Mode'
  triggers:
  - trigger: state
    entity_id:
    - person.morris
    - person.nadine
    to: home
  conditions:
  - condition: state
    entity_id: input_boolean.camper_away_mode
    state: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.camper_away_mode
- id: camper_high_humidity
  alias: 'Camper: High Humidity Warning'
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.lumi_lumi_weather_humidity
    above: 60
    for: 02:00:00
  actions:
  - action: script.camper_notify_both
    data:
      title: "\U0001F4A7 Humidity {{ states('sensor.lumi_lumi_weather_humidity') |
        round(0) }}% inside"
      message: >-
        Over 60% for 2 hours - mold risk.
        {% if is_state('binary_sensor.dehumidifier_tank_full', 'on') %}The dehumidifier's tank is FULL - empty it or check the drain hose.
        {% elif is_state('humidifier.midea_dehumidifier', 'off') %}The dehumidifier is OFF - turn it on from the Climate page.
        {% elif is_state('humidifier.midea_dehumidifier', 'on') %}The dehumidifier is on but can't keep up - check its drain hose and that it's blowing air.
        {% else %}Crack a window, run the vent fan, or put the A/C on Dry.{% endif %}
- id: camper_health_internet
  alias: 'Camper Health: Internet Back After Outage'
  triggers:
  - trigger: state
    entity_id: binary_sensor.internet
    from: 'off'
    to: 'on'
  conditions:
  - condition: template
    value_template: '{{ (now() - trigger.from_state.last_changed) > timedelta(minutes=5)
      }}'
  actions:
  - action: script.camper_notify_both
    data:
      title: "\U0001F310 Internet was down"
      message: Out from {{ as_local(trigger.from_state.last_changed).strftime('%-I:%M
        %p') }} to {{ now().strftime('%-I:%M %p') }} ({{ ((now() - trigger.from_state.last_changed).total_seconds()
        / 60) | round(0) | int }} min).
- id: camper_health_brain
  alias: 'Camper Health: Camper Brain Offline'
  triggers:
  - trigger: template
    value_template: '{{ not is_state(''sensor.camper_brain_status'', ''ok'') }}'
    for: 00:10:00
  actions:
  - action: script.camper_notify_both
    data:
      title: "\U0001F9E0 Camper Brain is offline"
      message: Voice/AI control isn't working. Check the Jetson (192.168.0.173) is
        powered on.
- id: camper_health_backup
  alias: 'Camper Health: Backup Overdue'
  triggers:
  - trigger: template
    value_template: '{% set b = as_datetime(states(''sensor.backup_last_successful_automatic_backup''))
      %} {{ b is not none and (now() - b) > timedelta(hours=30) }}'
  actions:
  - action: script.camper_notify_both
    data:
      title: "\U0001F4BE Home Assistant backup overdue"
      message: No successful automatic backup since {{ as_local(as_datetime(states('sensor.backup_last_successful_automatic_backup'))).strftime('%b
        %-d %-I:%M %p') }}. Check Settings → System → Backups.
- id: camper_health_disk
  alias: 'Camper Health: Pi Disk Almost Full'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.system_monitor_disk_usage
    above: 85
    for: 00:30:00
  actions:
  - action: script.camper_notify_both
    data:
      title: "\U0001F4BD Home Assistant disk {{ states('sensor.system_monitor_disk_usage')
        | round(0) }}% full"
      message: The Pi's drive is nearly full. Old backups or the history database
        may need trimming.
- id: camper_health_pi_hot
  alias: 'Camper Health: Pi Overheating'
  triggers:
  - trigger: numeric_state
    entity_id: sensor.system_monitor_processor_temperature
    above: 176
    for: 00:10:00
  actions:
  - action: script.camper_notify_both
    data:
      title: "\U0001F525 Home Assistant Pi is hot"
      message: CPU at {{ states('sensor.system_monitor_processor_temperature') | round(0)
        }}°F. Make sure it has airflow - it's slowing itself down.
- id: camper_hvac_not_keeping_up
  alias: 'Camper: A/C or Heat Not Keeping Up'
  triggers:
  - trigger: template
    value_template: "{% set m = states('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate')
      %} {% set cur = state_attr('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate','current_temperature')
      %} {% set sp = state_attr('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate','temperature')
      %} {{ cur is number and sp is number and\n   ((m == 'cool' and cur >= sp + 3)
      or (m == 'heat' and cur <= sp - 3)) }}"
    for: 00:30:00
  actions:
  - action: script.camper_notify_both
    data:
      title: "{{ '\U0001F975 A/C' if is_state('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate','cool')
        else '\U0001F976 Heat' }} isn't keeping up"
      message: It's {{ state_attr('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate','current_temperature')
        }}°F inside but set to {{ state_attr('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate','temperature')
        }}°F, and it's been that way 30 minutes. Check on the dog and the {{ 'A/C'
        if is_state('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate','cool')
        else 'furnace' }}.
      urgent: true
- id: camper_power_out
  alias: 'Camper: Power Out'
  triggers:
  - trigger: state
    entity_id: binary_sensor.camper_power_out
    from: 'off'
    to: 'on'
  actions:
  - action: script.camper_notify_both
    data:
      title: ⚡ Power is out at the camper
      message: The smart plugs and TV all dropped off - the A/C is probably off. Check
        on the dog.
      urgent: true
- id: camper_power_back
  alias: 'Camper: Power Back'
  triggers:
  - trigger: state
    entity_id: binary_sensor.camper_power_out
    from: 'on'
    to: 'off'
  actions:
  - action: script.camper_notify_both
    data:
      title: ⚡ Power is back at the camper
      message: Out for {{ ((now() - trigger.from_state.last_changed).total_seconds()
        / 60) | round(0) | int }} min. Make sure the A/C came back on.
- id: camper_morning_summary
  alias: 'Camper: Morning Summary'
  # 2026-10-23: Morris sleeps 6 AM-1 PM, so his copy comes at 1 PM. Nadine's is
  # unchanged at 8 AM (same text as camper_notify_both sent her).
  triggers:
  - trigger: time
    at: 08:00:00
    id: nadine
  - trigger: time
    at: '13:00:00'
    id: morris
  actions:
  - action: weather.get_forecasts
    target:
      entity_id: weather.forecast_home
    data:
      type: daily
    response_variable: fc
    continue_on_error: true
  - variables:
      today: '{{ fc[''weather.forecast_home''].forecast[0] if fc is defined and fc[''weather.forecast_home'']
        is defined else none }}'
      problems: '{% set p = [] %} {% if is_state(''binary_sensor.thermostat_problem'',''on'')
        %}{% set p = p + [''thermostat offline''] %}{% endif %} {% if not is_state(''sensor.nws_alerts'',''None'')
        %}{% set p = p + [states(''sensor.nws_alerts'')] %}{% endif %} {% if not is_state(''sensor.camper_brain_status'',''ok'')
        %}{% set p = p + [''Camper Brain offline''] %}{% endif %} {% if is_state(''binary_sensor.internet'',''off'')
        %}{% set p = p + [''internet down''] %}{% endif %} {{ p | join('', '') }}'
  - variables:
      title: ☀️ Good morning
      message: '{% if today %}Today: {{ today.condition | replace(''partlycloudy'',''partly
        cloudy'') | replace(''-'','' '') }}, high {{ today.temperature | round(0)
        }}° / low {{ today.templow | round(0) }}°{% if today.precipitation_probability
        is defined and today.precipitation_probability %}, {{ today.precipitation_probability
        }}% rain{% endif %}. {% endif %}Inside {{ state_attr(''climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate'',''current_temperature'')
        }}°F, {{ states(''sensor.lumi_lumi_weather_humidity'') | round(0) }}% humidity.
        Thermostat: {{ states(''climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate'')
        }} at {% set c = ''climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate'' %}{{
        state_attr(c,''temperature'') if state_attr(c,''temperature'') is not none else
        state_attr(c,''target_temp_low'') ~ ''-'' ~ state_attr(c,''target_temp_high'') }}°F. {{ ''All systems OK.'' if not problems else ''⚠️ '' ~ problems }}'
  - variables:
      tts: "{{ (title ~ '. ' ~ message) | replace('°', ' degrees') | regex_replace('[^ -~]', '') }}"
  - if:
    - condition: trigger
      id: morris
    then:
    - action: notify.mobile_app_morris_sm_s906u
      continue_on_error: true
      data:
        message: TTS
        data:
          priority: high
          tts_text: '{{ tts }}'
          media_stream: alarm_stream
    - action: notify.mobile_app_morris_sm_s906u
      continue_on_error: true
      data:
        title: '{{ title }}'
        message: '{{ message }}'
        data:
          priority: high
    else:
    - action: notify.mobile_app_home
      continue_on_error: true
      data:
        message: TTS
        data:
          tts_text: '{{ tts }}'
          media_stream: alarm_stream
    - action: notify.mobile_app_home
      continue_on_error: true
      data:
        title: '{{ title }}'
        message: '{{ message }}'
- id: care_daily_digest
  alias: 'Care: Daily Due Reminder (2:15 PM)'
  triggers:
  - trigger: time
    at: '14:15:00'
  actions:
  - variables:
      due: "{% from 'camper_tasks.jinja' import task_status %} {{ task_status() |
        from_json | selectattr('days_left', 'le', 0) | list\n   + (task_status('Daisy')
        | from_json | selectattr('days_left', 'eq', 1) | list) }}"
  - condition: template
    value_template: '{{ due | count > 0 }}'
  - variables:
      msg: "{% from 'camper_tasks.jinja' import due_text %} {% for t in due %}{{ '\U0001F436
        ' if t.group == 'Daisy' else '\U0001F527 ' }}{{ t.name }} - {{ due_text(t.days_left)
        }} {% endfor %}"
      payload:
        title: "{{ '\U0001F436 Daisy & camper care' if due | selectattr('group','eq','Daisy')
          | list else '\U0001F527 Camper upkeep due' }}"
        message: '{{ msg | trim }}'
        data:
          actions: '{% set ns = namespace(a=[]) %} {% for t in due[:3] %}{% set ns.a
            = ns.a + [{''action'': ''TASK_DONE_'' ~ t.id, ''title'': ''✓ '' ~ t.name[:18]}]
            %}{% endfor %} {{ ns.a }}'
  - action: notify.mobile_app_morris_sm_s906u
    continue_on_error: true
    data:
      message: TTS
      data:
        priority: high
        tts_text: "{{ (payload.title ~ '. ' ~ payload.message) | replace('\u00b0', ' degrees') | regex_replace('[^ -~]', '') }}"
        media_stream: alarm_stream
  - action: notify.mobile_app_morris_sm_s906u
    continue_on_error: true
    data: "{{ dict(payload, data=dict(payload.data | default({}), priority='high')) }}"
  - action: notify.mobile_app_home
    continue_on_error: true
    data:
      message: TTS
      data:
        tts_text: "{{ (payload.title ~ '. ' ~ payload.message) | replace('\u00b0', ' degrees') | regex_replace('[^ -~]', '') }}"
        media_stream: alarm_stream
  - action: notify.mobile_app_home
    continue_on_error: true
    data: '{{ payload }}'
- id: care_task_done_button
  alias: 'Care: Task Done (button)'
  mode: queued
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.action is string and trigger.event.data.action.startswith(''TASK_DONE_'')
      }}'
  actions:
  - action: script.camper_task_done
    data:
      task: '{{ trigger.event.data.action[10:] }}'
- id: care_daisy_alone_4h
  alias: 'Care: Daisy Alone 4 Hours'
  triggers:
  - trigger: state
    entity_id: binary_sensor.daisy_home_alone
    to: 'on'
    for: 04:00:00
  actions:
  - action: notify.mobile_app_home
    continue_on_error: true
    data:
      message: TTS
      data:
        tts_text: "Daisy has been alone 4 hours. Since {{ as_local(states.binary_sensor.daisy_home_alone.last_changed).strftime('%-I:%M %p') }}. Inside is {{ state_attr('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate','current_temperature') }} degreesF."
        media_stream: alarm_stream
  - action: notify.mobile_app_home
    data:
      title: "\U0001F436 Daisy has been alone 4 hours"
      message: Since {{ as_local(states.binary_sensor.daisy_home_alone.last_changed).strftime('%-I:%M
        %p') }}. Inside is {{ state_attr('climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate','current_temperature')
        }}°F.
- id: care_late_for_work
  alias: 'Schedule: Still Home - Late for Work?'
  triggers:
  - trigger: time
    at: '15:05:00'
    id: first
  - trigger: time
    at: '15:10:00'
    id: second
  conditions:
  - condition: template
    value_template: "{{ now().weekday() in [6, 0, 1, 2]\n   or (now().weekday() ==
      3 and is_state('input_boolean.camper_overtime_thursday', 'on')) }}"
  # The phone's GPS tracker, not person.morris: the ping tracker on person.morris
  # keeps him "home" for 10 min (consider_home 600) after he drives off.
  - condition: state
    entity_id: device_tracker.sm_s906u
    state: home
  # Still in the home zone but already driving off (2026-10-24): on 10/22 the
  # phone was pulling out at 22 mph at 3:09:54 and the 3:10 alert still went out.
  # speed is m/s; 3 m/s is about 7 mph.
  - condition: template
    value_template: "{{ state_attr('device_tracker.sm_s906u', 'speed') | float(0) < 3 }}"
  actions:
  - action: notify.mobile_app_morris_sm_s906u
    continue_on_error: true
    data:
      message: TTS
      data:
        priority: high
        ttl: 0
        tts_text: "It's {{ now().strftime('%-I:%M') }}. {{ 'Time to go to work. You need to leave now.' if trigger.id == 'first' else 'You are still home. You are going to be late.' }}"
        media_stream: alarm_stream
  - action: notify.mobile_app_morris_sm_s906u
    data:
      title: >-
        {{ ("⏰ " if trigger.id == "first" else "🚨 ") ~ now().strftime("%-I:%M") ~ " - "
           ~ ("Time to go!" if trigger.id == "first" else "You're going to be late!") }}
      message: >-
        {{ "It's " ~ now().strftime("%-I:%M") ~ ". "
           ~ ("Time to go, you need to leave now." if trigger.id == "first"
              else "You're still home. You're going to be late.") }}
      data:
        priority: high
        ttl: 0
- id: ceiling_fan_auto_temperature_control
  alias: 'Ceiling Fan: Auto Temperature Control'
  description: Turn the ceiling fan on above the threshold temperature and off 2°F
    below it. Only while Ceiling Fan Mode is Auto (Stay On / Stay Off override it).
    Unlocking doesn't trigger it - the fan stays as it is until the next temperature
    reading.
  trigger:
  - platform: state
    entity_id: sensor.lumi_lumi_weather_temperature
  - platform: state
    entity_id: input_number.camper_fan_temp_threshold
  variables:
    temp: '{{ states(''sensor.lumi_lumi_weather_temperature'') | float(0) }}'
    threshold: '{{ states(''input_number.camper_fan_temp_threshold'') | float(78)
      }}'
  condition:
  - condition: template
    value_template: '{{ has_value(''sensor.lumi_lumi_weather_temperature'') }}'
  - condition: state
    entity_id: input_select.camper_ceiling_fan_mode
    state: Auto
  action:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ temp > threshold }}'
      - condition: state
        entity_id: switch.ceiling_fan
        state: 'off'
      sequence:
      - service: switch.turn_on
        target:
          entity_id: switch.ceiling_fan
    - conditions:
      - condition: template
        value_template: '{{ temp < (threshold - 2) }}'
      - condition: state
        entity_id: switch.ceiling_fan
        state: 'on'
      sequence:
      - service: switch.turn_off
        target:
          entity_id: switch.ceiling_fan
- id: ceiling_fan_override
  alias: 'Ceiling Fan: Override (Stay On / Stay Off)'
  description: Ceiling Fan Mode dropdown. Stay On / Stay Off switch the fan and the
    temperature automation leaves it alone until the mode goes back to Auto.
  mode: restart
  triggers:
  - trigger: state
    entity_id: input_select.camper_ceiling_fan_mode
    to:
    - Stay On
    - Stay Off
  actions:
  - action: "switch.turn_{{ 'on' if trigger.to_state.state == 'Stay On' else 'off' }}"
    target:
      entity_id: switch.ceiling_fan
- id: ceiling_fan_locked_follow
  alias: 'Ceiling Fan: Lock Follows a Tap'
  description: While the fan is locked (Stay On / Stay Off), a person switching it
    (dashboard tap, Kasa app, the plug's own button) moves the lock to match. Anything
    an automation does (e.g. a camera gesture) is switched straight back, so the lock
    wins. Gesture events from 2026-10-10 kept turning a locked-off fan on.
  mode: queued
  triggers:
  - trigger: state
    entity_id: switch.ceiling_fan
    to:
    - 'on'
    - 'off'
  variables:
    mode: "{{ states('input_select.camper_ceiling_fan_mode') }}"
    locked_state: "{{ 'on' if mode == 'Stay On' else 'off' }}"
    by_person: '{{ trigger.to_state.context.parent_id is none }}'
  conditions:
  - condition: template
    value_template: "{{ mode != 'Auto' and trigger.to_state.state != locked_state }}"
  actions:
  - if:
    - condition: template
      value_template: '{{ by_person }}'
    then:
    - action: input_select.select_option
      target:
        entity_id: input_select.camper_ceiling_fan_mode
      data:
        option: "{{ 'Stay On' if trigger.to_state.state == 'on' else 'Stay Off' }}"
    else:
    - action: switch.turn_{{ locked_state }}
      target:
        entity_id: switch.ceiling_fan
- id: presence_arrived_home_notify_both
  # 2026-10-24: Morris only wants to hear about Nadine - when she leaves Child
  # Care and when she gets home. No alert when Morris gets home, and nothing to
  # Nadine's phone (she knows when she's home, and she's asleep when he gets in).
  alias: 'Presence: Tell Morris When Nadine Leaves Work or Gets Home'
  mode: queued
  triggers:
  - trigger: state
    entity_id: person.nadine
    to: home
    for: 00:01:00
    id: home
  # Geofence: fires the moment she crosses out of the Child Care zone
  - trigger: zone
    entity_id: person.nadine
    zone: zone.nadine_s_work
    event: leave
    id: left_work
  conditions:
  - condition: template
    value_template: '{{ trigger.id == ''left_work'' or trigger.from_state.state
      not in [''unknown'', ''unavailable'', ''home''] }}'
  # Ignore app reconnect blips: the tracker goes unavailable->home in the same
  # second, so person flips not_home->home with ~0 s away (2026-10-23 5:38 AM).
  - condition: template
    value_template: '{{ trigger.id == ''left_work'' or (trigger.to_state.last_changed
      - trigger.from_state.last_changed).total_seconds() > 60 }}'
  actions:
  - variables:
      title: "{{ '\U0001F697 Nadine left work' if trigger.id == 'left_work' else '\U0001F3E0 Nadine is home' }}"
      message: "{{ 'Nadine left Child Care' if trigger.id == 'left_work' else 'Nadine just got home' }} ({{ now().strftime('%-I:%M %p') }})."
  - action: notify.mobile_app_morris_sm_s906u
    continue_on_error: true
    data:
      message: TTS
      data:
        priority: high
        tts_text: "{{ message }}"
        media_stream: alarm_stream
  - action: notify.mobile_app_morris_sm_s906u
    continue_on_error: true
    data:
      title: "{{ title }}"
      message: "{{ message }}"
      data:
        priority: high
- id: schedule_wake_check
  alias: 'Schedule: Are You Up? (2:15 PM)'
  description: Backup for Morris's 2:00 PM phone alarm. On work days, if he's home
    and the camper motion sensor hasn't seen anything since 1:30 PM, wake him up.
  triggers:
  - trigger: time
    at: '14:15:00'
  conditions:
  - condition: template
    value_template: "{{ now().weekday() in [6, 0, 1, 2]\n   or (now().weekday() ==
      3 and is_state('input_boolean.camper_overtime_thursday', 'on')) }}"
  - condition: state
    entity_id: device_tracker.sm_s906u
    state: home
  # No motion since 1:30 PM. Unavailable sensor = no alert.
  - condition: template
    value_template: "{{ is_state('binary_sensor.lumi_lumi_sensor_motion_aq2', 'off')
      and states.binary_sensor.lumi_lumi_sensor_motion_aq2.last_changed < today_at('13:30') }}"
  actions:
  - action: notify.mobile_app_morris_sm_s906u
    continue_on_error: true
    data:
      message: TTS
      data:
        priority: high
        ttl: 0
        tts_text: "Wake up Morris! It's {{ now().strftime('%-I:%M') }}. You have work tonight."
        media_stream: alarm_stream
  - action: notify.mobile_app_morris_sm_s906u
    data:
      title: "⏰ {{ now().strftime('%-I:%M') }} - Are you up?"
      message: No movement in the camper since {{ as_local(states.binary_sensor.lumi_lumi_sensor_motion_aq2.last_changed).strftime('%-I:%M %p') }}. You have work tonight.
      data:
        priority: high
        ttl: 0
- id: schedule_work_reminder
  alias: 'Schedule: Work Reminder (2:30 PM)'
  triggers:
  - trigger: time
    at: '14:30:00'
  conditions:
  - condition: template
    value_template: "{{ now().weekday() in [6, 0, 1, 2]\n   or (now().weekday() ==
      3 and is_state('input_boolean.camper_overtime_thursday', 'on')) }}"
  actions:
  # 2026-10-23: add a low phone battery warning and the weather for the drive
  # home (2-6 AM tomorrow, hourly forecast).
  - action: weather.get_forecasts
    continue_on_error: true
    target:
      entity_id: weather.forecast_home
    data:
      type: hourly
    response_variable: hourly
  - variables:
      batt: "{{ states('sensor.morris_sm_s906u_battery_level') | int(100) }}"
      phone: "{{ 'Your phone is at ' ~ batt ~ '%. Plug it in before you go.' if batt < 50 and not is_state('binary_sensor.morris_sm_s906u_is_charging', 'on') else '' }}"
      drive: >-
        {% set start = today_at('02:00') + timedelta(days=1) %}{% set end = start + timedelta(hours=4) %}
        {% set ns = namespace(t=[], rain=false) %}
        {% if hourly is defined and hourly['weather.forecast_home'] is defined %}
        {% for f in hourly['weather.forecast_home'].forecast %}{% set d = as_local(as_datetime(f.datetime)) %}
        {% if start <= d < end %}{% set ns.t = ns.t + [f.temperature | float] %}
        {% if f.precipitation | float(0) > 0 or f.condition in ['rainy', 'pouring', 'snowy', 'snowy-rainy', 'lightning-rainy', 'hail'] %}{% set ns.rain = true %}{% endif %}
        {% endif %}{% endfor %}{% endif %}
        {% if ns.t %}{% set lo = ns.t | min | round(0) | int %}Drive home at 4 AM: {{ lo }}°{{ ' with rain' if ns.rain else '' }}.{{ ' Near freezing - watch for frost on the road.' if lo <= 34 else '' }}{{ ' Take a warm coat.' if lo < 45 else (' Take a jacket.' if lo < 60 else '') }}{% endif %}
      # 2026-10-27: the 2:30 message is the daily update - time, weather and temp.
      sky: >-
        {{ {'sunny': 'Sunny', 'clear-night': 'Clear', 'partlycloudy': 'Partly cloudy', 'cloudy': 'Cloudy',
            'rainy': 'Rain', 'pouring': 'Heavy rain', 'lightning': 'Thunder', 'lightning-rainy': 'Thunderstorms',
            'fog': 'Fog', 'windy': 'Windy', 'windy-variant': 'Windy and cloudy', 'snowy': 'Snow',
            'snowy-rainy': 'Sleet', 'hail': 'Hail'}.get(states('weather.forecast_home'), '') }}
      now_temp: "{{ state_attr('weather.forecast_home', 'temperature') | round(0) | int if state_attr('weather.forecast_home', 'temperature') is number else '' }}"
      update: "It's {{ now().strftime('%-I:%M %p') }}, {{ now().strftime('%A') }}.{{ ' ' ~ sky ~ (',' if now_temp != '' else '.') if sky else '' }}{{ ' ' ~ now_temp ~ '° outside.' if now_temp != '' else '' }}"
      extra: "{{ [phone, drive] | select | join(' ') }}"
  - action: notify.mobile_app_morris_sm_s906u
    continue_on_error: true
    data:
      message: TTS
      data:
        priority: high
        tts_text: "Work tonight{{ ' (overtime)' if now().weekday() == 3 else '' }}. {{ update | replace('°', ' degrees') }}{% if now().weekday() == 2 and is_state('input_boolean.camper_trash_out', 'off') %} Put the trash out before you go!{% endif %}{{ ' ' ~ extra | replace('°', ' degrees') if extra else '' }}"
        media_stream: alarm_stream
  - action: notify.mobile_app_morris_sm_s906u
    data:
      title: "\U0001F4BC {{ now().strftime('%-I:%M') }} - Work tonight{{ ' (overtime)' if now().weekday() == 3 else
        '' }}"
      message: "{{ update }}{%
        if now().weekday() == 2 and is_state('input_boolean.camper_trash_out', 'off')
        %} \U0001F5D1️ Put the trash out before you go!{% endif %}{{ ' ' ~ extra if extra else '' }}"
      data:
        priority: high
