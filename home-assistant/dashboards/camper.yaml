  - title: "Sequoia"
    path: sequoia
    icon: mdi:car-estate
    visible: false  # reached via the badge bar, not tabs
    badges:
      - *b_home
      - *b_schedule
      - *b_water
      - *b_power
      - *b_awning
      - *b_lights
      - *b_keurig
      - *b_ceiling_fan
      - *b_security
      - *b_climate
      - *b_dehumidifier
      - *b_tv
      - *b_stereo
      - *b_daisy
      - *b_upkeep
      - *b_shopping
      - <<: *b_sequoia
        card_mod: *badge_active
      - *b_drive
      - *b_fishing
      - *b_weather
    cards:
      - type: markdown
        content: " "
        card_mod:
          style: |
            ha-card {
              --primary-text-color: #2B2A28 !important;
              --secondary-text-color: #6B6558 !important;
              opacity: 1 !important;
              position: fixed !important;
              top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
              z-index: -1 !important;
              border-radius: 0 !important;
              box-shadow: none !important;
              background: {% if is_state('input_select.camper_background','Beach') %}url('/local/backgrounds/ocean-paradise.jpg') center/cover fixed{% elif is_state('input_select.camper_background','Forest') %}url('/local/backgrounds/enchanted-forest.jpg') center/cover fixed{% else %}#FBF3E7 fixed{% endif %} !important;
            }
      # 2016 Toyota Sequoia (2026-10-17): Torque Pro on Morris's phone -> HA. Big gauges for
      # low vision. Readings come from the sensor.sequoia_gauge_* template sensors.
      - type: custom:mushroom-template-card
        primary: "🚙 2016 Toyota Sequoia"
        secondary: >-
          {% set last = states('sensor.sequoia_last_update') %}{% if last in ['unknown', 'unavailable', 'None', ''] %}No readings yet - start the Sequoia with the OBD box and phone hotspot on (or Torque).{% elif (now() - as_datetime(last)).total_seconds() < 120 %}Live - updated {{ relative_time(as_datetime(last)) }} ago{% else %}Parked - last reading {{ relative_time(as_datetime(last)) }} ago{% endif %}
        icon: mdi:car-estate
        icon_color: >-
          {% set last = states('sensor.sequoia_last_update') %}{{ 'green' if last not in ['unknown', 'unavailable', 'None', ''] and (now() - as_datetime(last)).total_seconds() < 120 else 'grey' }}
        multiline_secondary: true
        card_mod:
          style: |
            ha-card { --icon-size: 56px !important; background: linear-gradient(160deg, #FDE9D9, #FBDFC4) !important; border-radius: 26px !important; border: 1px solid rgba(255, 150, 50, 0.5) !important; }
            ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 800 !important; font-size: 24px !important; }
            ha-card [slot=secondary] { color: #4A463F !important; font-size: 16px !important; }
      - type: custom:stack-in-card
        keep: { background: true, border_radius: true }
        card_mod: *badge_style
        cards:
          - type: custom:mushroom-title-card
            title: "Gauges"
            card_mod: *title_style
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.sequoia_gauge_speed
                state_not: unavailable
            card:
              type: grid
              columns: 2
              square: false
              cards:
              - type: gauge
                entity: sensor.sequoia_gauge_speed
                name: Speed (mph)
                min: 0
                max: 100
                needle: true
                segments:
                  - from: 0
                    color: "#43A047"
                  - from: 75
                    color: "#FBC02D"
                  - from: 85
                    color: "#E53935"
                card_mod:
                  style: |
                    ha-card { background: #FFFFFF !important; border-radius: 18px !important; border: 1px solid #E3D9C7 !important; padding-bottom: 6px !important; }
                    .name { font-size: 19px !important; font-weight: 700 !important; color: #2B2A28 !important; }
              - type: gauge
