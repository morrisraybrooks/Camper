              {% elif is_state('binary_sensor.dehumidifier_tank_full', 'on') %}🪣 Tank full - empty it or check the drain hose
              {% elif is_state('humidifier.midea_dehumidifier', 'off') %}⏸️ Off - {{ h }}% inside
              {% else %}💨 On - {{ h }}% inside, target {{ state_attr('humidifier.midea_dehumidifier', 'humidity') | int(0) }}%{% endif %}
            secondary: >-
              Tank {{ 'FULL' if is_state('binary_sensor.dehumidifier_tank_full', 'on') else 'OK' }}{{ ' · clean the filter' if is_state('binary_sensor.dehumidifier_filter_reminder', 'on') else '' }}
            icon: mdi:water-percent
            icon_color: >-
              {% if is_state('binary_sensor.dehumidifier_tank_full', 'on') %}red{% elif is_state('humidifier.midea_dehumidifier', 'on') %}blue{% else %}grey{% endif %}
            card_mod:
              style: |
                ha-card { opacity: 1 !important; background: #FFFFFF !important; border-radius: 16px !important; border: 1px solid #E3D9C7 !important; margin-top: 8px; }
                ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 600 !important; }
