          # Zigbee signal of the under-camper sensor (2026-10-25): it dropped out at RSSI -80 before
          - type: custom:mushroom-template-card
            entity: sensor.under_camper_rssi
            primary: >-
              {% set r = states('sensor.under_camper_rssi') | int(-999) %}Signal {% if r == -999 %}unknown{% elif r >= -65 %}Strong{% elif r >= -78 %}OK{% else %}Weak{% endif %}
            secondary: >-
              {% set r = states('sensor.under_camper_rssi') | int(-999) %}{% if r == -999 %}Waiting for the sensor to report{% elif r >= -78 %}{{ r }} dBm · good connection to the hub{% else %}{{ r }} dBm · may drop out - move it closer or add a Zigbee booster{% endif %}
            icon: >-
              {% set r = states('sensor.under_camper_rssi') | int(-999) %}{% if r == -999 %}mdi:wifi-strength-off-outline{% elif r >= -65 %}mdi:wifi-strength-4{% elif r >= -78 %}mdi:wifi-strength-2{% else %}mdi:wifi-strength-1-alert{% endif %}
            icon_color: >-
              {% set r = states('sensor.under_camper_rssi') | int(-999) %}{% if r == -999 %}grey{% elif r >= -65 %}green{% elif r >= -78 %}amber{% else %}red{% endif %}
            multiline_secondary: true
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card { opacity: 1 !important; background: #FFFFFF !important; border-radius: 16px !important; border: 1px solid #E3D9C7 !important; margin-top: 8px; position: relative !important; padding-bottom: 40px !important; }
                ha-card::before { content: ""; position: absolute; left: 14px; right: 14px; bottom: 12px; height: 22px; border-radius: 11px; background: linear-gradient(90deg, #D32F2F 0%, #F57C00 30%, #FBC02D 50%, #7CB342 70%, #2E7D32 100%); border: 2px solid #4A463F; box-sizing: border-box; }
                ha-card::after { content: ""; position: absolute; right: 16px; bottom: 14px; height: 18px; left: calc(16px + (100% - 32px) * {% set r = states('sensor.under_camper_rssi') | int(-999) %}{{ 0 if r == -999 else ([0, [100, ((r + 95) / 45 * 100) | round(0)] | min] | max) }} / 100); border-radius: 0 9px 9px 0; background: #E6E1D8; }
                ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 700 !important; font-size: 17px !important; }
                ha-card [slot=secondary] { color: #4A463F !important; font-size: 14px !important; }
          - type: custom:mushroom-template-card
            entity: switch.under_camper_heater
