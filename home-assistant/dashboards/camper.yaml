              {% if held and on %}
              background: #8E6CD8 !important;
              border: 2px solid #6A4BB5 !important;
              box-shadow: 0 0 10px rgba(142,108,216,0.85) !important;
              {% elif held %}
              background: #5B7083 !important;
              border: 2px solid #3F5263 !important;
              box-shadow: 0 0 10px rgba(91,112,131,0.8) !important;
              {% else %}
              background: #F6A04D !important;
              border: 2px solid #E07B1F !important;
              box-shadow: 0 0 10px rgba(246,160,77,0.8) !important;
              {% endif %}
            }
            .label, .content { color: #FFFFFF !important; }
            ha-state-icon { color: #FFFFFF !important; }
            {% if on %}
            /* spin while the fan is on (2026-10-23) */
            @keyframes fanspin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
            ha-state-icon { display: inline-block !important; animation: fanspin 1.5s linear infinite !important; }
            {% endif %}
            {% endif %}
      - *b_security
      - *b_climate
      - *b_dehumidifier
      - *b_tv
      - *b_stereo
      - *b_daisy
      - *b_upkeep
      - *b_shopping
      - *b_sequoia
      - *b_drive
      - *b_fishing
      - *b_weather
    cards:
      - type: markdown
        content: " "
        card_mod:
          style: |
            ha-card {
              --primary-text-color: #2B2A28 !important;
              --secondary-text-color: #6B6558 !important;
              opacity: 1 !important;
              position: fixed !important;
              top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
              z-index: -1 !important;
              border-radius: 0 !important;
              box-shadow: none !important;
              background: {% if is_state('input_select.camper_background','Beach') %}url('/local/backgrounds/ocean-paradise.jpg') center/cover fixed{% elif is_state('input_select.camper_background','Forest') %}url('/local/backgrounds/enchanted-forest.jpg') center/cover fixed{% else %}#FBF3E7 fixed{% endif %} !important;
            }
      - type: custom:mushroom-template-card
        primary: "🌀 Ceiling Fan"
        secondary: >-
          {% set mode = states('input_select.camper_ceiling_fan_mode') %}{{ 'On' if is_state('switch.ceiling_fan','on') else 'Off' }} · {{ 'Auto above ' ~ (states('input_number.camper_fan_temp_threshold') | float(0) | round(0) | int) ~ '°F' if mode == 'Auto' else 'Locked ' ~ ('on' if mode == 'Stay On' else 'off') }} · inside {{ states('sensor.lumi_lumi_weather_temperature') | float(0) | round(1) }}°F
        icon: >-
          {{ 'mdi:fan-off' if is_state('input_select.camper_ceiling_fan_mode','Stay Off') else 'mdi:fan' }}
        icon_color: >-
          {% set mode = states('input_select.camper_ceiling_fan_mode') %}{{ 'purple' if mode == 'Stay On' else ('blue-grey' if mode == 'Stay Off' else ('orange' if is_state('switch.ceiling_fan','on') else 'grey')) }}
        multiline_secondary: true
        card_mod:
          style: |
            ha-card {
              --primary-text-color: #2B2A28 !important;
              --secondary-text-color: #6B6558 !important;
              opacity: 1 !important;
              background: linear-gradient(160deg, #FDE9D9, #FBDFC4) !important;
              border-radius: 26px !important;
              border: 1px solid rgba(255, 150, 50, 0.5) !important;
              box-shadow: 0 0 24px rgba(255, 130, 30, 0.3), 0 8px 24px rgba(0,0,0,0.5) !important;
            }
            ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 700 !important; font-size: 22px !important; }
            ha-card [slot=secondary] { color: #6B6558 !important; }
            {% if is_state('switch.ceiling_fan','on') %}
            @keyframes fanspin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
            ha-card ha-state-icon { display: inline-block !important; animation: fanspin 1.5s linear infinite !important; }
            {% endif %}

      # ============================================
      # CEILING FAN (temperature-automated) - moved here from Climate 2026-10-10
      # ============================================
      - type: custom:stack-in-card
        card_mod: *badge_style
        cards:
          - type: custom:mushroom-title-card
            title: "Ceiling Fan"
            card_mod: *title_style
          - type: custom:mushroom-entity-card
            layout: horizontal
            entity: switch.ceiling_fan
            name: Ceiling Fan
            icon: mdi:fan
            fill_container: true
            tap_action: { action: toggle }
            # Double-tap = lock the fan as it is now (Stay On / Stay Off); again = unlock
            double_tap_action:
              action: perform-action
              perform_action: script.camper_ceiling_fan_hold
            card_mod:
              style: |
                ha-card {
                  --primary-text-color: #2B2A28 !important;
                  --secondary-text-color: #6B6558 !important;
                  opacity: 1 !important;
                  background: {% if is_state('switch.ceiling_fan','on') %}linear-gradient(145deg,#3FBCAE,#2E9E90){% else %}#FFFFFF{% endif %} !important;
                  border-radius: 16px !important;
                  border: 1px solid {% if is_state('switch.ceiling_fan','on') %}#5FCFC2{% else %}#E3D9C7{% endif %} !important;
                }
                ha-card .primary { color: {% if is_state('switch.ceiling_fan','on') %}#E8F6F3{% else %}#2B2A28{% endif %} !important; font-weight: 600 !important; }
                ha-card .secondary { color: {% if is_state('switch.ceiling_fan','on') %}#E8F6F3{% else %}#6B6558{% endif %} !important; }
                ha-card ha-state-icon { color: {% if is_state('switch.ceiling_fan','on') %}#E8F6F3{% else %}#6B6558{% endif %} !important; }
                {% if is_state('switch.ceiling_fan','on') %}
                @keyframes fanspin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
                ha-card ha-state-icon { display: inline-block !important; animation: fanspin 1.5s linear infinite !important; }
                {% endif %}
          # Override (2026-10-10): Stay On / Stay Off hold the fan; Auto hands it back to the temperature
          - type: custom:mushroom-select-card
            entity: input_select.camper_ceiling_fan_mode
            name: Mode
            icon: mdi:fan-auto
            icon_color: teal
            fill_container: true
            card_mod:
              style: |
                ha-card {
                  --primary-text-color: #2B2A28 !important;
                  --secondary-text-color: #6B6558 !important;
                  opacity: 1 !important;
                  background: {% if is_state('input_select.camper_ceiling_fan_mode','Auto') %}#FFFFFF{% else %}#FDE9D9{% endif %} !important;
                  border-radius: 16px !important;
                  border: 1px solid {% if is_state('input_select.camper_ceiling_fan_mode','Auto') %}#E3D9C7{% else %}#F6A04D{% endif %} !important;
                }
          - type: markdown
            content: "**Auto-On Temperature** — in Auto, fan turns on above this, off 2°F below it"
            card_mod:
              style: |
                ha-card { background: none !important; border: none !important; box-shadow: none !important; padding: 4px 4px 0 4px !important; }
                ha-markdown { color: #8A8478 !important; font-size: 12px !important; }
          - type: custom:mushroom-number-card
            entity: input_number.camper_fan_temp_threshold
            layout: horizontal
            display_mode: slider
            icon: mdi:thermometer-alert
            card_mod:
              style: |
                ha-card {
                  --primary-text-color: #2B2A28 !important;
                  --secondary-text-color: #6B6558 !important;
                  opacity: 1 !important;
                  background: #DFF3F0 !important;
                  border-radius: 16px !important;
                  border: 1px solid #BFE6E0 !important;
                }
                ha-card .primary { color: #2B2A28 !important; font-weight: 600 !important; }
                ha-card .secondary { color: #6B6558 !important; }
                ha-card ha-state-icon { color: #3FBCAE !important; }
          - type: markdown
            content: "Double-tap the fan button or the badge to lock the fan the way it is. Double-tap again to unlock."
            card_mod:
              style: |
                ha-card { background: none !important; border: none !important; box-shadow: none !important; padding: 0 4px !important; }
                ha-markdown { color: #8A8478 !important; font-size: 12px !important; }

  - title: "Awning"
    path: awning
    icon: mdi:awning-outline
    visible: false  # reached via the badge bar, not tabs
    # current page's badge is highlighted light blue
    badges:
      - *b_home
      - *b_schedule
      - *b_water
      - *b_power
      - <<: *b_awning
        card_mod: *badge_active
      - *b_lights
      - *b_keurig
      - *b_ceiling_fan
      - *b_security
      - *b_climate
      - *b_dehumidifier
      - *b_tv
      - *b_stereo
      - *b_daisy
      - *b_upkeep
      - *b_shopping
      - *b_sequoia
      - *b_drive
      - *b_fishing
      - *b_weather
    cards:
      - type: markdown
        content: " "
        card_mod:
          style: |
            ha-card {
              --primary-text-color: #2B2A28 !important;
              --secondary-text-color: #6B6558 !important;
              opacity: 1 !important;
              position: fixed !important;
              top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
              z-index: -1 !important;
              border-radius: 0 !important;
              box-shadow: none !important;
              background: {% if is_state('input_select.camper_background','Beach') %}url('/local/backgrounds/ocean-paradise.jpg') center/cover fixed{% elif is_state('input_select.camper_background','Forest') %}url('/local/backgrounds/enchanted-forest.jpg') center/cover fixed{% else %}#FBF3E7 fixed{% endif %} !important;
            }
      - type: custom:mushroom-template-card
        primary: "🏕️ Awning"
        secondary: >-
          {% set s = states('cover.awning') %}
          {% if s == 'open' %}Extended
          {% elif s == 'closed' %}Retracted
          {% elif s == 'opening' %}Extending…
          {% elif s == 'closing' %}Retracting…
          {% else %}Unknown{% endif %}
        icon: mdi:awning-outline
        icon_color: >-
          {% set s = states('cover.awning') %}
          {% if s == 'open' %}green
          {% elif s == 'closed' %}grey
          {% else %}orange{% endif %}
        card_mod:
          style: |
            ha-card {
              --primary-text-color: #2B2A28 !important;
              --secondary-text-color: #6B6558 !important;
              opacity: 1 !important;
              background: linear-gradient(160deg, #FDE9D9, #FBDFC4) !important;
              border-radius: 26px !important;
              border: 1px solid rgba(255, 150, 30, 0.5) !important;
              box-shadow: 0 0 24px rgba(255, 130, 30, 0.3), 0 8px 24px rgba(0,0,0,0.5) !important;
            }
            ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 700 !important; font-size: 22px !important; }
            ha-card [slot=secondary] { color: #6B6558 !important; }

      # ============================================
      # POSITION CONTROL
      # ============================================
      - type: custom:stack-in-card
        card_mod: *badge_style
        cards:
          - type: custom:mushroom-title-card
            title: "Position"
            card_mod: *title_style
          # Calibrated: the normal cover card (it knows the position).
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.camper_awning_camper_awning_calibration
                state: Calibrated
            card:
              type: custom:mushroom-cover-card
              entity: cover.awning
              name: Awning
              show_buttons_control: true
              fill_container: true
              card_mod:
                style: |
                  ha-card { background: #FFFFFF !important; border-radius: 16px !important; border: 1px solid #E3D9C7 !important; }
                  ha-card .primary { color: #2B2A28 !important; font-weight: 600 !important; }
                  ha-card .secondary { color: #6B6558 !important; }
          # Not calibrated: the ESP32 can't tell where the awning is (it
          # reports 100 %, which greys out Open), so plain big buttons.
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.camper_awning_camper_awning_calibration
                state_not: Calibrated
            card:
              type: grid
              columns: 3
              square: false
              cards:
                - &aw_btn
                  type: custom:mushroom-template-card
                  primary: Open
                  icon: mdi:arrow-up-bold-circle
                  icon_color: green
                  layout: vertical
                  tap_action:
                    action: perform-action
                    perform_action: cover.open_cover
                    target:
                      entity_id: cover.awning
                  card_mod:
                    style: |
                      ha-card { background: #FFFFFF !important; border-radius: 16px !important; border: 1px solid #E3D9C7 !important; --icon-size: 64px !important; }
                      ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 800 !important; font-size: 22px !important; }
                - <<: *aw_btn
                  primary: Stop
                  icon: mdi:stop-circle
                  icon_color: red
                  tap_action:
                    action: perform-action
                    perform_action: cover.stop_cover
                    target:
                      entity_id: cover.awning
                - <<: *aw_btn
                  primary: Close
                  icon: mdi:arrow-down-bold-circle
                  icon_color: blue
                  tap_action:
                    action: perform-action
                    perform_action: cover.close_cover
                    target:
                      entity_id: cover.awning
          # Arm Tilt from the awning ESP32's MPU-6050 (2026-10-26)
          - type: custom:mushroom-template-card
            entity: sensor.camper_awning_camper_awning_arm_tilt
            primary: >-
              {% set t = states('sensor.camper_awning_camper_awning_arm_tilt') %}{{ (t | float(0) | round(0) | int) ~ '°' if is_number(t) else 'No reading' }}
            secondary: >-
              Arm Tilt{{ ' · sensor offline' if not is_number(states('sensor.camper_awning_camper_awning_arm_tilt')) else '' }}
            icon: mdi:angle-acute
            icon_color: >-
              {{ 'teal' if is_number(states('sensor.camper_awning_camper_awning_arm_tilt')) else 'grey' }}
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card { background: #FFFFFF !important; border-radius: 16px !important; border: 1px solid #E3D9C7 !important; margin-top: 8px; --icon-size: 52px !important; }
                ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 800 !important; font-size: 30px !important; }
                ha-card [slot=secondary] { color: #4A463F !important; font-size: 16px !important; }
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.camper_awning_camper_awning_arm_tilt
                name: Arm Tilt
                color: "#3FBCAE"
            hours_to_show: 1
            points_per_hour: 60
            line_width: 4
            height: 90
            show:
              name: false
              icon: false
              state: false
              legend: false
              fill: fade
            card_mod:
              style: |
                ha-card { background: #FFFFFF !important; border-radius: 16px !important; border: 1px solid #E3D9C7 !important; margin-top: 8px; }
          # Wind Shake from the same sensor; retract level = number ..._wind_shake_limit (2026-10-26)
          - type: custom:mushroom-template-card
            entity: sensor.camper_awning_camper_awning_wind_shake
            primary: >-
              {% set w = states('sensor.camper_awning_camper_awning_wind_shake') | float(-1) %}{{ 'No reading' if not is_number(states('sensor.camper_awning_camper_awning_wind_shake')) else 'Strong wind' if w >= (states('number.camper_awning_camper_awning_wind_shake_limit') | float(2)) else 'Breezy' if w >= 1 else 'Calm' }}
            secondary: >-
              Wind Shake{{ ' · ' ~ (states('sensor.camper_awning_camper_awning_wind_shake') | float(0) | round(1)) ~ ' (retracts at ' ~ (states('number.camper_awning_camper_awning_wind_shake_limit') | float(2)) ~ ')' if is_number(states('sensor.camper_awning_camper_awning_wind_shake')) else ' · sensor offline' }}
            icon: mdi:weather-windy
            icon_color: >-
              {% set w = states('sensor.camper_awning_camper_awning_wind_shake') | float(-1) %}{{ 'grey' if not is_number(states('sensor.camper_awning_camper_awning_wind_shake')) else 'red' if w >= (states('number.camper_awning_camper_awning_wind_shake_limit') | float(2)) else 'amber' if w >= 1 else 'green' }}
            tap_action:
              action: more-info
            card_mod:
              style: |
                ha-card { background: #FFFFFF !important; border-radius: 16px !important; border: 1px solid #E3D9C7 !important; margin-top: 8px; --icon-size: 52px !important; }
                ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 800 !important; font-size: 26px !important; }
                ha-card [slot=secondary] { color: #4A463F !important; font-size: 16px !important; }
          - type: custom:mini-graph-card
            entities:
              - entity: sensor.camper_awning_camper_awning_wind_shake
                name: Wind Shake
                color: "#C77DDB"
            hours_to_show: 1
            points_per_hour: 60
            aggregate_func: max
            line_width: 4
            height: 90
            lower_bound: 0
            color_thresholds:
              - value: 0
                color: "#3E9B3E"
              - value: 1
                color: "#E8A874"
              - value: 2
                color: "#D84A3A"
            show:
              name: false
              icon: false
              state: false
              legend: false
              fill: fade
            card_mod:
              style: |
                ha-card { background: #FFFFFF !important; border-radius: 16px !important; border: 1px solid #E3D9C7 !important; margin-top: 8px; }

      # ============================================
      # CALIBRATE (awning ESP32, 2026-10-26)
      # Nudge = 1 s push. Save Closed / Save Open store the arm's direction
      # at each end; Position works once both are saved.
      # ============================================
      - type: custom:stack-in-card
        card_mod: *badge_style
        cards:
          - type: custom:mushroom-title-card
            title: "Calibrate"
            card_mod: *title_style
          - type: custom:mushroom-template-card
            entity: sensor.camper_awning_camper_awning_calibration
            primary: "{{ states('sensor.camper_awning_camper_awning_calibration') }}"
            secondary: >-
              {% set p = states('sensor.camper_awning_camper_awning_position') %}{% set st = states('sensor.camper_awning_camper_awning_status') %}{{ st if st not in ['unknown', 'unavailable', ''] else 'Ready' }}{{ ' · ' ~ (p | int) ~ '% open' if is_number(p) else '' }}
            icon: mdi:tune-variant
            icon_color: "{{ 'green' if is_state('sensor.camper_awning_camper_awning_calibration', 'Calibrated') else 'orange' }}"
            card_mod:
              style: |
                ha-card { background: #FFFFFF !important; border-radius: 16px !important; border: 1px solid #E3D9C7 !important; --icon-size: 52px !important; }
                ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 800 !important; font-size: 24px !important; }
                ha-card [slot=secondary] { color: #4A463F !important; font-size: 18px !important; }
          - type: grid
            columns: 2
            square: false
            cards:
              - &cal_btn
                type: custom:mushroom-template-card
                primary: Nudge Open
                secondary: 1 second out
                icon: mdi:chevron-up-circle
                icon_color: green
                layout: vertical
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.camper_awning_camper_awning_nudge_open
                card_mod:
                  style: |
                    ha-card { background: #FFFFFF !important; border-radius: 16px !important; border: 1px solid #E3D9C7 !important; margin-top: 8px; --icon-size: 64px !important; }
                    ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 800 !important; font-size: 22px !important; }
                    ha-card [slot=secondary] { color: #4A463F !important; font-size: 16px !important; }
              - <<: *cal_btn
                primary: Nudge Close
                secondary: 1 second in
                icon: mdi:chevron-down-circle
                icon_color: blue
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.camper_awning_camper_awning_nudge_close
              - <<: *cal_btn
                primary: Save Closed
                secondary: "Awning all the way in"
                icon: mdi:content-save
                icon_color: grey
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.camper_awning_camper_awning_save_closed_position
                  confirmation:
                    text: Is the awning all the way in (closed)?
              - <<: *cal_btn
                primary: Save Open
                secondary: "Awning all the way out"
                icon: mdi:content-save
                icon_color: orange
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.camper_awning_camper_awning_save_open_position
                  confirmation:
                    text: Is the awning all the way out (fully open)?
          - type: entities
            state_color: true
            entities:
              - entity: sensor.camper_awning_camper_awning_motor_current
                name: Motor Current
              - entity: number.camper_awning_camper_awning_stall_current
                name: Stall Current (stop above)
              - entity: sensor.camper_awning_camper_awning_last_open_time
                name: Last Open Time
              - entity: sensor.camper_awning_camper_awning_last_close_time
                name: Last Close Time
              - entity: number.camper_awning_camper_awning_max_run_time
                name: Max Run Time
              - entity: number.camper_awning_camper_awning_wind_shake_limit
                name: Wind Shake Limit
              - entity: switch.camper_awning_camper_awning_reverse_motor_direction
                name: Reverse Motor Direction
              - entity: switch.camper_awning_camper_awning_bench_test_mode
                name: Bench Test Mode
              - entity: button.camper_awning_camper_awning_clear_calibration
                name: Clear Calibration
