# ============================================
# 🚐 DASHBOARD: CAMPER COMMAND CENTER
# Light beach / pastel theme — badged sections + gauges
# ============================================

title: "🚐 Camper"
theme: "Camper Beach"

background: "#FBF3E7 fixed"

# Big picture buttons for low vision (2026-10-17): Cereal page. variables.item = the
# shopping list item name; green with "On the list" while it's on the list.
button_card_templates:
  shop_pick:
    show_entity_picture: true
    show_icon: true
    show_label: true
    show_state: false
    triggers_update:
      - sensor.shopping_list_items
    label: >
      [[[ const it = (states['sensor.shopping_list_items']?.attributes?.items || []).map(i => i.toLowerCase());
          return it.includes(variables.item.toLowerCase()) ? '✓ On the list' : (variables.hint || 'Tap to add'); ]]]
    styles:
      card:
        - border-radius: 18px
        - padding: 10px 6px 12px 6px
        - background: >
            [[[ const it = (states['sensor.shopping_list_items']?.attributes?.items || []).map(i => i.toLowerCase());
                return it.includes(variables.item.toLowerCase()) ? '#DDF1DD' : '#FFFFFF'; ]]]
        - border: >
            [[[ const it = (states['sensor.shopping_list_items']?.attributes?.items || []).map(i => i.toLowerCase());
                return it.includes(variables.item.toLowerCase()) ? '3px solid #3E9B3E' : '1px solid #E3D9C7'; ]]]
      img_cell:
        - height: 160px
      entity_picture:
        - height: 150px
        - width: auto
        - max-width: 100%
        - object-fit: contain
        - border-radius: 8px
      name:
        - font-size: 18px
        - font-weight: 700
        - color: "#2B2A28"
        - white-space: normal
        - line-height: 1.2
        - padding-top: 6px
      label:
        - font-size: 15px
        - font-weight: 600
        - color: >
            [[[ const it = (states['sensor.shopping_list_items']?.attributes?.items || []).map(i => i.toLowerCase());
                return it.includes(variables.item.toLowerCase()) ? '#2E7D32' : '#6B6558'; ]]]
  # Quick Add grid version: 3 across, smaller picture
  shop_quick:
    template: shop_pick
    styles:
      card:
        - padding: 8px 4px 10px 4px
      img_cell:
        - height: 84px
      entity_picture:
        - height: 76px
      name:
        - font-size: 16px
        - padding-top: 4px
      label:
        - font-size: 13px
  # Picture list slot: shows item number variables.index from sensor.shopping_list_items
  shop_item:
    show_entity_picture: true
    show_icon: true
    show_label: true
    show_state: false
    triggers_update:
      - sensor.shopping_list_items
    name: "[[[ return (states['sensor.shopping_list_items']?.attributes?.items || [])[variables.index] || ''; ]]]"
    entity_picture: "[[[ return (states['sensor.shopping_list_items']?.attributes?.pictures || [])[variables.index] || '/local/shopping/cart.png'; ]]]"
    label: "Tap when you have it"
    styles:
      card:
        - border-radius: 18px
        - padding: 10px 6px 12px 6px
        - background: "#FFFFFF"
        - border: 2px solid #E3D9C7
      img_cell:
        - height: 130px
      entity_picture:
        - height: 120px
        - width: auto
        - max-width: 100%
        - object-fit: contain
        - border-radius: 8px
      name:
        - font-size: 19px
        - font-weight: 700
        - color: "#2B2A28"
        - white-space: normal
        - line-height: 1.2
        - padding-top: 6px
      label:
        - font-size: 14px
        - font-weight: 600
        - color: "#6B6558"

  # Stereo page station preset: big photo (www/stereo, credits in CREDITS.txt), green + "Playing now" when it's the one on
  stereo_preset:
    show_entity_picture: true
    show_icon: true
    show_label: true
    show_state: false
    triggers_update:
      - input_text.stereo_station
      - media_player.camper_stereo
    label: >
      [[[ const on = states['input_text.stereo_station']?.state === variables.station && ['playing','paused'].includes(states['media_player.camper_stereo']?.state);
          return on ? '▶ Playing now' : 'Tap to play'; ]]]
    styles:
      card:
        - border-radius: 18px
        - padding: 10px 6px 12px 6px
        - background: >
            [[[ const on = states['input_text.stereo_station']?.state === variables.station && ['playing','paused'].includes(states['media_player.camper_stereo']?.state);
                return on ? '#DDF1DD' : '#FFFFFF'; ]]]
        - border: >
            [[[ const on = states['input_text.stereo_station']?.state === variables.station && ['playing','paused'].includes(states['media_player.camper_stereo']?.state);
                return on ? '3px solid #3E9B3E' : '1px solid #E3D9C7'; ]]]
      img_cell:
        - height: 130px
      entity_picture:
        - height: 120px
        - width: 120px
        - object-fit: cover
        - border-radius: 14px
        - box-shadow: 0 2px 6px rgba(0,0,0,0.25)
      name:
        - font-size: 19px
        - font-weight: 700
        - color: "#2B2A28"
        - white-space: normal
        - line-height: 1.2
        - padding-top: 6px
      label:
        - font-size: 15px
        - font-weight: 600
        - color: >
            [[[ const on = states['input_text.stereo_station']?.state === variables.station && ['playing','paused'].includes(states['media_player.camper_stereo']?.state);
                return on ? '#2E7D32' : '#6B6558'; ]]]

  # Stereo page playlist buttons: the user's own Spotify playlists (script.stereo_play_station)
  spotify_preset:
    template: stereo_preset
    triggers_update:
      - sensor.camper_spotify
    label: >
      [[[ const s = states['sensor.camper_spotify']; const on = s?.attributes?.playlist === variables.station && ['playing','paused'].includes(s?.state);
          return on ? (s.state === 'paused' ? '⏸ Paused' : '▶ Playing now') : 'Tap to play'; ]]]
    styles:
      card:
        - background: >
            [[[ const s = states['sensor.camper_spotify']; const on = s?.attributes?.playlist === variables.station && ['playing','paused'].includes(s?.state);
                return on ? '#DDF1DD' : '#FFFFFF'; ]]]
        - border: >
            [[[ const s = states['sensor.camper_spotify']; const on = s?.attributes?.playlist === variables.station && ['playing','paused'].includes(s?.state);
                return on ? '3px solid #3E9B3E' : '1px solid #E3D9C7'; ]]]
      label:
        - color: >
            [[[ const s = states['sensor.camper_spotify']; const on = s?.attributes?.playlist === variables.station && ['playing','paused'].includes(s?.state);
                return on ? '#2E7D32' : '#6B6558'; ]]]

  # Stereo page "No Commercials" buttons: YouTube mixes on the TV (script.camper_tv_youtube_music)
  tv_music_preset:
    template: stereo_preset
    triggers_update:
      - input_text.camper_tv_music
      - media_player.bedroom_50_hisense_roku_tv
    label: >
      [[[ const on = states['input_text.camper_tv_music']?.state === variables.station && states['media_player.bedroom_50_hisense_roku_tv']?.attributes?.source === 'YouTube' && ['playing','paused'].includes(states['media_player.bedroom_50_hisense_roku_tv']?.state);
          return on ? '▶ On the TV now' : 'No ads · on TV'; ]]]
    styles:
      card:
        - background: >
            [[[ const on = states['input_text.camper_tv_music']?.state === variables.station && states['media_player.bedroom_50_hisense_roku_tv']?.attributes?.source === 'YouTube' && ['playing','paused'].includes(states['media_player.bedroom_50_hisense_roku_tv']?.state);
                return on ? '#DDF1DD' : '#FFFFFF'; ]]]
        - border: >
            [[[ const on = states['input_text.camper_tv_music']?.state === variables.station && states['media_player.bedroom_50_hisense_roku_tv']?.attributes?.source === 'YouTube' && ['playing','paused'].includes(states['media_player.bedroom_50_hisense_roku_tv']?.state);
                return on ? '3px solid #3E9B3E' : '1px solid #E3D9C7'; ]]]
      label:
        - color: >
            [[[ const on = states['input_text.camper_tv_music']?.state === variables.station && states['media_player.bedroom_50_hisense_roku_tv']?.attributes?.source === 'YouTube' && ['playing','paused'].includes(states['media_player.bedroom_50_hisense_roku_tv']?.state);
                return on ? '#2E7D32' : '#CC0000'; ]]]
        - font-weight: 800

views:
  - title: "🚐 Camper"
    path: camper
    icon: mdi:rv-truck
    badges:
      # Home badge: the sidebar icon can't return to the main page from inside this
      # dashboard (HA ignores clicks on the current dashboard), so this does it.
      - <<: &b_home
          type: custom:mushroom-template-badge
          icon: mdi:rv-truck
          label: Home
          content: Camper
          icon_color: orange
          tap_action:
            action: navigate
            navigation_path: /lovelace-camper/camper
        card_mod: &badge_active
          style: |
            .badge {
              background: #D6EEFB !important;
              border: 2px solid #45B8D0 !important;
              box-shadow: 0 0 10px rgba(69,184,208,0.75) !important;
            }
      - &b_schedule
        <<: &b_schedule_base
          type: custom:mushroom-template-badge
          icon: mdi:calendar-clock
          label: Schedule
          icon_color: deep-orange
          content: >-
            {% set w = now().weekday() %}{% set OT = is_state('input_boolean.camper_overtime_thursday','on') %}
            {{ now().strftime('%a') }} · {% if w == 2 and is_state('input_boolean.camper_trash_out','off') %}Trash out!{% elif w in [6, 0, 1, 2] %}Work 3 PM{% elif w == 3 %}{{ 'Overtime 3 PM' if OT else 'Overtime?' }}{% else %}Day off{% endif %}
          tap_action:
            action: navigate
            navigation_path: /lovelace-camper/schedule
        # Whole badge turns orange on Wednesday until the trash is out
        card_mod:
          style: |
            {% if now().weekday() == 2 and is_state('input_boolean.camper_trash_out','off') %}
            .badge {
              background: #F6A04D !important;
              border: 2px solid #E07B1F !important;
              box-shadow: 0 0 10px rgba(246,160,77,0.8) !important;
            }
            .label, .content { color: #FFFFFF !important; }
            ha-state-icon { color: #FFFFFF !important; }
            {% endif %}
      - &b_water
        type: custom:mushroom-template-badge
        icon: mdi:water
        label: Water
        # Tanks + water pump + water heater (one badge since 2026-10-10)
        icon_color: >-
          {{ 'orange' if is_state('switch.camper_wall_panel_camper_wall_panel_water_heater_gas','on') else ('light-blue' if is_state('switch.camper_wall_panel_camper_wall_panel_water_pump','on') else 'cyan') }}
        content: >-
          {% if is_state('input_boolean.camper_wall_panel_connected','on') %}Fresh {{ states('sensor.camper_wall_panel_camper_wall_panel_fresh_tank_level')|int(0) }}% · {% endif %}Pump {{ 'on' if is_state('switch.camper_wall_panel_camper_wall_panel_water_pump','on') else 'off' }}{{ ' · Heater on' if is_state('switch.camper_wall_panel_camper_wall_panel_water_heater_gas','on') }}
        tap_action:
          action: navigate
          navigation_path: /lovelace-camper/water
      - &b_power
        type: custom:mushroom-template-badge
        icon: mdi:battery-charging-70
        label: Power
        icon_color: light-green
        # Battery + power strip (Power Strip page folded in 2026-10-10)
        content: >-
          {% set n = [states('switch.tp_link_power_strip_63ce_light'), states('switch.tp_link_power_strip_63ce_plug_2'), states('switch.tp_link_power_strip_63ce_plug_3')] | select('eq','on') | list | count %}{% if is_state('input_boolean.camper_wall_panel_connected','off') %}Plugs {{ n }}/3 on{% else %}{{ states('sensor.camper_wall_panel_camper_wall_panel_battery_voltage')|float(0)|round(2) }}V · {{ states('sensor.camper_wall_panel_camper_wall_panel_battery_state_of_charge')|float(0)|round(0)|int }}% · {{ n }}/3 plugs{% endif %}
        tap_action:
          action: navigate
          navigation_path: /lovelace-camper/power
      - &b_awning
        type: custom:mushroom-template-badge
        icon: >-
          {% set s = states('cover.awning') %}
          {% if s == 'open' %}mdi:awning
          {% else %}mdi:awning-outline{% endif %}
        label: Awning
        icon_color: >-
          {% set s = states('cover.awning') %}
          {% if s == 'open' %}orange
          {% elif s in ['opening','closing'] %}yellow
          {% else %}grey{% endif %}
        content: >-
          {% set s = states('cover.awning') %}
          {% if s == 'open' %}Extended
          {% elif s == 'closed' %}Retracted
          {% elif s == 'opening' %}Extending…
          {% elif s == 'closing' %}Retracting…
          {% else %}Unknown{% endif %}
        tap_action:
          action: navigate
          navigation_path: /lovelace-camper/awning
      - &b_lights
        type: custom:mushroom-template-badge
        icon: mdi:lightbulb
        label: Lights
        icon_color: yellow
        content: >-
          {{ [states('input_boolean.camper_interior_lights'), states('light.camper_led_strip'), states('light.camper_rgb_strip')] | select('eq','on') | list | count }}/3 On
        tap_action:
          action: navigate
          navigation_path: /lovelace-camper/lights
      - &b_keurig
        type: custom:mushroom-template-badge
        icon: mdi:coffee
        label: Keurig
        icon_color: >-
          {{ 'orange' if is_state('switch.smart_switch_1','on') else 'grey' }}
        content: >-
          {{ 'On' if is_state('switch.smart_switch_1','on') else 'Off' }}
        tap_action:
          action: perform-action
          perform_action: switch.toggle
          target: { entity_id: switch.smart_switch_1 }
        # Whole badge turns orange while the Keurig is on (icon alone was easy to miss)
        card_mod:
          style: |
            {% if is_state('switch.smart_switch_1','on') %}
            .badge {
              background: #F6A04D !important;
              border: 2px solid #E07B1F !important;
              box-shadow: 0 0 10px rgba(246,160,77,0.8) !important;
            }
            .label, .content { color: #FFFFFF !important; }
            ha-state-icon { color: #FFFFFF !important; }
            {% endif %}
      - &b_ceiling_fan
        <<: &b_ceiling_fan_base
          type: custom:mushroom-template-badge
          icon: >-
            {{ 'mdi:fan-off' if is_state('input_select.camper_ceiling_fan_mode','Stay Off') else 'mdi:fan' }}
          label: Ceiling Fan
          icon_color: >-
            {{ 'orange' if is_state('switch.ceiling_fan','on') else 'grey' }}
          content: >-
            {{ 'On' if is_state('switch.ceiling_fan','on') else 'Off' }}{{ ' · Held' if not is_state('input_select.camper_ceiling_fan_mode','Auto') }}
          # Tap = Ceiling Fan page, hold = on/off
          tap_action:
            action: navigate
            navigation_path: /lovelace-camper/ceilingfan
          hold_action:
            action: perform-action
            perform_action: switch.toggle
            target: { entity_id: switch.ceiling_fan }
          # Double-tap = lock the fan as it is now (Stay On / Stay Off); again = unlock
          double_tap_action:
            action: perform-action
            perform_action: script.camper_ceiling_fan_hold
        # Whole badge: orange = on (Auto, same as the Keurig), purple = held on,
        # slate = held off, plain = off in Auto
        card_mod:
          style: |
            {% set held = not is_state('input_select.camper_ceiling_fan_mode','Auto') %}
            {% set on = is_state('switch.ceiling_fan','on') %}
            {% if held or on %}
            .badge {
              {% if held and on %}
              background: #8E6CD8 !important;
              border: 2px solid #6A4BB5 !important;
              box-shadow: 0 0 10px rgba(142,108,216,0.85) !important;
              {% elif held %}
              background: #5B7083 !important;
              border: 2px solid #3F5263 !important;
              box-shadow: 0 0 10px rgba(91,112,131,0.8) !important;
              {% else %}
              background: #F6A04D !important;
              border: 2px solid #E07B1F !important;
              box-shadow: 0 0 10px rgba(246,160,77,0.8) !important;
              {% endif %}
            }
            .label, .content { color: #FFFFFF !important; }
            ha-state-icon { color: #FFFFFF !important; }
            {% if on %}
            /* spin while the fan is on (2026-10-23) */
            @keyframes fanspin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
            ha-state-icon { display: inline-block !important; animation: fanspin 1.5s linear infinite !important; }
            {% endif %}
            {% endif %}
      - &b_security
        type: custom:mushroom-template-badge
        icon: mdi:shield-home
        label: Security
        icon_color: >-
          {{ 'red' if is_state('binary_sensor.lumi_lumi_sensor_motion_aq2','on') else 'green' }}
        content: >-
          {{ 'Motion' if is_state('binary_sensor.lumi_lumi_sensor_motion_aq2','on') else 'Clear' }}
        tap_action:
          action: navigate
          navigation_path: /lovelace-camper/security
      - &b_climate
        type: custom:mushroom-template-badge
        icon: mdi:thermometer
        label: Climate
        icon_color: cyan
        content: >-
          {{ states('sensor.lumi_lumi_weather_temperature')|round(1, default='–') }}°F · {{ states('sensor.lumi_lumi_weather_humidity')|round(0, default='–') }}%
        tap_action:
          action: navigate
          navigation_path: /lovelace-camper/climate
      - &b_dehumidifier
        type: custom:mushroom-template-badge
        icon: mdi:air-humidifier
        label: Dehumidifier
        icon_color: >-
          {% if is_state('binary_sensor.dehumidifier_tank_full','on') %}red{% elif is_state('humidifier.midea_dehumidifier','on') %}blue{% else %}grey{% endif %}
        content: >-
          {% set s = states('humidifier.midea_dehumidifier') %}{% if s in ['unavailable','unknown'] %}Offline{% elif is_state('binary_sensor.dehumidifier_tank_full','on') %}Tank full{% elif s == 'on' %}On · {{ states('sensor.lumi_lumi_weather_humidity')|round(0, default='–') }}%{% else %}Off{% endif %}
        tap_action:
          action: navigate
          navigation_path: /lovelace-camper/dehumidifier
      - &b_tv
        type: custom:mushroom-template-badge
        icon: mdi:television
        label: TV
        icon_color: >-
          {{ 'grey' if is_state('media_player.bedroom_50_hisense_roku_tv','off') else 'blue' }}
        content: >-
          {% set s = states('media_player.bedroom_50_hisense_roku_tv') %}{% if s == 'off' %}Off{% elif s in ['unknown','unavailable'] %}Offline{% else %}{{ state_attr('media_player.bedroom_50_hisense_roku_tv','source') or 'On' }}{% endif %}
        tap_action:
          action: navigate
          navigation_path: /lovelace-camper/tv
      - &b_stereo
        type: custom:mushroom-template-badge
        icon: mdi:speaker
        label: Stereo
        icon_color: >-
          {% set sp = states('sensor.camper_spotify') %}{% set s = states('media_player.camper_stereo') %}{% if sp == 'playing' or s == 'playing' %}green{% elif sp == 'paused' %}blue{% else %}grey{% endif %}
        content: >-
          {% set sp = states('sensor.camper_spotify') %}{% set pl = state_attr('sensor.camper_spotify','playlist') %}{% if sp == 'playing' %}{{ pl if pl else 'Spotify' }}{% elif sp == 'paused' %}Paused{% elif states('media_player.camper_stereo') == 'playing' %}Playing{% else %}Off{% endif %}
        tap_action:
          action: navigate
          navigation_path: /lovelace-camper/stereo
      - &b_daisy
        <<: &b_daisy_base
          type: custom:mushroom-template-badge
          icon: mdi:dog
          label: Daisy
          icon_color: brown
          content: >-
            {% set c = states('sensor.daisy_care') %}
            {% if c != 'All good' %}{{ c.split(':')[0] }}{% elif is_state('binary_sensor.daisy_home_alone','on') %}Alone {{ relative_time(states.binary_sensor.daisy_home_alone.last_changed) }}{% else %}With family{% endif %}
          tap_action:
            action: navigate
            navigation_path: /lovelace-camper/daisy
        card_mod:
          style: |
            {% if 'Overdue' in states('sensor.daisy_care') or 'today' in states('sensor.daisy_care') %}
            .badge {
              background: #F6A04D !important;
              border: 2px solid #E07B1F !important;
              box-shadow: 0 0 10px rgba(246,160,77,0.8) !important;
            }
            .label, .content { color: #FFFFFF !important; }
            ha-state-icon { color: #FFFFFF !important; }
            {% endif %}
      - &b_upkeep
        <<: &b_upkeep_base
          type: custom:mushroom-template-badge
          icon: mdi:tools
          label: Upkeep
          icon_color: blue-grey
          content: "{{ states('sensor.camper_upkeep') }}"
          tap_action:
            action: navigate
            navigation_path: /lovelace-camper/upkeep
        card_mod:
          style: |
            {% if not is_state('sensor.camper_upkeep','All good') %}
            .badge {
              background: #F6A04D !important;
              border: 2px solid #E07B1F !important;
              box-shadow: 0 0 10px rgba(246,160,77,0.8) !important;
            }
            .label, .content { color: #FFFFFF !important; }
            ha-state-icon { color: #FFFFFF !important; }
            {% endif %}
      - &b_shopping
        type: custom:mushroom-template-badge
        icon: mdi:cart
        label: Shopping
        icon_color: green
        content: >-
          {% set n = states('todo.shopping_list') | int(0) %}{{ 'Empty' if n == 0 else n ~ ' item' ~ ('s' if n > 1 else '') }}
        tap_action:
          action: navigate
          navigation_path: /lovelace-camper/shopping
      - &b_sequoia
        type: custom:mushroom-template-badge
        icon: mdi:car-estate
        label: Sequoia
        icon_color: blue-grey
        content: >-
          {% set last = states('sensor.sequoia_last_update') %}{% if last in ['unknown', 'unavailable', 'None', ''] %}Not set up{% elif (now() - as_datetime(last)).total_seconds() < 120 %}{{ states('sensor.sequoia_gauge_speed') | int(0) }} mph · {{ states('sensor.sequoia_gauge_transmission_temp') | int(0) }}°{% else %}Fuel {{ states('sensor.sequoia_gauge_fuel_level') | int(0) }}%{% endif %}
        tap_action:
          action: navigate
          navigation_path: /lovelace-camper/sequoia
      - &b_drive
        type: custom:mushroom-template-badge
        icon: mdi:steering
        label: Drive
        icon_color: >-
          {% set last = states('sensor.sequoia_last_update') %}{{ 'green' if last not in ['unknown', 'unavailable', 'None', ''] and (now() - as_datetime(last)).total_seconds() < 120 else 'indigo' }}
        content: >-
          {% set last = states('sensor.sequoia_last_update') %}{% if last not in ['unknown', 'unavailable', 'None', ''] and (now() - as_datetime(last)).total_seconds() < 120 %}Driving{% else %}Maps · Gauges{% endif %}
        tap_action:
          action: navigate
          navigation_path: /lovelace-camper/drive
      - &b_fishing
        type: custom:mushroom-template-badge
        icon: mdi:fish
        label: Fishing
        icon_color: >-
          {{ {'Excellent': 'green', 'Good': 'teal', 'Fair': 'amber', 'Slow': 'grey'}.get(states('sensor.fishing_forecast'), 'grey') }}
        content: >-
          {% set w = state_attr('sensor.fishing_forecast', 'in_window') %}{{ states('sensor.fishing_forecast') }}{{ ' · ' ~ w ~ ' now' if w else '' }}
        tap_action:
          action: navigate
          navigation_path: /lovelace-camper/fishing
      - &b_weather
        type: custom:mushroom-template-badge
        icon: >-
