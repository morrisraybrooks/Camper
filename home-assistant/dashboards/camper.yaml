            secondary: >-
              {% set w = states('sensor.underbelly_heater_power') %}{% if is_state('switch.under_camper_heater','on') and w | is_number and w | float < 5 %}⚠️ ON but using 0 watts - check the heater is plugged in · {% elif w | is_number %}Using {{ w | float | round(0) | int }} watts · {% endif %}Turns on below 38°F, off at 45°F
            multiline_secondary: true
            icon: mdi:radiator
            icon_color: >-
              {% if is_state('switch.under_camper_heater','on') %}deep-orange{% elif is_state('switch.under_camper_heater','off') %}grey{% else %}red{% endif %}
            tap_action:
              action: toggle
              confirmation:
                text: "Switch the under-camper heater {{ 'off' if is_state('switch.under_camper_heater','on') else 'on' }}? It will still turn on by itself below 38°F."
            card_mod:
              style: |
                ha-card { opacity: 1 !important; background: #FFFFFF !important; border-radius: 16px !important; border: 1px solid #E3D9C7 !important; margin-top: 8px; }
                ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 700 !important; font-size: 18px !important; }
                ha-card [slot=secondary] { color: #6B6558 !important; }

          # Heater test run (2026-10-26): script.under_camper_heater_test pauses the 38/45 automation
          - type: custom:mushroom-template-card
            entity: script.under_camper_heater_test
            primary: >-
              {{ 'Heater test running - tap to stop' if is_state('script.under_camper_heater_test', 'on') else 'Test heater for 20 minutes' }}
            secondary: >-
              {% if is_state('script.under_camper_heater_test', 'on') %}Ends at {{ ((as_datetime(state_attr('script.under_camper_heater_test', 'last_triggered')) + timedelta(minutes=20)) | as_local).strftime('%-I:%M %p') }}, then the 38/45 automation takes over again{% else %}Runs the heater 20 min, pausing the automatic on/off{% endif %}
            icon: >-
              {{ 'mdi:timer-sand' if is_state('script.under_camper_heater_test', 'on') else 'mdi:play-circle' }}
            icon_color: >-
              {{ 'deep-orange' if is_state('script.under_camper_heater_test', 'on') else 'green' }}
            multiline_secondary: true
