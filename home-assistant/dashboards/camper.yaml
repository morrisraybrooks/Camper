      - <<: *b_shopping
        card_mod: *badge_active
      - *b_sequoia
      - *b_drive
      - *b_fishing
      - *b_weather
    cards:
      - type: markdown
        content: " "
        card_mod:
          style: |
            ha-card {
              --primary-text-color: #2B2A28 !important;
              --secondary-text-color: #6B6558 !important;
              opacity: 1 !important;
              position: fixed !important;
              top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
              z-index: -1 !important;
              border-radius: 0 !important;
              box-shadow: none !important;
              background: {% if is_state('input_select.camper_background','Beach') %}url('/local/backgrounds/ocean-paradise.jpg') center/cover fixed{% elif is_state('input_select.camper_background','Forest') %}url('/local/backgrounds/enchanted-forest.jpg') center/cover fixed{% else %}#FBF3E7 fixed{% endif %} !important;
            }
      # Paper Towels page (2026-10-17): they use Bounty and Viva. Photos: Amazon (private use).
      - type: custom:mushroom-template-card
        primary: "⬅  Back to the Shopping List"
        secondary: "Tap a box to add it. Tap it again to take it off."
        icon: mdi:arrow-left-bold
        icon_color: green
        multiline_secondary: true
        tap_action:
          action: navigate
          navigation_path: /lovelace-camper/shopping
        card_mod:
          style: |
            ha-card { --icon-size: 56px !important; background: linear-gradient(160deg, #FDE9D9, #FBDFC4) !important; border-radius: 22px !important; border: 1px solid rgba(255, 150, 50, 0.5) !important; }
            ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 800 !important; font-size: 22px !important; }
            ha-card [slot=secondary] { color: #4A463F !important; font-size: 16px !important; }
      - type: custom:stack-in-card
        keep: { background: true, border_radius: true }  # picture buttons keep white/green
        card_mod: *badge_style
        cards:
          - type: custom:mushroom-title-card
            title: "🧻 Paper Towels"
            card_mod: *title_style
          - type: grid
            columns: 2
            square: false
            cards:
