  - title: "Schedule"
    path: schedule
    icon: mdi:calendar-clock
    visible: false  # reached via the badge bar, not tabs
    # current page's badge is highlighted light blue
    badges:
      - *b_home
      - <<: *b_schedule_base
        card_mod: *badge_active
      - *b_water
      - *b_power
      - *b_awning
      - *b_lights
      - *b_keurig
      - *b_ceiling_fan
      - *b_security
      - *b_climate
      - *b_dehumidifier
      - *b_tv
      - *b_stereo
      - *b_daisy
      - *b_upkeep
      - *b_shopping
      - *b_sequoia
      - *b_drive
      - *b_fishing
      - *b_weather
    cards:
      - type: markdown
        content: " "
        card_mod:
          style: |
            ha-card {
              --primary-text-color: #2B2A28 !important;
              --secondary-text-color: #6B6558 !important;
              opacity: 1 !important;
              position: fixed !important;
              top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
              z-index: -1 !important;
              border-radius: 0 !important;
              box-shadow: none !important;
              background: {% if is_state('input_select.camper_background','Beach') %}url('/local/backgrounds/ocean-paradise.jpg') center/cover fixed{% elif is_state('input_select.camper_background','Forest') %}url('/local/backgrounds/enchanted-forest.jpg') center/cover fixed{% else %}#FBF3E7 fixed{% endif %} !important;
            }
      - type: custom:mushroom-template-card
        primary: "🗓️ {{ now().strftime('%A, %B %-d') }}"
        secondary: >-
          {% set w = now().weekday() %}{% if w in [6, 0, 1, 2] %}💼 Work tonight - leave at 3:00 PM{% elif w == 3 %}{{ '💼 Overtime tonight - leave at 3:00 PM' if is_state('input_boolean.camper_overtime_thursday','on') else '💼 Optional overtime tonight' }}{% else %}🎉 Day off{% endif %}
          · 🗑️ {{ states('sensor.trash_day') }}
        icon: mdi:calendar-clock
        icon_color: deep-orange
        multiline_secondary: true
        card_mod:
          style: |
            ha-card {
              --primary-text-color: #2B2A28 !important;
              --secondary-text-color: #6B6558 !important;
              opacity: 1 !important;
              background: linear-gradient(160deg, #FDE9D9, #FBDFC4) !important;
              border-radius: 26px !important;
              border: 1px solid rgba(255, 150, 50, 0.5) !important;
              box-shadow: 0 0 24px rgba(255, 130, 30, 0.3), 0 8px 24px rgba(0,0,0,0.5) !important;
            }
            ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 700 !important; font-size: 22px !important; }
            ha-card [slot=secondary] { color: #6B6558 !important; }
      # ============================================
      # THIS WEEK - Morris's work nights + trash
      # ============================================
      - type: custom:stack-in-card
        card_mod:
          style: |
            ha-card {
              --primary-text-color: #2B2A28 !important;
              --secondary-text-color: #6B6558 !important;
              opacity: 1 !important;
              background: linear-gradient(160deg, #FDE9D9, #FBDFC4) !important;
              border-radius: 24px !important;
              border: 1px solid rgba(255, 150, 50, 0.4) !important;
              box-shadow: 0 8px 22px rgba(0,0,0,0.45) !important;
              padding: 14px 14px 16px 14px !important;
            }
        cards:
          - type: custom:mushroom-title-card
            title: "Morris - This Week"
            subtitle: "{{ now().strftime('Today is %A, %B %-d') }}"
            card_mod:
              style: |
                ha-card .title {
                  color: #2B2A28 !important;
                  font-weight: 700 !important;
                  font-size: 15px !important;
                  letter-spacing: 0.5px !important;
                  text-transform: uppercase !important;
                  opacity: 1 !important;
                }
                ha-card .subtitle { color: #C2562A !important; font-weight: 700 !important; font-size: 14px !important; }
                ha-card { padding: 0 0 4px 0 !important; }
          - type: markdown
            content: >-
              {% set OT = is_state('input_boolean.camper_overtime_thursday', 'on') %}
              <table width="100%">
              {% for i in range(7) %}{% set d = now() + timedelta(days=i) %}{% set w = d.weekday() %}{% set prev = (w - 1) % 7 %}
              {% set items = [] %}
              {% if prev in [6, 0, 1, 2] or (prev == 3 and OT) %}{% set items = items + ['🏠 Home ~4 AM'] %}{% endif %}
              {% if w == 2 %}{% set items = items + ['✅ Trash is out' if is_state('input_boolean.camper_trash_out','on') else '🗑️ <b>Trash out</b>'] %}{% endif %}
              {% if w == 3 %}{% set items = items + ['🚛 Pickup AM'] %}{% endif %}
              {% if w in [6, 0, 1, 2] %}{% set items = items + ['💼 <b>Work</b> - leave 3:00'] %}
              {% elif w == 3 %}{% set items = items + ['💼 <b>Overtime</b> - leave 3:00' if OT else '💼 Overtime?'] %}{% endif %}
              <tr{% if i == 0 %} style="background:#FFF4E5"{% endif %}><td><b>{{ 'Today' if i == 0 else ('Tomorrow' if i == 1 else d.strftime('%a')) }}</b><br><small>{{ d.strftime('%a %-m/%-d') }}</small></td>
              <td>{{ items | join('<br>') if items else 'Day off 🎉' }}</td></tr>
              {% endfor %}
              </table>
            card_mod:
              style: |
                ha-card { background: #FFFFFF !important; border-radius: 16px !important; border: 1px solid #E3D9C7 !important; margin: 4px 0 8px 0 !important; }
                ha-card { --primary-text-color: #2B2A28 !important; color: #2B2A28 !important; font-size: 14px !important; }
          - type: horizontal-stack
            cards:
              - &sched_toggle
                <<: &sched_toggle_base
                  type: custom:mushroom-entity-card
                  layout: vertical
                  fill_container: true
                  tap_action: { action: toggle }
                  card_mod:
                    style: |
                      ha-card {
                        --primary-text-color: #2B2A28 !important;
                        --secondary-text-color: #6B6558 !important;
                        opacity: 1 !important;
                        background: {% if is_state(config.entity,'on') %}linear-gradient(145deg,#E3F4EC,#D2EEE2){% else %}#FFFFFF{% endif %} !important;
                        border-radius: 16px !important;
                        border: 1px solid {% if is_state(config.entity,'on') %}#5DBB8A{% else %}#E3D9C7{% endif %} !important;
                      }
                entity: input_boolean.camper_overtime_thursday
                name: Overtime Thu
                icon: mdi:briefcase-clock
              - <<: *sched_toggle_base
                entity: input_boolean.camper_trash_out
                name: Trash Is Out
                icon: mdi:trash-can
      # ============================================
      # THERMOSTAT - work-night schedule (automation thermostat_schedule)
      # Edit times/temps here; work nights come from the Morris schedule above.
      # ============================================
      - type: custom:stack-in-card
        card_mod:
          style: |
            ha-card {
              --primary-text-color: #2B2A28 !important;
              --secondary-text-color: #6B6558 !important;
              opacity: 1 !important;
              background: linear-gradient(160deg, #FDE9D9, #FBDFC4) !important;
              border-radius: 24px !important;
              border: 1px solid rgba(63, 160, 214, 0.45) !important;
              box-shadow: 0 8px 22px rgba(0,0,0,0.45) !important;
              padding: 14px 14px 16px 14px !important;
            }
        cards:
          - type: custom:mushroom-title-card
            title: "Thermostat - Work Nights"
            subtitle: >-
              {% set w = now().weekday() %}{% set OT = is_state('input_boolean.camper_overtime_thursday','on') %}
              {% if is_state('input_boolean.camper_tsched_enabled','off') %}Schedule is off
              {% elif w in [6, 0, 1, 2] or (w == 3 and OT) %}Tonight is a work night
              {% else %}Night off - no schedule tonight{% endif %}
            card_mod:
              style: |
                ha-card .title {
                  color: #2B2A28 !important;
                  font-weight: 700 !important;
                  font-size: 15px !important;
                  letter-spacing: 0.5px !important;
                  text-transform: uppercase !important;
                  opacity: 1 !important;
                }
                ha-card .subtitle { color: #1F7FB8 !important; font-weight: 700 !important; font-size: 14px !important; }
                ha-card { padding: 0 0 4px 0 !important; }
          - type: markdown
            content: >-
              {% set f = 'input_datetime.camper_tsched_' %}
              {% macro pair(p) %}{% set h = states('input_number.camper_tsched_' ~ p ~ '_heat') | int(65) %}{% set c = [states('input_number.camper_tsched_' ~ p ~ '_cool') | int(72), h] | max %}🔥 {{ h }}° · ❄️ {{ c }}°{% endmacro %}
              <table width="100%">
              <tr><td>🌙 <b>{{ today_at(states(f ~ 'night_start')).strftime('%-I:%M %p') }}</b></td><td>Night</td><td><b>{{ pair('night') }}</b></td></tr>
              <tr><td>🏠 <b>{{ today_at(states(f ~ 'home')).strftime('%-I:%M %p') }}</b></td><td>Warm up</td><td><b>{{ pair('home') }}</b></td></tr>
              <tr><td>😴 <b>{{ today_at(states(f ~ 'sleep_start')).strftime('%-I:%M %p') }}</b></td><td>Morning sleep</td><td><b>{{ pair('sleep') }}</b></td></tr>
              <tr><td>⏰ <b>{{ today_at(states(f ~ 'sleep_end')).strftime('%-I:%M %p') }}</b></td><td>Day</td><td><b>{{ pair('day') }}</b></td></tr>
              </table>
