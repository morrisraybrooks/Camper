                  name: Coolant °F
                  min: 100
                  max: 260
                  needle: true
                  segments:
                  - from: 100
                    color: "#64B5F6"
                  - from: 160
                    color: "#43A047"
                  - from: 220
                    color: "#FBC02D"
                  - from: 235
                    color: "#E53935"
                  card_mod: *drive_gauge
                - type: gauge
                  entity: sensor.sequoia_gauge_fuel_level
                  name: Fuel %
                  min: 0
                  max: 100
                  needle: true
                  segments:
                  - from: 0
                    color: "#E53935"
                  - from: 15
                    color: "#FBC02D"
                  - from: 25
                    color: "#43A047"
                  card_mod: *drive_gauge
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.sequoia_gauge_speed
                state: unavailable
            card:
              type: custom:mushroom-template-card
              primary: "Gauges wake up when the truck runs"
              secondary: "Start the Sequoia with the OBD plug in and Torque Pro (or the OBD box) on."
              icon: mdi:car-connected
              icon_color: grey
              multiline_secondary: true
              card_mod:
                style: |
                  ha-tile-icon { --tile-icon-size: 64px; --mdc-icon-size: 40px; }
                  ha-card { --icon-size: 52px !important; background: #FFFFFF !important; border-radius: 18px !important; border: 1px solid #E3D9C7 !important; }
                  ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 700 !important; font-size: 20px !important; white-space: normal !important; }
                  ha-card [slot=secondary] { color: #4A463F !important; font-size: 17px !important; white-space: normal !important; }
      - type: custom:stack-in-card
        keep: { background: true, border_radius: true }
        card_mod: *badge_style
        cards:
          - type: custom:mushroom-title-card
            title: "Camper in tow"
            card_mod: *title_style
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-template-card
                layout: vertical
                icon: "{{ 'mdi:awning' if is_state('cover.awning', 'open') else 'mdi:awning-outline' }}"
                icon_color: "{{ 'red' if states('cover.awning') in ['open', 'opening', 'closing'] else ('green' if is_state('cover.awning', 'closed') else 'grey') }}"
                primary: "Awning"
                secondary: >-
                  {% set s = states('cover.awning') %}{% if s == 'closed' %}In · OK to drive{% elif s == 'open' %}OUT! Bring it in{% elif s in ['opening', 'closing'] %}Moving…{% else %}Not hooked up yet{% endif %}
                multiline_secondary: true
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-camper/awning
                card_mod:
                  style: |
                    ha-card { background: #FFFFFF !important; border-radius: 18px !important; border: 1px solid #E3D9C7 !important; padding: 18px 8px !important; {% if states('cover.awning') in ['open', 'opening', 'closing'] %}background: #FDE2E0 !important; border: 2px solid #E53935 !important;{% endif %} }
                    ha-tile-icon { --tile-icon-size: 84px; --mdc-icon-size: 54px; }
                    ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 800 !important; font-size: 24px !important; }
                    ha-card [slot=secondary] { color: #2B2A28 !important; font-size: 18px !important; font-weight: 700 !important; white-space: normal !important; }
              - type: custom:mushroom-template-card
                layout: vertical
                icon: mdi:thermometer
                icon_color: cyan
                primary: "{{ states('sensor.lumi_lumi_weather_temperature') | round(0, default='–') }}°"
                secondary: "Inside the camper"
                multiline_secondary: true
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-camper/climate
                card_mod: *drive_tile
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_boolean.camper_wall_panel_connected
                    state: "on"
                card:
                  type: custom:mushroom-template-card
                  layout: vertical
                  icon: mdi:water
                  icon_color: light-blue
                  primary: "{{ states('sensor.camper_wall_panel_camper_wall_panel_fresh_tank_level') | int(0) }}%"
                  secondary: "Fresh water"
                  tap_action:
                    action: navigate
                    navigation_path: /lovelace-camper/water
                  card_mod: *drive_tile
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_boolean.camper_wall_panel_connected
                    state: "on"
                card:
                  type: custom:mushroom-template-card
                  layout: vertical
                  icon: mdi:battery-charging-70
                  icon_color: light-green
                  primary: "{{ states('sensor.camper_wall_panel_camper_wall_panel_battery_state_of_charge') | float(0) | round(0) | int }}%"
                  secondary: "Camper battery"
                  tap_action:
                    action: navigate
                    navigation_path: /lovelace-camper/power
                  card_mod: *drive_tile
      - type: custom:mushroom-template-card
        primary: "Before you pull out"
        secondary: "Awning in · Steps up · Hitch pinned and chains on · Trailer lights work · Daisy in the truck"
        icon: mdi:clipboard-check-outline
        icon_color: orange
        multiline_secondary: true
        card_mod:
          style: |
            ha-tile-icon { --tile-icon-size: 64px; --mdc-icon-size: 40px; }
            ha-card { --icon-size: 52px !important; background: linear-gradient(160deg, #FDE9D9, #FBDFC4) !important; border-radius: 18px !important; border: 1px solid rgba(255, 150, 50, 0.5) !important; }
            ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 800 !important; font-size: 21px !important; }
            ha-card [slot=secondary] { color: #4A463F !important; font-size: 18px !important; white-space: normal !important; }

  # Fishing (2026-10-25): pressure trend + solunar feeding windows + sunrise/sunset + moon,
  # scored by /config/fishing/fishing_solunar.py (sensor.fishing_forecast).
  - title: "Fishing"
    path: fishing
    icon: mdi:fish
    visible: false  # reached via the badge bar, not tabs
    badges:
      - *b_home
      - *b_schedule
      - *b_water
      - *b_power
      - *b_awning
      - *b_lights
      - *b_keurig
      - *b_ceiling_fan
      - *b_security
      - *b_climate
      - *b_dehumidifier
      - *b_tv
      - *b_stereo
      - *b_daisy_base
      - *b_upkeep
      - *b_shopping
      - *b_sequoia
      - *b_drive
      - <<: *b_fishing
        card_mod: *badge_active
      - *b_weather
    cards:
      - type: markdown
        content: " "
        card_mod:
          style: |
            ha-card {
              --primary-text-color: #2B2A28 !important;
              --secondary-text-color: #6B6558 !important;
              opacity: 1 !important;
              position: fixed !important;
              top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
              z-index: -1 !important;
              border-radius: 0 !important;
              box-shadow: none !important;
              background: {% if is_state('input_select.camper_background','Beach') %}url('/local/backgrounds/ocean-paradise.jpg') center/cover fixed{% elif is_state('input_select.camper_background','Forest') %}url('/local/backgrounds/enchanted-forest.jpg') center/cover fixed{% else %}#FBF3E7 fixed{% endif %} !important;
            }
      - type: custom:mushroom-template-card
        primary: "🎣 Fishing"
        secondary: >-
          {{ state_attr('sensor.fishing_forecast', 'now_text') or 'Working out today\'s fishing times…' }}
        icon: mdi:fish
        icon_color: >-
          {{ {'Excellent': 'green', 'Good': 'teal', 'Fair': 'amber', 'Slow': 'grey'}.get(states('sensor.fishing_forecast'), 'grey') }}
        multiline_secondary: true
        card_mod:
          style: |
            ha-card {
              --primary-text-color: #2B2A28 !important;
              --secondary-text-color: #6B6558 !important;
              opacity: 1 !important;
              background: linear-gradient(160deg, #FDE9D9, #FBDFC4) !important;
              border-radius: 26px !important;
              border: 1px solid rgba(255, 150, 50, 0.5) !important;
              box-shadow: 0 0 24px rgba(255, 130, 30, 0.3), 0 8px 24px rgba(0,0,0,0.5) !important;
            }
            ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 700 !important; font-size: 22px !important; }
            ha-card [slot=secondary] { color: #4A463F !important; font-size: 16px !important; }
      # Right now: big rating with the reasons
      - type: custom:mushroom-template-card
        entity: sensor.fishing_forecast
        primary: >-
          {{ states('sensor.fishing_forecast') }} fishing right now
        secondary: |-
          {% for r in state_attr('sensor.fishing_forecast', 'reasons') or [] %}• {{ r }}
          {% endfor %}Score {{ state_attr('sensor.fishing_forecast', 'score') }} out of 100
        icon: >-
          {{ 'mdi:fish' if states('sensor.fishing_forecast') in ['Excellent', 'Good'] else 'mdi:fish-off' if states('sensor.fishing_forecast') == 'Slow' else 'mdi:fishbowl-outline' }}
        icon_color: >-
          {{ {'Excellent': 'green', 'Good': 'teal', 'Fair': 'amber', 'Slow': 'grey'}.get(states('sensor.fishing_forecast'), 'grey') }}
        multiline_secondary: true
        tap_action:
          action: more-info
        card_mod:
          style: |
            ha-card {
              opacity: 1 !important;
              background: {{ {'Excellent': '#DDF1DD', 'Good': '#DEF2EF', 'Fair': '#FFF4E5', 'Slow': '#F1EEE8'}.get(states('sensor.fishing_forecast'), '#FFFFFF') }} !important;
              border-radius: 24px !important;
              border: 2px solid {{ {'Excellent': '#3E9B3E', 'Good': '#3FBCAE', 'Fair': '#E8A874', 'Slow': '#C9C2B4'}.get(states('sensor.fishing_forecast'), '#E3D9C7') }} !important;
              --icon-size: 64px !important;
              padding: 14px !important;
            }
            ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 800 !important; font-size: 26px !important; white-space: normal !important; }
            ha-card [slot=secondary] { color: #2B2A28 !important; font-size: 17px !important; line-height: 1.45 !important; white-space: pre-line !important; }
      # Today's best times
      - type: custom:stack-in-card
        card_mod:
          style: |
            ha-card {
              --primary-text-color: #2B2A28 !important;
              --secondary-text-color: #6B6558 !important;
              opacity: 1 !important;
              background: linear-gradient(160deg, #FDE9D9, #FBDFC4) !important;
              border-radius: 24px !important;
              border: 1px solid rgba(255, 150, 50, 0.4) !important;
              box-shadow: 0 8px 22px rgba(0,0,0,0.45) !important;
              padding: 14px 14px 16px 14px !important;
            }
        cards:
          - type: custom:mushroom-title-card
            title: "Today's Best Times"
            subtitle: "🐟🐟 Major = best bite (2 hrs) · 🐟 Minor = good bite (1 hr)"
            card_mod: *title_style
          - type: markdown
            content: |-
              <table width="100%">
              {% for r in state_attr('sensor.fishing_forecast', 'rows') or [] %}
              {% set icon = '🐟🐟' if r.kind == 'Major' else '🐟' if r.kind == 'Minor' else ('🌅' if r.what == 'Sunrise' else '🌇') %}
              <tr><td width="44">{{ icon }}</td><td>{% if r.active %}<b>▶ NOW · {{ r.time }}</b>{% elif r.past %}<i>{{ r.time }}</i>{% else %}<b>{{ r.time }}</b>{% endif %}<br>{{ r.kind ~ ' · ' if r.kind != 'Sun' }}{{ r.what }}{{ ' (done)' if r.past }}</td></tr>
              {% endfor %}
              </table>

              **Tomorrow:** {{ (state_attr('sensor.fishing_forecast', 'tomorrow_majors') or []) | join(' and ') }} ({{ (state_attr('sensor.fishing_forecast', 'tomorrow_rating') or '' ) | lower }} moon day)
            card_mod:
              style: |
                ha-card { background: #FFFFFF !important; border-radius: 18px !important; border: 1px solid #E3D9C7 !important; font-size: 18px !important; }
                ha-markdown { font-size: 18px !important; line-height: 1.35 !important; }
          # Moon
          - type: custom:mushroom-template-card
            primary: >-
              {{ state_attr('sensor.fishing_forecast', 'phase') }}
            secondary: >-
              {{ state_attr('sensor.fishing_forecast', 'illumination') }}% lit · {{ (state_attr('sensor.fishing_forecast', 'day_rating') or '' ) | lower }} moon for fishing (new and full moons are best)
            icon: >-
              {{ state_attr('sensor.fishing_forecast', 'moon_icon') or 'mdi:moon-waxing-crescent' }}
            icon_color: amber
            multiline_secondary: true
            card_mod:
              style: |
                ha-card { opacity: 1 !important; background: #FFFFFF !important; border-radius: 16px !important; border: 1px solid #E3D9C7 !important; margin-top: 8px; --icon-size: 48px !important; }
                ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 700 !important; font-size: 19px !important; }
                ha-card [slot=secondary] { color: #4A463F !important; font-size: 15px !important; }
      # Pressure: the chart, plus what it means for fish
      - type: custom:stack-in-card
        card_mod:
          style: |
            ha-card {
              --primary-text-color: #2B2A28 !important;
              --secondary-text-color: #6B6558 !important;
              opacity: 1 !important;
              background: linear-gradient(160deg, #FDE9D9, #FBDFC4) !important;
              border-radius: 24px !important;
              border: 1px solid rgba(255, 150, 50, 0.4) !important;
              box-shadow: 0 8px 22px rgba(0,0,0,0.45) !important;
              padding: 14px 14px 16px 14px !important;
            }
        cards:
          - type: custom:mushroom-title-card
            title: "Barometric Pressure"
            subtitle: >-
              Now: {{ states('sensor.pressure_trend') }} · {{ states('sensor.barometric_pressure') | float(0) | round(0) | int }} hPa
            card_mod: *title_style
          - type: history-graph
            hours_to_show: 48
            entities:
              - entity: sensor.barometric_pressure
                name: Pressure
            card_mod:
              style: |
                ha-card { background: #FFFFFF !important; border-radius: 18px !important; border: 1px solid #E3D9C7 !important; }
          - type: markdown
            content: |-
              **What the pressure means for fish**
              - ⬇️ **Slowly falling** - best: fish feed ahead of the weather
              - ➡️ **Steady** - good, normal feeding
              - ⏬ **Falling fast** - a short feeding burst, then a storm
              - ⬆️ **Rising** - slower; fish settle after a front
              - ⏫ **Rising fast / high and bright** - slowest: fish go deep
            card_mod:
              style: |
                ha-card { background: #FFFFFF !important; border-radius: 18px !important; border: 1px solid #E3D9C7 !important; margin-top: 8px; }
                ha-markdown { font-size: 17px !important; line-height: 1.45 !important; }

  # Weather page (2026-11-01). Forecast comes from sensor.camper_weather_forecast (template).
  - title: "Weather"
    path: weather
    icon: mdi:weather-partly-cloudy
    visible: false  # reached via the badge bar, not tabs
    badges:
      - *b_home
      - *b_schedule
      - *b_water
      - *b_power
      - *b_awning
      - *b_lights
      - *b_keurig
      - *b_ceiling_fan
      - *b_security
      - *b_climate
      - *b_dehumidifier
      - *b_tv
      - *b_stereo
      - *b_daisy
      - *b_upkeep
      - *b_shopping
      - *b_sequoia
      - *b_drive
      - *b_fishing
      - <<: *b_weather
        card_mod: *badge_active
    cards:
      - type: markdown
        content: " "
        card_mod:
          style: |
            ha-card {
              --primary-text-color: #2B2A28 !important;
              --secondary-text-color: #6B6558 !important;
              opacity: 1 !important;
              position: fixed !important;
              top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
              z-index: -1 !important;
              border-radius: 0 !important;
              box-shadow: none !important;
              background: {% if is_state('input_select.camper_background','Beach') %}url('/local/backgrounds/ocean-paradise.jpg') center/cover fixed{% elif is_state('input_select.camper_background','Forest') %}url('/local/backgrounds/enchanted-forest.jpg') center/cover fixed{% else %}#FBF3E7 fixed{% endif %} !important;
            }
      - type: custom:mushroom-template-card
        primary: "🌤️ Weather"
        secondary: "Outside at the camper"
        icon: mdi:weather-partly-cloudy
        icon_color: amber
        card_mod:
          style: |
            ha-card {
              --primary-text-color: #2B2A28 !important;
              --secondary-text-color: #6B6558 !important;
              opacity: 1 !important;
              background: linear-gradient(160deg, #FDE9D9, #FBDFC4) !important;
              border-radius: 26px !important;
              border: 1px solid rgba(255, 150, 50, 0.5) !important;
              box-shadow: 0 0 24px rgba(255, 130, 30, 0.3), 0 8px 24px rgba(0,0,0,0.5) !important;
            }
            ha-card [slot=primary] { color: #2B2A28 !important; font-weight: 700 !important; font-size: 22px !important; }
            ha-card [slot=secondary] { color: #6B6558 !important; font-size: 16px !important; }

      # Only shows when the National Weather Service has an active alert here.
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.nws_alerts
            state_not: ["None", "unknown", "unavailable", ""]
        card:
          type: custom:button-card
          entity: sensor.nws_alerts
          show_icon: false
          show_name: false
          show_state: false
          tap_action: { action: none }
          triggers_update: [sensor.nws_alert_headline]
          styles:
            card: [{ background: "#B71C1C" }, { border-radius: 22px }, { padding: 16px }]
            grid: [{ grid-template-areas: '"body"' }, { grid-template-columns: 1fr }, { grid-template-rows: auto }]
            custom_fields:
              body: [{ width: 100% }, { white-space: normal }, { text-align: left }, { color: "#FFFFFF" }]
          custom_fields:
            body: |
              [[[
                return `<div style="font-size:28px;font-weight:800;line-height:1.2">⚠️ ${states['sensor.nws_alerts'].state}</div>
                  <div style="font-size:20px;line-height:1.3;margin-top:8px">${states['sensor.nws_alert_headline'].state}</div>`;
              ]]]

      - type: custom:stack-in-card
        card_mod: *badge_style
        cards:
          - type: custom:mushroom-title-card
            title: "Right Now"
            card_mod: *title_style
          - type: custom:button-card
            entity: weather.forecast_home
            show_icon: false
            show_name: false
            show_state: false
            tap_action: { action: none }
            triggers_update: [sensor.camper_weather_forecast, sun.sun, weather.nws, weather.forecast_home, weather.open_meteo]
            # Animated sky for Right Now (2026-11-01).
            extra_styles: |
              .wx { position: relative; overflow: hidden; border-radius: 20px; min-height: 196px; display: flex; align-items: flex-end; }
              .wx-text { position: relative; z-index: 6; margin: 10px; padding: 6px 14px 8px; border-radius: 16px; background: rgba(0,0,0,.42); color: #fff; text-align: left; }
              .wx-sunbox { position: absolute; top: 8px; right: 10px; width: 132px; height: 132px; z-index: 2; }
              .wx-halo { position: absolute; inset: 14px; border-radius: 50%; background: radial-gradient(circle, rgba(255,236,150,.85) 0%, rgba(255,214,90,.45) 48%, rgba(255,214,90,0) 72%); animation: wxpulse 3.5s ease-in-out infinite; }
              .wx-sunsvg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
              .wx-rotor { transform-box: view-box; transform-origin: 60px 60px; animation: wxspin 24s linear infinite; }
              .wx-hot .wx-rotor { animation-duration: 10s; }
              .wx-hot .wx-halo { animation-duration: 1.8s; background: radial-gradient(circle, rgba(255,241,170,.95) 0%, rgba(255,160,40,.55) 50%, rgba(255,160,40,0) 74%); }
              .wx-xmas { min-height: 240px; }
              .wx-santa { position: absolute; top: 4px; left: -320px; width: 300px; z-index: 5; animation: wxsanta 20s linear infinite; }
              .wx-santa svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); animation: wxbob 1.5s ease-in-out infinite alternate; }
              .wx-leg { transform-box: fill-box; transform-origin: 50% 0; animation: wxleg .36s ease-in-out infinite alternate; }
              .wx-leg2 { animation-direction: alternate-reverse; }
              .wx-nose { animation: wxnose 1s ease-in-out infinite alternate; }
              .wx-spark { animation: wxtwinkle 1.1s ease-in-out infinite; }
              .wx-heat { position: absolute; left: -10%; width: 120%; height: 18px; z-index: 3; border-radius: 50%; background: rgba(255,255,255,.28); filter: blur(5px); animation: wxheat 2.6s ease-in-out infinite; }
              .wx-moon { position: absolute; top: 20px; right: 34px; width: 66px; height: 66px; border-radius: 50%; z-index: 2; background: radial-gradient(circle at 38% 36%, #FFFDE7, #CFD8DC); box-shadow: 0 0 26px rgba(255,253,231,.75); }
              .wx-star { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff; z-index: 1; animation: wxtwinkle 3s ease-in-out infinite; }
              .wx-cloud { position: absolute; width: 96px; height: 34px; border-radius: 34px; background: #ECEFF1; z-index: 4; animation: wxdrift ease-in-out infinite alternate; }
              .wx-cloud::before { content: ""; position: absolute; left: 16px; top: -20px; width: 42px; height: 42px; border-radius: 50%; background: inherit; }
              .wx-cloud::after { content: ""; position: absolute; right: 14px; top: -13px; width: 32px; height: 32px; border-radius: 50%; background: inherit; }
              .wx-dark { background: #546E7A; }
              .wx-drop { position: absolute; top: -24px; width: 3px; height: 20px; border-radius: 3px; z-index: 5; background: rgba(207,236,255,.95); animation: wxrain .8s linear infinite; }
              .wx-pour .wx-drop { height: 28px; animation-duration: .5s; }
              .wx-flake { position: absolute; top: -14px; width: 9px; height: 9px; border-radius: 50%; z-index: 5; background: #fff; animation: wxsnow 4s linear infinite; }
              .wx-hail { width: 8px; height: 8px; border-radius: 2px; animation-duration: 1s; }
              .wx-flash { position: absolute; inset: 0; z-index: 3; background: #fff; opacity: 0; animation: wxflash 7s linear infinite; }
              .wx-bolt { position: absolute; z-index: 5; opacity: 0; filter: drop-shadow(0 0 8px #FFF59D); animation: wxflash2 7s linear infinite; }
              .wx-bolt2 { animation-delay: -3.1s; }
              .wx-fog { position: absolute; left: -30%; width: 160%; height: 26px; border-radius: 26px; z-index: 5; background: rgba(255,255,255,.55); filter: blur(7px); animation: wxfog 11s ease-in-out infinite alternate; }
              .wx-gust { position: absolute; left: -40%; width: 40%; height: 4px; border-radius: 4px; z-index: 5; background: rgba(255,255,255,.8); animation: wxgust 2.4s linear infinite; }
              @keyframes wxsanta { 0% { left: -320px; } 70%,100% { left: 105%; } }
              @keyframes wxbob { from { transform: translateY(-3px) rotate(-3deg); } to { transform: translateY(5px) rotate(-1deg); } }
              @keyframes wxleg { from { transform: rotate(-24deg); } to { transform: rotate(26deg); } }
              @keyframes wxnose { from { opacity: .55; r: 2.6px; } to { opacity: 1; r: 4px; } }
              @keyframes wxspin { to { transform: rotate(360deg); } }
              @keyframes wxpulse { 0%,100% { transform: scale(1); opacity: .8; } 50% { transform: scale(1.14); opacity: 1; } }
              @keyframes wxheat { 0%,100% { transform: translateY(0) scaleY(1); opacity: .25; } 50% { transform: translateY(-14px) scaleY(1.6); opacity: .7; } }
              @keyframes wxtwinkle { 50% { opacity: .2; } }
              @keyframes wxdrift { from { transform: translateX(-16px) scale(var(--s,1)); } to { transform: translateX(22px) scale(var(--s,1)); } }
              @keyframes wxrain { to { transform: translate(-14px, 240px); } }
              @keyframes wxsnow { 50% { margin-left: 12px; } to { transform: translateY(230px); } }
              @keyframes wxflash { 0%,88%,90.5%,92%,100% { opacity: 0; } 89% { opacity: .55; } 91% { opacity: .3; } }
              @keyframes wxflash2 { 0%,87.5%,93%,100% { opacity: 0; } 88.5%,92% { opacity: 1; } }
              @keyframes wxfog { from { transform: translateX(-12%); } to { transform: translateX(12%); } }
              @keyframes wxgust { to { transform: translateX(380%); } }
            styles:
              card: [{ background: transparent }, { box-shadow: none }, { padding: 6px 12px 12px }]
              grid: [{ grid-template-areas: '"body"' }, { grid-template-columns: 1fr }, { grid-template-rows: auto }]
              custom_fields:
                body: [{ width: 100% }, { white-space: normal }, { text-align: left }]
            custom_fields:
              body: |
                [[[
                  const em = {'clear-night':'🌙','cloudy':'☁️','fog':'🌫️','hail':'🌨️','lightning':'🌩️','lightning-rainy':'⛈️','partlycloudy':'⛅','pouring':'🌧️','rainy':'🌦️','snowy':'❄️','snowy-rainy':'🌨️','sunny':'☀️','windy':'💨','windy-variant':'💨','exceptional':'⚠️'};
                  const nm = {'clear-night':'Clear','cloudy':'Cloudy','fog':'Foggy','hail':'Hail','lightning':'Lightning','lightning-rainy':'Thunderstorms','partlycloudy':'Partly cloudy','pouring':'Heavy rain','rainy':'Rain','snowy':'Snow','snowy-rainy':'Sleet','sunny':'Sunny','windy':'Windy','windy-variant':'Windy','exceptional':'Severe'};
                  // Measured Weather Service reading first; met.no if it's out.
                  const nw = states['weather.nws'];
                  const w = (nw && nw.attributes.temperature != null) ? nw : states['weather.forecast_home'];
                  if (!w || w.attributes.temperature == null) return `<div style="font-size:24px;color:#2B2A28;background:#fff;border-radius:18px;padding:16px">Weather isn't available right now.</div>`;
                  // The airport sensor only sees clouds below 12,000 ft, so high overcast reads "Clear".
                  // Keep its measured temperature, but if it says clear and a forecast service shows clouds or worse, use that sky.
                  const clearSky = ['sunny','clear-night','partlycloudy'];
                  let cond = w.state;
                  if (clearSky.includes(cond)) { const o = ['weather.forecast_home','weather.open_meteo'].map(e => states[e] && states[e].state).find(s => s && !['unknown','unavailable'].includes(s) && !clearSky.includes(s)); if (o) cond = o; }
                  const a = w.attributes, T = a.temperature, V = a.wind_speed || 0, H = a.humidity || 0;
                  let feels = T;
                  if (T <= 50 && V > 3) feels = 35.74 + 0.6215*T - 35.75*Math.pow(V,0.16) + 0.4275*T*Math.pow(V,0.16);
                  else if (T >= 80) feels = -42.379 + 2.04901523*T + 10.14333127*H - 0.22475541*T*H - 0.00683783*T*T - 0.05481717*H*H + 0.00122874*T*T*H + 0.00085282*T*H*H - 0.00000199*T*T*H*H;
                  feels = Math.round(feels);
                  const f = states['sensor.camper_weather_forecast'];
                  const hrs = (f && f.attributes.hourly) || [];
                  const col = t => t <= 32 ? '#0D47A1' : t >= 90 ? '#B71C1C' : '#2B2A28';
                  let msg, bg;
                  if (feels <= 32) { msg = '🥶 FREEZING. Wear a heavy coat. Watch for ice.'; bg = '#BBDEFB'; }
                  else if (feels <= 45) { msg = '🧥 Cold. Wear a coat.'; bg = '#DCEBFA'; }
                  else if (feels <= 62) { msg = '🧥 Cool. Bring a jacket.'; bg = '#E8F1E4'; }
                  else if (feels <= 82) { msg = '😎 Nice out.'; bg = '#E3F5DC'; }
                  else if (feels < 95) { msg = '🥵 Hot. Drink plenty of water.'; bg = '#FFE3C2'; }
                  else { msg = '🔥 DANGEROUS HEAT. Limit time outside, and keep Daisy cool.'; bg = '#FFCDD2'; }
                  const lines = [];
                  const rainAt = hrs.slice(0,12).find(h => h.p != null ? h.p >= 40 : h.r > 0.005);
                  if (rainAt) lines.push(`☔ Rain possible around ${rainAt.t}${rainAt.p != null ? ' (' + rainAt.p + '% chance)' : ''}`);
                  const nxt = hrs.slice(0,18).map(h => h.f);
                  if (nxt.length && Math.min(...nxt) <= 32 && T > 32) lines.push(`🥶 Freezing ahead: down to ${Math.min(...nxt)}° in the next 18 hours`);
                  const fact = (i,l,v) => `<div style="background:#fff;border:1px solid #E3D9C7;border-radius:16px;padding:10px 12px"><div style="font-size:16px;color:#5A5448">${i} ${l}</div><div style="font-size:24px;font-weight:700;color:#2B2A28">${v}</div></div>`;
                  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
                  const dir = a.wind_bearing != null ? dirs[Math.round(a.wind_bearing/45)%8] : '';
                  const fmt = s => s ? new Date(s).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}) : '--';
                  const sun = states['sun.sun'].attributes;
                  // Animated sky. Fixed positions (no random) so re-renders don't restart it.
                  const c = cond;
                  const night = states['sun.sun'].state === 'below_horizon';
                  const clearish = ['sunny','clear-night','partlycloudy','windy','windy-variant'].includes(c);
                  const thunder = ['lightning','lightning-rainy'].includes(c);
                  const wet = ['rainy','pouring','lightning-rainy','snowy-rainy'].includes(c);
                  const snowy = ['snowy','snowy-rainy'].includes(c);
                  const hot = !night && T >= 85 && ['sunny','partlycloudy'].includes(c);
                  const dark = thunder || c === 'pouring' || c === 'hail';
                  let sky;
                  if (thunder) sky = '#1A2030,#37474F';
                  else if (night) sky = clearish ? '#0B1740,#233A77' : '#1C2533,#3A4656';
                  else if (hot) sky = '#D84315,#FF9800';
                  else if (c === 'sunny' || c === 'windy' || c === 'windy-variant') sky = '#1565C0,#4FA3E3';
                  else if (c === 'partlycloudy') sky = '#2A70B8,#6FA7D6';
                  else if (['rainy','pouring','hail','snowy-rainy'].includes(c)) sky = '#37474F,#607D8B';
                  else if (c === 'snowy') sky = '#546E7A,#90A4AE';
                  else sky = '#546E7A,#8497A3';
                  const cloud = (x,y,s,d,dk) => `<div class="wx-cloud ${dk?'wx-dark':''}" style="right:${x}px;top:${y}px;--s:${s};animation-duration:${d}s"></div>`;
                  let fx = '';
                  if (night && clearish) { fx += '<div class="wx-moon"></div>'; for (let i=0;i<14;i++) fx += `<div class="wx-star" style="left:${(i*29+7)%96}%;top:${(i*17+6)%62}%;animation-delay:-${(i*0.4).toFixed(1)}s"></div>`; }
                  if (!night && clearish) {
                    const rays = [...Array(12).keys()].map(i => `<path d="M60 ${i%2?13:5} Q64 ${i%2?22:17} 65 28 L55 28 Q56 ${i%2?22:17} 60 ${i%2?13:5} Z" transform="rotate(${i*30} 60 60)"/>`).join('');
                    const c1 = hot ? '#FFF8D6' : '#FFFBE0', c2 = hot ? '#FFC21A' : '#FFD84D', c3 = hot ? '#FF8A00' : '#FFB300';
                    fx += `<div class="wx-sunbox"><div class="wx-halo"></div><svg class="wx-sunsvg" viewBox="0 0 120 120"><defs><radialGradient id="wxdisc" cx="42%" cy="38%" r="68%"><stop offset="0%" stop-color="${c1}"/><stop offset="55%" stop-color="${c2}"/><stop offset="100%" stop-color="${c3}"/></radialGradient></defs><g class="wx-rotor" fill="${hot ? '#FFA726' : '#FFD54F'}">${rays}</g><circle cx="60" cy="60" r="29" fill="url(#wxdisc)"/></svg></div>`;
                  }
                  if (hot) for (let i=0;i<3;i++) fx += `<div class="wx-heat" style="bottom:${6+i*24}px;animation-delay:-${(i*0.8).toFixed(1)}s"></div>`;
                  if (c === 'partlycloudy') fx += cloud(84,88,1,10,false) + cloud(196,34,.7,14,false);
                  if (c === 'cloudy') fx += cloud(170,40,1.1,12,false) + cloud(20,30,1.3,9,false) + cloud(96,84,1,15,true);
                  if (wet || thunder || snowy || c === 'hail') fx += cloud(190,28,1.1,12,dark) + cloud(92,40,1.35,9,dark) + cloud(8,24,1.2,14,dark);
                  if (wet) { const n = c === 'pouring' ? 46 : 26; for (let i=0;i<n;i++) fx += `<div class="wx-drop" style="left:${(i*37+3)%100}%;animation-delay:-${(i*0.11).toFixed(2)}s"></div>`; }
                  if (snowy) for (let i=0;i<20;i++) fx += `<div class="wx-flake" style="left:${(i*41+5)%100}%;animation-delay:-${(i*0.37).toFixed(2)}s"></div>`;
                  if (c === 'hail') for (let i=0;i<24;i++) fx += `<div class="wx-flake wx-hail" style="left:${(i*37+5)%100}%;animation-delay:-${(i*0.09).toFixed(2)}s"></div>`;
                  if (thunder) { const b = (r,t,sz,cl) => `<svg class="wx-bolt ${cl}" style="right:${r}px;top:${t}px" width="${sz}" height="${sz*2}" viewBox="0 0 40 80"><polygon points="24,0 4,44 18,44 10,80 38,30 22,30 32,0" fill="#FFEB3B" stroke="#FFF" stroke-width="2"/></svg>`; fx += '<div class="wx-flash"></div>' + b(60,48,46,'') + b(165,44,38,'wx-bolt2'); }
                  if (c === 'fog') for (let i=0;i<5;i++) fx += `<div class="wx-fog" style="top:${i*38+6}px;animation-delay:-${i*2}s"></div>`;
                  if (c === 'windy' || c === 'windy-variant') for (let i=0;i<6;i++) fx += `<div class="wx-gust" style="top:${i*28+22}px;animation-delay:-${(i*0.5).toFixed(1)}s"></div>`;
                  // Santa flies across the sky Dec 1-26, in any weather (2026-11-01).
                  const today0 = new Date();
                  const xmas = today0.getMonth() === 11 && today0.getDate() <= 26;
                  if (xmas) {
                    const deer = (x, nose) => `<g transform="translate(${x} 0)">
                      <path class="wx-leg" d="M-13 50 L-16 66" stroke="#5D3A1F" stroke-width="3.4" stroke-linecap="round"/><path class="wx-leg wx-leg2" d="M-7 51 L-8 67" stroke="#6D4525" stroke-width="3.4" stroke-linecap="round"/>
                      <path class="wx-leg wx-leg2" d="M8 51 L8 67" stroke="#5D3A1F" stroke-width="3.4" stroke-linecap="round"/><path class="wx-leg" d="M14 50 L17 66" stroke="#6D4525" stroke-width="3.4" stroke-linecap="round"/>
                      <ellipse cx="0" cy="44" rx="20" ry="10" fill="#8D5A2B"/><ellipse cx="0" cy="48" rx="13" ry="5" fill="#C49A6C"/><rect x="-3" y="34.5" width="6" height="19.5" rx="3" fill="#C62828"/><circle cx="0" cy="55" r="3" fill="#FFD54F" stroke="#B8860B" stroke-width=".7"/><path d="M-19 40 L-26 34 L-22 44 Z" fill="#F5E6D3"/>
                      <path d="M12 42 Q18 30 21 22 L29 26 Q26 38 20 48 Z" fill="#8D5A2B"/><rect x="11" y="37" width="14" height="4" rx="2" transform="rotate(-60 18 39)" fill="#C62828"/>
                      <path d="M21 13 L18 2 M19.5 7 L13 4 M18.5 3 L14 -2 M27 13 L29 2 M28 7 L34 4" stroke="#6B4A2B" stroke-width="2.2" stroke-linecap="round" fill="none"/>
                      <path d="M18 14 L13 11 L18 19 Z" fill="#6D4525"/><ellipse cx="27" cy="19" rx="10" ry="7" fill="#9C6A36"/><ellipse cx="33" cy="21" rx="5" ry="4" fill="#C49A6C"/><circle cx="26" cy="16.5" r="2.8" fill="#FFF"/><circle cx="26.7" cy="16.7" r="1.7" fill="#111"/><path d="M31 25 Q34 27 37 24.5" stroke="#4A2C14" stroke-width="1" fill="none" stroke-linecap="round"/>
                      ${nose ? '<circle cx="38" cy="20" r="8" fill="#FF1744" opacity=".35"/><circle class="wx-nose" cx="38" cy="20" r="4" fill="#FF1744"/>' : '<circle cx="38" cy="20" r="2.6" fill="#2B1A10"/>'}</g>`;
                    const sparks = [[-16,30,3],[-30,46,2.2],[-44,26,2.6],[-58,42,1.8]].map((s,i) => `<path class="wx-spark" style="animation-delay:-${i*0.3}s" transform="translate(${s[0]} ${s[1]}) scale(${s[2]})" d="M0 -2 L.5 -.5 L2 0 L.5 .5 L0 2 L-.5 .5 L-2 0 L-.5 -.5 Z" fill="#FFE082"/>`).join('');
                    fx += `<div class="wx-santa"><svg viewBox="-60 -6 360 90" role="img" aria-label="Santa and his sleigh">
                      ${sparks}
                      <path d="M75 34 Q112 26 156 33 M75 34 Q140 18 218 33 M75 34 Q170 12 280 33" stroke="#FFD54F" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                      <path d="M96 48 L118 46 M154 46 L180 46 M216 46 L242 46" stroke="#FFD54F" stroke-width="3.2" stroke-linecap="round"/>
                      <circle cx="17" cy="34" r="16" fill="#7A5230"/><path d="M8 20 Q17 13 26 20 L22 25 L12 25 Z" fill="#5C3D22"/><rect x="11" y="19" width="12" height="3" rx="1.5" fill="#FFD54F"/>
                      <circle cx="52" cy="40" r="17" fill="#D32F2F"/><path d="M60 37 L74 34" stroke="#D32F2F" stroke-width="7" stroke-linecap="round"/><circle cx="75" cy="34" r="3.6" fill="#212121"/>
                      <g><circle cx="46" cy="27" r="6" fill="#FFF"/><circle cx="50" cy="35" r="7" fill="#FFF"/><circle cx="58" cy="38" r="7.5" fill="#FFF"/><circle cx="66" cy="35" r="7" fill="#FFF"/><circle cx="70" cy="27" r="6" fill="#FFF"/><circle cx="58" cy="28" r="11" fill="#FFF"/></g>
                      <circle cx="58" cy="17" r="12" fill="#FFDCC0"/><circle cx="49.5" cy="20" r="3.2" fill="#F48FA0"/><circle cx="66.5" cy="20" r="3.2" fill="#F48FA0"/>
                      <path d="M49 13.5 Q52 11 55 13.5 M61 13.5 Q64 11 67 13.5" stroke="#FFF" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="52" cy="16.5" r="1.9" fill="#2B2B2B"/><circle cx="64" cy="16.5" r="1.9" fill="#2B2B2B"/><circle cx="52.6" cy="15.9" r=".6" fill="#FFF"/><circle cx="64.6" cy="15.9" r=".6" fill="#FFF"/>
                      <path d="M52 27 Q58 34 64 27 Z" fill="#C62828"/><ellipse cx="52.5" cy="24.5" rx="6" ry="3" transform="rotate(-12 52.5 24.5)" fill="#FFF"/><ellipse cx="63.5" cy="24.5" rx="6" ry="3" transform="rotate(12 63.5 24.5)" fill="#FFF"/><circle cx="58" cy="21" r="3" fill="#F7A99A"/>
                      <path d="M46 9 Q40 -3 28 2 Q24 5 26 10 Q34 5 45 13 Z" fill="#D32F2F"/><path d="M46 9 Q50 -9 62 -8 Q72 -6 71 9 Z" fill="#D32F2F"/><circle cx="26" cy="11" r="4.6" fill="#FFF"/><rect x="43.5" y="6" width="29" height="7" rx="3.5" fill="#FFF"/>
                      <path d="M2 42 Q2 66 26 67 L78 67 Q94 66 98 40 L78 46 Q74 52 60 52 L28 52 Q14 52 12 34 Z" fill="#C62828" stroke="#FFD54F" stroke-width="2.4" stroke-linejoin="round"/>
                      <path d="M16 67 L14 76 M72 67 L74 76" stroke="#FFD54F" stroke-width="3" stroke-linecap="round"/><path d="M-6 73 Q-10 79 0 79 L88 79 Q102 78 106 66" stroke="#FFD54F" stroke-width="3.6" fill="none" stroke-linecap="round"/>
                      ${deer(136,false)}${deer(198,false)}${deer(260,true)}
                    </svg></div>`;
                  }
                  return `<div class="wx ${hot?'wx-hot':''} ${c==='pouring'?'wx-pour':''} ${xmas?'wx-xmas':''}" style="background:linear-gradient(180deg,${sky})">${fx}
                      <div class="wx-text"><div style="font-size:78px;font-weight:800;line-height:1">${Math.round(T)}°</div>
                      <div style="font-size:26px;font-weight:700;line-height:1.2">${nm[cond]||cond}</div>
                      ${Math.abs(feels-T) >= 2 ? `<div style="font-size:20px;font-weight:600">Feels like ${feels}°</div>` : ''}</div></div>
                    <div style="background:${bg};border-radius:16px;padding:12px 14px;margin-top:10px;font-size:24px;font-weight:700;line-height:1.25;color:#1E1D1B">${msg}</div>
                    ${lines.map(l => `<div style="background:#FFF4D6;border-radius:16px;padding:10px 14px;margin-top:8px;font-size:21px;font-weight:600;line-height:1.25;color:#1E1D1B">${l}</div>`).join('')}
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
                      ${fact('💨','Wind',`${Math.round(V)} mph ${dir}`)}
                      ${fact('💧','Humidity',`${Math.round(H)}%`)}
                      ${fact('🌅','Sunrise',fmt(sun.next_rising))}
                      ${fact('🌇','Sunset',fmt(sun.next_setting))}
                    </div>`;
                ]]]

      - type: custom:stack-in-card
        card_mod: *badge_style
        cards:
          - type: custom:mushroom-title-card
            title: "Next 12 Hours"
            card_mod: *title_style
          - type: custom:button-card
            entity: sensor.camper_weather_forecast
            show_icon: false
            show_name: false
            show_state: false
            tap_action: { action: none }
            styles:
              card: [{ background: transparent }, { box-shadow: none }, { padding: 6px 12px 12px }]
              grid: [{ grid-template-areas: '"body"' }, { grid-template-columns: 1fr }, { grid-template-rows: auto }]
              custom_fields:
                body: [{ width: 100% }, { white-space: normal }]
            custom_fields:
              body: |
                [[[
                  const em = {'clear-night':'🌙','cloudy':'☁️','fog':'🌫️','hail':'🌨️','lightning':'🌩️','lightning-rainy':'⛈️','partlycloudy':'⛅','pouring':'🌧️','rainy':'🌦️','snowy':'❄️','snowy-rainy':'🌨️','sunny':'☀️','windy':'💨','windy-variant':'💨','exceptional':'⚠️'};
                  const hrs = (entity && entity.attributes.hourly) || [];
                  if (!hrs.length) return `<div style="font-size:22px;color:#2B2A28;background:#fff;border-radius:16px;padding:14px">Forecast is loading.</div>`;
                  const col = t => t <= 32 ? '#0D47A1' : t >= 90 ? '#B71C1C' : '#2B2A28';
                  return `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">` + hrs.slice(0,12).map(h => `<div style="background:#fff;border:1px solid #E3D9C7;border-radius:14px;padding:8px 2px;text-align:center">
                      <div style="font-size:17px;font-weight:600;color:#2B2A28">${h.t}</div>
                      <div style="font-size:36px;line-height:1.2">${em[h.c]||'🌡️'}</div>
                      <div style="font-size:26px;font-weight:800;color:${col(h.f)}">${h.f}°</div>
                      <div style="font-size:16px;font-weight:600;color:#0B5C8A;min-height:20px">${h.p != null ? (h.p >= 20 ? '☔ ' + h.p + '%' : '') : (h.r > 0.005 ? '☔ ' + h.r.toFixed(2) + '"' : '')}</div>
                    </div>`).join('') + `</div>`;
                ]]]

      - type: custom:stack-in-card
        card_mod: *badge_style
        cards:
          - type: custom:mushroom-title-card
            title: "Coming Days"
            card_mod: *title_style
          - type: custom:button-card
            entity: sensor.camper_weather_forecast
            show_icon: false
            show_name: false
            show_state: false
            tap_action: { action: none }
            styles:
              card: [{ background: transparent }, { box-shadow: none }, { padding: 6px 12px 12px }]
              grid: [{ grid-template-areas: '"body"' }, { grid-template-columns: 1fr }, { grid-template-rows: auto }]
              custom_fields:
                body: [{ width: 100% }, { white-space: normal }]
            custom_fields:
              body: |
                [[[
                  const em = {'clear-night':'🌙','cloudy':'☁️','fog':'🌫️','hail':'🌨️','lightning':'🌩️','lightning-rainy':'⛈️','partlycloudy':'⛅','pouring':'🌧️','rainy':'🌦️','snowy':'❄️','snowy-rainy':'🌨️','sunny':'☀️','windy':'💨','windy-variant':'💨','exceptional':'⚠️'};
                  const days = (entity && entity.attributes.daily) || [];
                  if (!days.length) return `<div style="font-size:22px;color:#2B2A28;background:#fff;border-radius:16px;padding:14px">Forecast is loading.</div>`;
                  const col = t => t <= 32 ? '#0D47A1' : t >= 90 ? '#B71C1C' : '#2B2A28';
                  const today = new Date().toLocaleDateString('en-US', {weekday:'long'});
                  return days.map(d => `<div style="background:#fff;border:1px solid #E3D9C7;border-radius:16px;padding:8px 12px;margin-bottom:6px;display:flex;align-items:center;gap:10px">
                      <div style="font-size:40px;line-height:1">${em[d.c]||'🌡️'}</div>
                      <div style="flex:1;min-width:0;text-align:left"><div style="font-size:22px;font-weight:700;color:#2B2A28">${d.d === today ? 'Today' : d.d}</div>
                        <div style="font-size:16px;font-weight:600;color:#0B5C8A;min-height:20px">${d.p != null ? (d.p >= 20 ? '☔ ' + d.p + '% chance of rain' : '') : (d.r > 0.005 ? '☔ Rain ' + d.r.toFixed(2) + '"' : '')}</div></div>
                      <div style="text-align:right;white-space:nowrap"><div style="font-size:30px;font-weight:800;line-height:1.1;color:${col(d.hi)}">${d.hi}°</div>
                        ${d.lo != null ? `<div style="font-size:20px;font-weight:600;color:${col(d.lo)}">low ${Math.round(d.lo)}°</div>` : ''}</div>
                    </div>`).join('') + `<div style="font-size:16px;color:#3F3A32;padding:4px 2px 0">Temperatures from met.no. Rain chances from the Weather Service. Updated ${entity.state}.</div>`;
                ]]]

      # Three services side by side (2026-11-01): NWS, met.no, Open-Meteo.
      - type: custom:stack-in-card
        card_mod: *badge_style
        cards:
          - type: custom:mushroom-title-card
            title: "Three Forecasts Compared"
            card_mod: *title_style
          - type: custom:button-card
            entity: sensor.camper_weather_forecast
            show_icon: false
            show_name: false
            show_state: false
            tap_action: { action: none }
            triggers_update: [weather.nws, weather.forecast_home, weather.open_meteo]
            styles:
              card: [{ background: transparent }, { box-shadow: none }, { padding: 6px 12px 12px }]
              grid: [{ grid-template-areas: '"body"' }, { grid-template-columns: 1fr }, { grid-template-rows: auto }]
              custom_fields:
                body: [{ width: 100% }, { white-space: normal }]
            custom_fields:
              body: |
                [[[
                  const a = (entity && entity.attributes) || {};
                  const now = e => { const s = states[e]; return s && s.attributes.temperature != null ? Math.round(s.attributes.temperature) + '°' : '--'; };
                  const hi = v => v != null ? Math.round(v) + '°' : '--';
                  const rows = [['🏛️','Weather Service','weather.nws',a.nws_hi],['🛰️','Met.no','weather.forecast_home',a.met_hi],['🌍','Open-Meteo','weather.open_meteo',a.om_hi]];
                  const head = `<div style="display:grid;grid-template-columns:1fr 62px 92px;gap:6px;padding:0 12px 4px;font-size:16px;font-weight:700;color:#3F3A32;text-align:center"><div></div><div>Now</div><div>Tomorrow's high</div></div>`;
                  return head + rows.map(r => `<div style="display:grid;grid-template-columns:1fr 62px 92px;gap:6px;align-items:center;background:#fff;border:1px solid #E3D9C7;border-radius:16px;padding:10px 12px;margin-bottom:6px">
                      <div style="font-size:20px;font-weight:700;line-height:1.2;text-align:left;color:#2B2A28">${r[0]} ${r[1]}</div>
                      <div style="font-size:28px;font-weight:800;text-align:center;color:#2B2A28">${now(r[2])}</div>
                      <div style="font-size:28px;font-weight:800;text-align:center;color:#2B2A28">${hi(r[3])}</div>
                    </div>`).join('') + `<div style="font-size:16px;line-height:1.3;color:#3F3A32;padding:4px 2px 0">Weather Service "Now" is measured at the Shelby airport. The other two are computer estimates.</div>`;
                ]]]

