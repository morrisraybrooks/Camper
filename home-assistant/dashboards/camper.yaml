  - title: "Dawn"
    path: dawn
    icon: mdi:bottle-tonic-outline
    visible: false  # reached via the badge bar, not tabs
    badges:
      - *b_home
      - *b_schedule
      - *b_water
      - *b_power
      - *b_awning
      - *b_lights
      - *b_keurig
      - *b_ceiling_fan
      - *b_security
      - *b_climate
      - *b_dehumidifier
      - *b_tv
      - *b_stereo
      - *b_daisy
      - *b_upkeep
      - <<: *b_shopping
        card_mod: *badge_active
      - *b_sequoia
      - *b_drive
      - *b_fishing
      - *b_weather
    cards:
      - type: markdown
        content: " "
        card_mod:
          style: |
            ha-card {
              --primary-text-color: #2B2A28 !important;
              --secondary-text-color: #6B6558 !important;
              opacity: 1 !important;
              position: fixed !important;
              top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
              z-index: -1 !important;
              border-radius: 0 !important;
              box-shadow: none !important;
              background: {% if is_state('input_select.camper_background','Beach') %}url('/local/backgrounds/ocean-paradise.jpg') center/cover fixed{% elif is_state('input_select.camper_background','Forest') %}url('/local/backgrounds/enchanted-forest.jpg') center/cover fixed{% else %}#FBF3E7 fixed{% endif %} !important;
