                    ha-card { background: #FFFFFF !important; border-radius: 18px !important; border: 1px solid #E3D9C7 !important; padding-bottom: 6px !important; }
                    .name { font-size: 19px !important; font-weight: 700 !important; color: #2B2A28 !important; }
