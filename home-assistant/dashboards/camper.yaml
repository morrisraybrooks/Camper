  - title: "Ceiling Fan"
    path: ceilingfan
    icon: mdi:fan
    visible: false  # reached via the badge bar, not tabs
    # current page's badge keeps its on/locked colors plus a light-blue ring
    badges:
      - *b_home
      - *b_schedule
      - *b_water
      - *b_power
      - *b_awning
      - *b_lights
      - *b_keurig
      - <<: *b_ceiling_fan_base
        card_mod:
          style: |
            .badge { outline: 3px solid #45B8D0 !important; outline-offset: 2px !important; }
            {% set held = not is_state('input_select.camper_ceiling_fan_mode','Auto') %}
            {% set on = is_state('switch.ceiling_fan','on') %}
            {% if held or on %}
