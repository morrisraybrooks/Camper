      # ============================================
      # THERMOSTAT - simple, like the wall unit (2026-10-08)
      # One temperature, one -/+, four modes. "Auto" = the thermostat's own Auto
      # (2026-10-11; was HA's Smart Auto). Setpoints live in input_number.camper_smart_*.
      # ============================================
      - type: custom:stack-in-card
        card_mod: *badge_style
        cards:
          # Wall-panel look (2026-10-10): big inside temp, outside weather left,
          # mode + fan right, and "Cool to" / "Heat to" pills that only show for
          # the active mode (both in Auto). Pill -/+ = script.camper_thermostat_nudge.
          - type: custom:button-card
            entity: climate.easytouch_31_7f_98_77_f8_d1_easytouch_climate
            show_name: false
            show_icon: false
            show_state: false
            tap_action: { action: none }
            hold_action: { action: more-info }
            styles:
              grid:
                - grid-template-areas: '"left temp right" "pills pills pills"'
                - grid-template-columns: 58px 1fr 58px
                - grid-template-rows: auto auto
                - row-gap: 10px
              custom_fields:
                left: [align-self: start, justify-self: center]
                temp: [align-self: center, justify-self: center]
                right: [align-self: start, justify-self: center]
                pills: [justify-self: stretch]
            extra_styles: |
              ha-card {
                background: linear-gradient(165deg, #44598A 0%, #2A3A66 50%, #1C2749 100%) !important;
                border-radius: 22px !important;
                border: 5px solid #14181F !important;
                box-shadow: inset 0 0 18px rgba(0,0,0,0.45), 0 6px 16px rgba(0,0,0,0.35) !important;
                padding: 12px 10px 24px 10px !important; /* room for the pill glow */
                color: #FFFFFF !important;
              }
              .col { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
              .small { font-size: 11px; font-weight: 700; color: #DCE6FF; line-height: 1.1; }
              .num { font-size: 22px; font-weight: 800; color: #FFFFFF; line-height: 1; }
              .big { font-size: 96px; font-weight: 600; line-height: 0.95; color: #FFFFFF; text-shadow: 0 2px 6px rgba(0,0,0,0.35); }
              .status { font-size: 13px; font-weight: 600; color: #DCE6FF; margin-top: 4px; line-height: 1.3; }
              @keyframes fanspin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
              .fanspin { display: inline-block; animation: fanspin linear infinite; }
            custom_fields:
              left: |
                [[[
                  const e = entity;
                  const w = states['weather.forecast_home'];
                  const icons = { 'clear-night': 'mdi:weather-night', 'cloudy': 'mdi:weather-cloudy', 'fog': 'mdi:weather-fog',
                    'hail': 'mdi:weather-hail', 'lightning': 'mdi:weather-lightning', 'lightning-rainy': 'mdi:weather-lightning-rainy',
                    'partlycloudy': 'mdi:weather-partly-cloudy', 'pouring': 'mdi:weather-pouring', 'rainy': 'mdi:weather-rainy',
                    'snowy': 'mdi:weather-snowy', 'snowy-rainy': 'mdi:weather-snowy-rainy', 'sunny': 'mdi:white-balance-sunny',
                    'windy': 'mdi:weather-windy', 'windy-variant': 'mdi:weather-windy-variant' };
                  const ok = e && !['unavailable', 'unknown'].includes(e.state);
                  const out = w && w.attributes.temperature != null ? Math.round(w.attributes.temperature) : '--';
                  return `<div class="col">
                    <ha-icon icon="${ok ? 'mdi:bluetooth' : 'mdi:bluetooth-off'}" style="--mdc-icon-size:24px;color:${ok ? '#5BE36B' : '#FF6B6B'}"></ha-icon>
                    <ha-icon icon="${icons[w ? w.state : ''] || 'mdi:weather-cloudy'}" style="--mdc-icon-size:40px;color:${w && w.state === 'sunny' ? '#FFD54F' : '#FFFFFF'}"></ha-icon>
                    <div class="small">Outside</div><div class="num">${out}</div></div>`;
                ]]]
              temp: |
                [[[
                  const e = entity;
                  const m = e.state;
                  const a = e.attributes.hvac_action;
                  const smart = states['input_boolean.camper_smart_auto'].state === 'on' && ['cool', 'heat'].includes(m);
                  const cur = e.attributes.current_temperature;
                  let s;
                  if (['unavailable', 'unknown'].includes(m)) s = 'Thermostat not responding';
                  else if (m === 'off') s = 'Off';
                  else if (smart && m === 'cool') s = `Auto · ❄️ cooling${a === 'cooling' ? ' now' : ''}<br>switches to heat at ${parseInt(states['input_number.camper_smart_heat_to'].state) - 2}°`;
                  else if (smart && m === 'heat') s = `Auto · 🔥 heating${a === 'heating' ? ' now' : ''}<br>switches to cool at ${parseInt(states['input_number.camper_smart_cool_to'].state) + 1}°`;
                  else if (m === 'cool') s = `❄️ Cool${a === 'cooling' ? ' · running now' : ''}`;
                  else if (m === 'heat') s = `🔥 Heat${a === 'heating' ? ' · running now' : ''}`;
                  else if (m === 'auto') s = `Auto · heats below ${e.attributes.target_temp_low}°<br>cools above ${e.attributes.target_temp_high}°`;
                  else if (m === 'fan_only') s = 'Fan only';
                  else if (m === 'dry') s = 'Dry';
                  else s = m;
                  // Big number is blue for cooling, red for heating, like the wall panel.
                  // A running cycle wins; otherwise the mode decides (Auto idle stays white).
                  const blue = '#3FA9FF', red = '#FF2E48';
                  const num = a === 'cooling' ? blue : a === 'heating' ? red : m === 'cool' ? blue : m === 'heat' ? red : '#FFFFFF';
                  return `<div class="col"><div class="big" style="color:${num}">${cur != null ? Math.round(cur) : '--'}</div><div class="status">${s}</div></div>`;
                ]]]
