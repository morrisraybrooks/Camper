            secondary: >-
              Tap to turn {{ 'off' if is_state('switch.under_camper_heater','on') else 'on' }}{{ ' · automatic heater rule is paused' if is_state('automation.under_camper_heater_on_below_38_off_at_45','off') }}
            multiline_secondary: true
            icon: mdi:power-socket-us
            icon_color: >-
              {% if is_state('switch.under_camper_heater','on') %}deep-orange{% elif is_state('switch.under_camper_heater','off') %}grey{% else %}red{% endif %}
            tap_action:
              action: toggle
