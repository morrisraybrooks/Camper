# Spotify on the camper stereo (2026-10-25): the official Spotify app runs on the ODROID
# (192.168.0.169) and its sound goes to the Jetson's Bluetooth speaker. HA controls it over
# SSH with its own key (/config/.ssh/id_ed25519) via ~/.local/bin/camper-spotify there.
# Spotify Premium = no commercials.
shell_command:
  camper_spotify: >-
    ssh -i /config/.ssh/id_ed25519 -o UserKnownHostsFile=/config/.ssh/known_hosts -o BatchMode=yes -o ConnectTimeout=5 morris@192.168.0.169 ".local/bin/camper-spotify {{ cmd }}"

command_line:
  # Fishing page (2026-10-25): rating, feeding windows and moon from
  # /config/fishing/fishing_solunar.py, fed the live pressure trend and wind every 5 min.
  - sensor:
      name: Fishing Forecast
      unique_id: fishing_forecast
      icon: mdi:fish
      command: >-
        python3 /config/fishing/fishing_solunar.py
        {{ state_attr('zone.home', 'latitude') }} {{ state_attr('zone.home', 'longitude') }} America/New_York
        "{{ states('sensor.pressure_trend') }}"
        {{ ((state_attr('weather.forecast_home', 'wind_speed') | float(0)) * (0.621 if state_attr('weather.forecast_home', 'wind_speed_unit') == 'km/h' else 1)) | round(0) }}
      value_template: "{{ value_json.rating }}"
      json_attributes: [score, reasons, now_text, in_window, rows, tomorrow_majors, tomorrow_rating, phase, illumination, day_rating, moon_icon, trend, wind_mph]
      scan_interval: 300
      command_timeout: 30
  - sensor:
      name: Camper Spotify
      unique_id: camper_spotify_status
      icon: mdi:spotify
      command: >-
        ssh -i /config/.ssh/id_ed25519 -o UserKnownHostsFile=/config/.ssh/known_hosts -o BatchMode=yes -o ConnectTimeout=5 morris@192.168.0.169 ".local/bin/camper-spotify status"
      value_template: "{{ value_json.state | default('off') }}"
      json_attributes: [title, artist, art, volume, playlist_uri, playlist]
      scan_interval: 10
      command_timeout: 15
