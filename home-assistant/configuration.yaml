# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js

# Lovelace UI Configuration (YAML Mode - file managed)
lovelace:
  resource_mode: yaml
  resources:
    - url: /hacsfiles/lovelace-mushroom/mushroom.js
      type: module
    - url: /hacsfiles/lovelace-card-mod/card-mod.js
      type: module
    - url: /hacsfiles/button-card/button-card.js
      type: module
    - url: /hacsfiles/stack-in-card/stack-in-card.js
      type: module
    # Home page indoor/outdoor temperature graph (2026-10-25)
    - url: /hacsfiles/mini-graph-card/mini-graph-card-bundle.js
      type: module
  dashboards:
    lovelace-camper:
      mode: yaml
      filename: dashboards/camper.yaml
      title: "🚐 Camper"
      icon: mdi:rv-truck
      show_in_sidebar: true
      require_admin: false
    # Phone version (2026-10-18): generated from camper.yaml by
    # dashboards/make_phone_dashboard.py - big tile grid instead of the badge bar.
    lovelace-phone:
      mode: yaml
      filename: dashboards/camper_phone.yaml
      title: "📱 Phone"
      icon: mdi:cellphone
      show_in_sidebar: true
      require_admin: false

sensor:
  # 2016 Toyota Sequoia (5.7 V8, tows the camper) OBD-II (2026-10-17): ELM327 mini (Bluetooth)
  # -> Torque Pro on Morris's Android phone -> uploads to /api/torque. Sensors appear as
  # "Sequoia <PID>" after the first drive. "email" is just the matching key typed into
  # Torque's "User email address" setting.
  - platform: torque
    email: vehicle@camper.local
    name: Sequoia

  # Read Aloud: lists the .txt files in www/read_aloud (attribute file_list)
  - platform: folder
    folder: /config/www/read_aloud
    filter: "*.txt"

  - platform: feedparser
    name: Breaking News
    feed_url: https://feeds.bbci.co.uk/news/world/rss.xml
    scan_interval:
      minutes: 15
    date_format: "%a, %b %d %I:%M %p"
    local_time: true
    show_topn: 10
    inclusions:
      - title
      - link
      - published

  # Barometric pressure change over the last 3h / range over 6h (sensor.barometric_pressure,
  # one physical Aqara sensor; switched from lumi_lumi_weather_pressure after the 2026-10-25 swap).
  # Feeds sensor.pressure_trend and the storm alert in automations/storm_alert.yaml.
  - platform: statistics
    name: Pressure Change 3h
    unique_id: camper_pressure_change_3h
    entity_id: sensor.barometric_pressure
    state_characteristic: change
    max_age:
      hours: 3
    sampling_size: 1000
    precision: 1
  - platform: statistics
    name: Pressure Range 6h
    unique_id: camper_pressure_range_6h
    entity_id: sensor.barometric_pressure
    state_characteristic: distance_absolute
    max_age:
      hours: 6
    sampling_size: 2000
    precision: 1

# Automations - Load multiple automation files
# All automations live in automations.yaml (UI-editable). The old automations/ folder only holds backups.
automation: !include automations.yaml

script: !include scripts.yaml
scene: !include scenes.yaml

